name: Set up Conda environment with Pixi
description: Create a Conda environment based on the environments section in pixi.toml
inputs:
  environment:
    description: Pixi environment name in pixi.toml to use.
    required: true
  pixi-version:
    description: Pixi version to install.
    default: v0.82.1
runs:
  using: composite
  steps:
  - name: Install ${{ inputs.environment }}
    uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
    with:
      pixi-version: ${{ inputs.pixi-version }}
      log-level: vv
      manifest-path: pixi.toml
      environments: ${{ inputs.environment }}
      cache: true
      cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
    if: ${{ inputs.environment != 'pyarrow-nightly' }}
  - name: Install ${{ inputs.environment }}
    uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
    with:
      pixi-version: ${{ inputs.pixi-version }}
      log-level: vv
      manifest-path: pixi.toml
      run-install: false
      cache: false
    if: ${{ inputs.environment == 'pyarrow-nightly' }}
  - name: Install PyArrow Nightly
    if: ${{ inputs.environment == 'pyarrow-nightly' }}
    shell: sh
    run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

      cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

      pixi update -e pyarrow-nightly pyarrow

      pixi install -e pyarrow-nightly

      BUILDPROF_SCRIPT_EOF

      ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

      bp_rc=0

      "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Install-PyArrow-Nightly.buildprof" -- bash -euox pipefail "$bp_dir/$bp_id.sh" || bp_rc=$?

      kill $bp_watch 2>/dev/null; exit $bp_rc

      '
