name: Run tests and report results
description: Run pytest and upload the results to Codecov
inputs:
  environment:
    description: Virtual environment in pixi.toml to run tests.
    required: true
  numprocesses:
    description: pytest-xdist numprocesses value
    required: true
  pytest_marker_expression:
    description: pytest marker expression to pass to -m.
    required: true
  pytest_target:
    description: File or directory path to run tests
    required: true
  pandas_future:
    description: Value for the PANDAS_FUTURE environment variable. "default" uses the default value of every future config, "legacy" sets configs whose default has changed back to their old values, and "upcoming" enables configs whose default has not yet changed. Configs whose non-default values do not yet pass the test suite are exempt; see _register_future_option in pandas/core/config_init.py.
    default: default
runs:
  using: composite
  steps:
  - name: Test
    env:
      PANDAS_FUTURE: ${{ inputs.pandas_future }}
      MESONPY_EDITABLE_VERBOSE: 1
      PYTHONDEVMODE: 1
      PYTHONWARNDEFAULTENCODING: 1
      QT_QPA_PLATFORM: offscreen
      INPUTS_ENVIRONMENT: ${{ inputs.environment }}
      INPUTS_PYTEST_MARKER_EXPRESSION: ${{ inputs.pytest_marker_expression }}
      INPUTS_NUMPROCESSES: ${{ inputs.numprocesses }}
      INPUTS_PYTEST_TARGET: ${{ inputs.pytest_target }}
    run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\npixi run \\\n  --environment \"${INPUTS_ENVIRONMENT}\" \\\n  ci-test-pandas \\\n  \"-m ${INPUTS_PYTEST_MARKER_EXPRESSION}\" \\\n  \"${INPUTS_NUMPROCESSES}\" \\\n  \"${INPUTS_PYTEST_TARGET}\"\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Test.buildprof\" -- bash -euox pipefail \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
    shell: sh
