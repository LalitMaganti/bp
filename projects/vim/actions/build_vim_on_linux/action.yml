name: Build Vim on Linux
description: Build Vim on Linux
inputs:
  features:
    description: Vim features
    required: true
  compiler:
    description: Compiler
    required: true
  architecture:
    description: Architecture
    required: false
  extra:
    description: Extra flags
    required: true
  shadow:
    description: Shadow directory
    required: false
  interface:
    description: Interface of language interpreter
    required: false
  lua_ver:
    description: Lua version
    required: false
  python3:
    description: Python3 ABI type
    required: false
  coverage:
    description: Enable coverage
    required: false
runs:
  using: composite
  steps:
  - name: Check Filelist (for packaging)
    shell: sh
    run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

      cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

      echo ''::group::Check Filelist (for packaging)''

      # If any files in the repository are not listed in Filelist this will

      # exit with an error code and list the missing entries.

      make -f ci/unlisted.make

      echo ''::endgroup::''

      BUILDPROF_SCRIPT_EOF

      ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

      bp_rc=0

      "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Check-Filelist-for-packaging.buildprof" -- bash --noprofile --norc -eo pipefail "$bp_dir/$bp_id.sh" || bp_rc=$?

      kill $bp_watch 2>/dev/null; exit $bp_rc

      '
  - name: Check hlgroups (are any new hlgroups added, but not handled in highlight.c)
    shell: sh
    run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

      cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

      echo ''::group::Check hlgroups (are any new hlgroups added, but not handled in highlight.c)''

      # If any highlight groups have been documented, but not handled in

      # highlight.c, nor listed as ''intentionally left out'' in hlgroups.ignore,

      # exit with an error code and list the missing entries.

      make -C ci -f hlgroups.make

      echo ''::endgroup::''

      BUILDPROF_SCRIPT_EOF

      ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

      bp_rc=0

      "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Check-hlgroups-are-any-new-hlgroups-adde.buildprof" -- bash --noprofile --norc -eo pipefail "$bp_dir/$bp_id.sh" || bp_rc=$?

      kill $bp_watch 2>/dev/null; exit $bp_rc

      '
  - name: Report executable syntax tests
    if: contains(fromJSON(inputs.extra), 'syn_test_execs')
    shell: sh
    run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

      cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

      echo ''::group::Report executable syntax tests''

      # Search and list all found executable syntax tests, and exit with

      # an error code.

      make -C runtime/syntax executables

      echo ''::endgroup::''

      BUILDPROF_SCRIPT_EOF

      ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

      bp_rc=0

      "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Report-executable-syntax-tests.buildprof" -- bash --noprofile --norc -eo pipefail "$bp_dir/$bp_id.sh" || bp_rc=$?

      kill $bp_watch 2>/dev/null; exit $bp_rc

      '
  - name: Add i386 packages to dpkg
    if: inputs.architecture == 'i386'
    shell: sh
    run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

      cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

      echo ''::group::Add i386 packages to dpkg''

      sudo dpkg --add-architecture i386

      echo ''::endgroup::''

      BUILDPROF_SCRIPT_EOF

      ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

      bp_rc=0

      "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Add-i386-packages-to-dpkg.buildprof" -- bash --noprofile --norc -eo pipefail "$bp_dir/$bp_id.sh" || bp_rc=$?

      kill $bp_watch 2>/dev/null; exit $bp_rc

      '
  - name: Uninstall snap
    shell: sh
    run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

      cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

      echo ''::group::Uninstall snap''

      sudo bash ci/remove_snap.sh

      echo ''::endgroup::''

      BUILDPROF_SCRIPT_EOF

      ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

      bp_rc=0

      "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Uninstall-snap.buildprof" -- bash --noprofile --norc -eo pipefail "$bp_dir/$bp_id.sh" || bp_rc=$?

      kill $bp_watch 2>/dev/null; exit $bp_rc

      '
  - name: Enable debug packages
    shell: sh
    run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

      cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

      echo ''::group::Enable debug packages''

      # Some of the ASAN suppressions are in libraries linked with dlopen

      # and symbolization of them requires these debug packages.

      sudo apt install ubuntu-dbgsym-keyring

      sudo cp ci/ddebs.list /etc/apt/sources.list.d/ddebs.list

      sudo cp ci/pinned-pkgs /etc/apt/preferences.d/pinned-pkgs

      echo ''::endgroup::''

      BUILDPROF_SCRIPT_EOF

      ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

      bp_rc=0

      "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Enable-debug-packages.buildprof" -- bash --noprofile --norc -eo pipefail "$bp_dir/$bp_id.sh" || bp_rc=$?

      kill $bp_watch 2>/dev/null; exit $bp_rc

      '
  - name: Install packages
    shell: sh
    run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\necho '::group::Install packages'\n# This is added by default, and it is often broken, but we don't need anything from it\nsudo rm -f /etc/apt/sources.list.d/microsoft-prod.list\nPKGS=( \\\n  gettext \\\n  x11-utils \\\n  labwc \\\n  wl-clipboard \\\n  wayland-utils \\\n  libgtk-3-dev:${{ inputs.architecture }} \\\n  libgtk-3-bin:${{ inputs.architecture }} \\\n  libgtk-4-dev:${{ inputs.architecture }} \\\n  libgtk-4-bin:${{ inputs.architecture }} \\\n  desktop-file-utils \\\n  libc6-dbgsym:${{ inputs.architecture }} \\\n  libtool-bin \\\n  libncurses-dev:${{ inputs.architecture }} \\\n  libxt-dev:${{ inputs.architecture }} \\\n  libegl-mesa0:${{ inputs.architecture }} \\\n  libegl1:${{ inputs.architecture }} \\\n  libegl1-mesa-dev:${{ inputs.architecture }} \\\n  libepoxy-dev:${{ inputs.architecture }} \\\n  libwayland-egl1:${{ inputs.architecture }} \\\n  libwayland-client0:${{ inputs.architecture }} \\\n  libwayland-cursor0:${{ inputs.architecture }} \\\n  locales-all \\\n  software-properties-common \\\n)\nif ${{ contains(fromJSON(inputs.extra), 'asan') }} && ${{ contains(inputs.architecture, 'native') }}; then\nPKGS+=( \\\n  libepoxy0-dbgsym:${{ inputs.architecture }} \\\n  libxdamage1-dbgsym:${{ inputs.architecture }} \\\n  libxcb1-dbgsym:${{ inputs.architecture }} \\\n  libgtk-3-bin-dbgsym:${{ inputs.architecture }} \\\n  libgtk-3-0t64-dbgsym:${{ inputs.architecture }} \\\n  libgtk-4-bin-dbgsym:${{ inputs.architecture }} \\\n  libgtk-4-0t64-dbgsym:${{ inputs.architecture }} \\\n  libglib2.0-0t64-dbgsym:${{ inputs.architecture }} \\\n  libglib2.0-bin-dbgsym:${{ inputs.architecture }} \\\n  libglib2.0-dev-bin-dbgsym:${{ inputs.architecture }} \\\n)\nfi\nif ${{ inputs.features == 'huge' }}; then\n  LUA_VER=${{ inputs.lua_ver || '5.4' }}\n  PKGS+=( \\\n    autoconf \\\n    gdb \\\n    lcov \\\n    libcanberra-dev \\\n    libperl-dev \\\n    python3-dev \\\n    liblua${LUA_VER}-dev \\\n    lua${LUA_VER} \\\n    ruby-dev \\\n    tcl-dev \\\n    cscope \\\n    libsodium-dev \\\n    attr \\\n    libattr1-dev\n  )\nfi\nif ${{ contains(fromJSON(inputs.extra), 'proto') }}; then\n  PKGS+=( python3-clang )\nfi\nsudo apt-get update && sudo apt-get upgrade -y --allow-downgrades && sudo apt-get install -y --allow-downgrades \"${PKGS[@]}\"\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Install-packages.buildprof\" -- bash --noprofile --norc -eo pipefail \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
  - name: Install gcc-${{ env.GCC_VER }}
    if: inputs.compiler == 'gcc'
    shell: sh
    run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

      cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

      echo ''::group::Install gcc-${{ env.GCC_VER }}''

      # ubuntu-toolchain-r/test PPA for gcc-13 compiler

      # disabled because the installation failed, causing test failures

      # sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y

      sudo apt-get update -y

      sudo apt-get install -y gcc-${{ env.GCC_VER }}:${{ inputs.architecture }}

      sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-${{ env.GCC_VER }} 100

      sudo update-alternatives --set gcc /usr/bin/gcc-${{ env.GCC_VER }}

      echo ''::endgroup::''

      BUILDPROF_SCRIPT_EOF

      ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

      bp_rc=0

      "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Install-gcc-env-GCC-VER.buildprof" -- bash --noprofile --norc -eo pipefail "$bp_dir/$bp_id.sh" || bp_rc=$?

      kill $bp_watch 2>/dev/null; exit $bp_rc

      '
  - name: Install clang-${{ env.CLANG_VER }}
    if: inputs.compiler == 'clang'
    shell: sh
    run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

      cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

      echo ''::group::Install clang-${{ env.CLANG_VER }}''

      . /etc/lsb-release

      curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor | sudo tee /usr/share/keyrings/llvm-archive-keyring.gpg > /dev/null

      echo "Types: deb

      URIs: https://apt.llvm.org/${DISTRIB_CODENAME}/

      Suites: llvm-toolchain-${DISTRIB_CODENAME}-${{ env.CLANG_VER }}

      Components: main

      Signed-By: /usr/share/keyrings/llvm-archive-keyring.gpg" | sudo tee /etc/apt/sources.list.d/llvm-toolchain.sources > /dev/null

      sudo apt-get update -y

      sudo apt-get install -y clang-${{ env.CLANG_VER }} llvm-${{ env.CLANG_VER }}

      sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-${{ env.CLANG_VER }} 100

      sudo update-alternatives --set clang /usr/bin/clang-${{ env.CLANG_VER }}

      sudo update-alternatives --install /usr/bin/llvm-cov llvm-cov /usr/bin/llvm-cov-${{ env.CLANG_VER }} 100

      sudo update-alternatives --install /usr/bin/asan_symbolize asan_symbolize /usr/bin/asan_symbolize-${{ env.CLANG_VER }} 100

      echo ''::endgroup::''

      BUILDPROF_SCRIPT_EOF

      ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

      bp_rc=0

      "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Install-clang-env-CLANG-VER.buildprof" -- bash --noprofile --norc -eo pipefail "$bp_dir/$bp_id.sh" || bp_rc=$?

      kill $bp_watch 2>/dev/null; exit $bp_rc

      '
  - name: Set up environment
    shell: sh
    run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\necho '::group::Set up environment'\nmkdir -p \"${LOG_DIR}\"\nmkdir -p \"${HOME}/bin\"\necho \"${HOME}/bin\" >> $GITHUB_PATH\n(\necho \"LINUX_VERSION=$(uname -r)\"\necho \"NPROC=$(getconf _NPROCESSORS_ONLN)\"\necho \"TMPDIR=$(mktemp -d -p /tmp)\"\n\ncase \"${{ inputs.features }}\" in\ntiny)\n  echo \"TEST=testtiny\"\n  if ${{ contains(fromJSON(inputs.extra), 'nogui') }}; then\n    CONFOPT=\"--disable-gui\"\n  fi\n  ;;\nnormal)\n  ;;\nhuge)\n  echo \"TEST=scripttests test_libvterm indenttest syntaxtest\"\n  INTERFACE=${{ inputs.interface || 'yes' }}\n  if ${{ inputs.python3 == 'stable-abi' }}; then\n    PYTHON3_CONFOPT=\"--with-python3-stable-abi=3.8\"\n  fi\n  # The ubuntu-24.04 CI runner does not provide a python2 package.\n  CONFOPT=\"--enable-perlinterp=${INTERFACE} --enable-pythoninterp=no --enable-python3interp=${INTERFACE} --enable-rubyinterp=${INTERFACE} --enable-luainterp=${INTERFACE} --enable-tclinterp=${INTERFACE} ${PYTHON3_CONFOPT}\"\n  ;;\nesac\n\nif ${{ contains(fromJSON(inputs.extra), 'no_x11_wl') }}; then\n  CONFOPT=\"${CONFOPT} --without-x --disable-gui --without-wayland --enable-socketserver\"\nfi\nif ${{ inputs.coverage == 'true' }}; then\n  CFLAGS=\"${CFLAGS} --coverage -DUSE_GCOV_FLUSH\"\n  echo \"LDFLAGS=--coverage\"\nfi\nif ${{ contains(fromJSON(inputs.extra), 'uchar') }}; then\n  CFLAGS=\"${CFLAGS} -funsigned-char\"\nfi\nif ${{ contains(fromJSON(inputs.extra), 'testgui') }}; then\n  echo \"TEST=-C src testgui\"\nfi\nif ${{ contains(fromJSON(inputs.extra), 'use_gtk4') }}; then\n  CONFOPT=\"${CONFOPT} --enable-gui=gtk4\"\nfi\nif ${{ contains(fromJSON(inputs.extra), 'unittests') }}; then\n  echo \"TEST=unittests\"\nfi\nif ${{ contains(fromJSON(inputs.extra), 'asan') }}; then\n  echo \"SANITIZER_CFLAGS=-g -O0 -DABORT_ON_INTERNAL_ERROR -DEXITFREE -fsanitize-recover=all -fsanitize=address -fsanitize=undefined -fno-omit-frame-pointer\"\n  echo \"ASAN_OPTIONS=print_stacktrace=1:log_path=${LOG_DIR}/asan\"\n  echo \"UBSAN_OPTIONS=print_stacktrace=1:log_path=${LOG_DIR}/ubsan\"\n  echo \"LSAN_OPTIONS=suppressions=${GITHUB_WORKSPACE}/src/testdir/lsan-suppress.txt\"\nfi\nif ${{ contains(fromJSON(inputs.extra), 'vimtags') }}; then\n  echo \"TEST=-C runtime/doc vimtags VIMEXE=../../${SRCDIR}/vim\"\nfi\nif ${{ contains(fromJSON(inputs.extra), 'proto') }}; then\n  echo \"TEST=-C src protoclean proto\"\nfi\necho \"CFLAGS=${CFLAGS}\"\necho \"CONFOPT=${CONFOPT}\"\n# Disables GTK attempt to integrate with the accessibility service that does run in CI.\necho \"NO_AT_BRIDGE=1\"\n) >> $GITHUB_ENV\necho '::endgroup::'\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Set-up-environment.buildprof\" -- bash --noprofile --norc -eo pipefail \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
  - name: Set up system
    shell: sh
    run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\necho '::group::Set up system'\nif [[ ${CC} = clang ]]; then\n  # Use llvm-cov instead of gcov when compiler is clang.\n  ln -fs /usr/bin/llvm-cov ${HOME}/bin/gcov\nfi\nsudo sysctl -w net.ipv6.conf.lo.disable_ipv6=0\nsudo usermod -a -G audio \"${USER}\"\nsudo bash ci/setup-xvfb.sh\nif ${{ contains(fromJSON(inputs.extra), 'use_gtk4') }}; then\n  sudo bash ci/setup-weston.sh\nfi\necho '::endgroup::'\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Set-up-system.buildprof\" -- bash --noprofile --norc -eo pipefail \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
  - name: Check autoconf
    if: contains(fromJSON(inputs.extra), 'unittests')
    shell: sh
    run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

      cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

      echo ''::group::Check autoconf''

      make -C src autoconf

      echo ''::endgroup::''

      BUILDPROF_SCRIPT_EOF

      ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

      bp_rc=0

      "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Check-autoconf.buildprof" -- bash --noprofile --norc -eo pipefail "$bp_dir/$bp_id.sh" || bp_rc=$?

      kill $bp_watch 2>/dev/null; exit $bp_rc

      '
  - name: Set up shadow dir
    if: inputs.shadow
    shell: sh
    run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

      cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

      echo ''::group::Set up shadow dir''

      make -C src shadow

      echo "SRCDIR=${{ inputs.shadow }}" >> $GITHUB_ENV

      echo "SHADOWOPT=-C ${{ inputs.shadow }}" >> $GITHUB_ENV

      echo ''::endgroup::''

      BUILDPROF_SCRIPT_EOF

      ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

      bp_rc=0

      "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Set-up-shadow-dir.buildprof" -- bash --noprofile --norc -eo pipefail "$bp_dir/$bp_id.sh" || bp_rc=$?

      kill $bp_watch 2>/dev/null; exit $bp_rc

      '
  - name: Configure
    shell: sh
    run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\necho '::group::Configure'\n./configure --with-features=${{ inputs.features }} ${CONFOPT} --enable-fail-if-missing\n# Append various warning flags to CFLAGS.\nsed -i -f ci/config.mk.sed ${SRCDIR}/auto/config.mk\nsed -i -f ci/config.mk.${CC}.sed ${SRCDIR}/auto/config.mk\nif [[ ${CC} = clang ]]; then\n  # Suppress some warnings produced by clang 12 and later.\n  sed -i -f ci/config.mk.clang-12.sed ${SRCDIR}/auto/config.mk\nfi\necho '::endgroup::'\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Configure.buildprof\" -- bash --noprofile --norc -eo pipefail \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
  - name: Build
    if: (!contains(fromJSON(inputs.extra), 'unittests'))
    shell: sh
    run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

      cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

      echo ''::group::Build''

      make ${SHADOWOPT} -j${NPROC}

      echo ''::endgroup::''

      BUILDPROF_SCRIPT_EOF

      ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

      bp_rc=0

      "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Build.buildprof" -- bash --noprofile --norc -eo pipefail "$bp_dir/$bp_id.sh" || bp_rc=$?

      kill $bp_watch 2>/dev/null; exit $bp_rc

      '
  - name: Check version
    if: (!contains(fromJSON(inputs.extra), 'unittests'))
    shell: sh
    run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\necho '::group::Check version'\n\"${SRCDIR}\"/vim --version\n\"${SRCDIR}\"/vim -u NONE -i NONE --not-a-term -esNX -V1 -S ci/if_ver-1.vim -c quit\n\"${SRCDIR}\"/vim -u NONE -i NONE --not-a-term -esNX -V1 -S ci/if_ver-2.vim -c quit\nif ${{ inputs.features == 'huge' }}; then\n  # Also check that optional and dynamic features are configured and working\n  \"${SRCDIR}\"/vim -u NONE -i NONE --not-a-term -esNX -V1 \\\n    -c \"let g:required=['gettext', 'sodium', 'sound', 'perl', 'python3', 'lua', 'ruby', 'tcl']\" \\\n    -S ci/if_feat_check.vim -c quit\nfi\necho '::endgroup::'\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Check-version.buildprof\" -- bash --noprofile --norc -eo pipefail \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
