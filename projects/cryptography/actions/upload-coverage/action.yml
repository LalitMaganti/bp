name: Upload Coverage
description: Upload coverage files
runs:
  using: composite
  steps:
  - run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\nCOVERAGE_UUID=$(python3 -c \"import uuid; print(uuid.uuid4())\")\necho \"COVERAGE_UUID=${COVERAGE_UUID}\" >> $GITHUB_OUTPUT\nif [ -f .coverage ]; then\n  mv .coverage .coverage.${COVERAGE_UUID}\nfi\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-COVERAGE-UUID-python3-c-import-uuid-prin.buildprof\" -- bash --noprofile --norc -eo pipefail \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
    id: coverage-uuid
    shell: sh
  - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
    with:
      name: coverage-data-${{ steps.coverage-uuid.outputs.COVERAGE_UUID }}
      path: '.coverage.*

        *.lcov

        '
      if-no-files-found: ignore
      include-hidden-files: true
