name: Download OpenSSL artifact
description: 'Downloads a prebuilt OpenSSL artifact from pyca/infra and pins its

  mtimes to the artifact''s creation time. openssl-sys''s build script

  registers cargo:rerun-if-changed on the OpenSSL include directory,

  which cargo evaluates by mtime, so a freshly extracted artifact with

  unchanged content would otherwise invalidate the cargo cache on every

  run.

  '
inputs:
  workflow:
    description: The pyca/infra workflow that built the artifact
    required: true
  name:
    description: The artifact name
    required: true
  path:
    description: The directory to extract the artifact to
    required: true
outputs:
  artifact-id:
    description: The id of the downloaded artifact
    value: ${{ fromJSON(steps.download.outputs.artifacts)[0].id }}
runs:
  using: composite
  steps:
  - uses: dawidd6/action-download-artifact@eab87c9830c39eff17e5a6eadb20bfb4bc880477
    id: download
    with:
      repo: pyca/infra
      workflow: ${{ inputs.workflow }}
      branch: main
      workflow_conclusion: success
      name: ${{ inputs.name }}
      path: ${{ inputs.path }}
      github_token: ${{ github.token }}
  - name: Pin artifact mtimes
    run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

      cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

      python .github/bin/pin_artifact_mtimes.py "$ARTIFACT_PATH" "$ARTIFACT_CREATED_AT"

      BUILDPROF_SCRIPT_EOF

      ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

      bp_rc=0

      "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Pin-artifact-mtimes.buildprof" -- bash --noprofile --norc -eo pipefail "$bp_dir/$bp_id.sh" || bp_rc=$?

      kill $bp_watch 2>/dev/null; exit $bp_rc

      '
    env:
      ARTIFACT_PATH: ${{ inputs.path }}
      ARTIFACT_CREATED_AT: ${{ fromJSON(steps.download.outputs.artifacts)[0].created_at }}
    shell: sh
