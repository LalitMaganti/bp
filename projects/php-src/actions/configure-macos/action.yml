name: ./configure
inputs:
  configurationParameters:
    default: ''
    required: false
runs:
  using: composite
  steps:
  - shell: bash
    run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s%N)\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\nset -x\nBREW_OPT=\"$(brew --prefix)\"/opt\nexport PATH=\"$BREW_OPT/bison/bin:$PATH\"\nexport PKG_CONFIG_PATH=\"$PKG_CONFIG_PATH:$BREW_OPT/openssl@4/lib/pkgconfig\"\nexport PKG_CONFIG_PATH=\"$PKG_CONFIG_PATH:$BREW_OPT/curl/lib/pkgconfig\"\nexport PKG_CONFIG_PATH=\"$PKG_CONFIG_PATH:$BREW_OPT/libffi/lib/pkgconfig\"\nexport PKG_CONFIG_PATH=\"$PKG_CONFIG_PATH:$BREW_OPT/libxml2/lib/pkgconfig\"\nexport PKG_CONFIG_PATH=\"$PKG_CONFIG_PATH:$BREW_OPT/libxslt/lib/pkgconfig\"\nexport PKG_CONFIG_PATH=\"$PKG_CONFIG_PATH:$BREW_OPT/zlib/lib/pkgconfig\"\nexport PKG_CONFIG_PATH=\"$PKG_CONFIG_PATH:$BREW_OPT/icu4c/lib/pkgconfig\"\nsed -i -e 's/Requires.private:.*//g' \"$BREW_OPT/curl/lib/pkgconfig/libcurl.pc\"\n./buildconf --force\n./configure \\\n  --enable-option-checking=fatal \\\n  --prefix=/usr/local \\\n  --enable-fpm \\\n  --with-pdo-mysql=mysqlnd \\\n  --with-mysqli=mysqlnd \\\n  --with-pgsql=\"$BREW_OPT\"/libpq \\\n  --with-pdo-pgsql=\"$BREW_OPT\"/libpq \\\n  --with-pdo-sqlite \\\n  --without-pear \\\n  --enable-gd \\\n  --with-jpeg \\\n  --with-webp \\\n  --with-freetype \\\n  --enable-exif \\\n  --with-zip \\\n  --with-zlib \\\n  --enable-soap \\\n  --enable-xmlreader \\\n  --with-xsl \\\n  --with-tidy=\"$BREW_OPT\"/tidy-html5 \\\n  --with-libxml \\\n  --enable-sysvsem \\\n  --enable-sysvshm \\\n  --enable-shmop \\\n  --enable-pcntl \\\n  --with-readline=\"$BREW_OPT\"/readline \\\n  --enable-mbstring \\\n  --with-curl \\\n  --with-gettext=\"$BREW_OPT\"/gettext \\\n  --enable-sockets \\\n  --with-bz2=\"$BREW_OPT\"/bzip2 \\\n  --with-openssl \\\n  --with-gmp=\"$BREW_OPT\"/gmp \\\n  --with-iconv=\"$BREW_OPT\"/libiconv \\\n  --enable-bcmath \\\n  --enable-calendar \\\n  --enable-ftp \\\n  --enable-sysvmsg \\\n  --with-ffi \\\n  --enable-zend-test \\\n  --enable-dl-test=shared \\\n  --enable-intl \\\n  --with-mhash \\\n  --with-sodium \\\n  --enable-dba \\\n  --enable-werror \\\n  --with-config-file-path=/etc \\\n  --with-config-file-scan-dir=/etc/php.d \\\n  ${{ inputs.configurationParameters }}\nBUILDPROF_SCRIPT_EOF\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open -o \"$bp_dir/$bp_id-set-x.buildprof\" -- bash --noprofile --norc -eo pipefail \"$bp_dir/$bp_id.sh\"\n"
