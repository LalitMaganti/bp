name: apt
inputs:
  asan:
    default: false
    required: false
runs:
  using: composite
  steps:
  - shell: bash
    run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s%N)\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\nset -x\n\nOPCACHE_TLS_TESTS_DEPS=\"gcc clang lld\"\n\nexport DEBIAN_FRONTEND=noninteractive\n\n# Install sudo in Docker for consistent actions\nif ! type \"sudo\" > /dev/null; then\n  apt-get update -y | true\n  apt-get install -y sudo\nfi\n\nsudo apt-get update -y | true\nsudo apt-get install -y \\\n  autoconf \\\n  gcc \\\n  make \\\n  curl \\\n  unzip \\\n  bison \\\n  re2c \\\n  locales \\\n  ldap-utils \\\n  openssl \\\n  slapd \\\n  language-pack-de \\\n  libgmp-dev \\\n  libicu-dev \\\n  libtidy-dev \\\n  libenchant-2-dev \\\n  libbz2-dev \\\n  libsasl2-dev \\\n  libxpm-dev \\\n  libzip-dev \\\n  libsqlite3-dev \\\n  libsqlite3-mod-spatialite \\\n  libwebp-dev \\\n  ${{ inputs.asan == 'false' && 'libavif-dev' || '' }} \\\n  libonig-dev \\\n  libcurl4-openssl-dev \\\n  libxml2-dev \\\n  libxslt1-dev \\\n  libpq-dev \\\n  libedit-dev \\\n  libldap2-dev \\\n  libsodium-dev \\\n  libargon2-dev \\\n  libmm-dev \\\n  libsnmp-dev \\\n  postgresql \\\n  postgresql-contrib \\\n  snmpd \\\n  snmp-mibs-downloader \\\n  freetds-dev \\\n  unixodbc-dev \\\n  libsqliteodbc \\\n  llvm \\\n  clang \\\n  dovecot-core \\\n  dovecot-pop3d \\\n  dovecot-imapd \\\n  sendmail \\\n  firebird-dev \\\n  liblmdb-dev \\\n  libtokyocabinet-dev \\\n  libdb-dev \\\n  libqdbm-dev \\\n  libjpeg-dev \\\n  libpng-dev \\\n  libfreetype6-dev \\\n  $OPCACHE_TLS_TESTS_DEPS\nBUILDPROF_SCRIPT_EOF\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open -o \"$bp_dir/$bp_id-set-x.buildprof\" -- bash --noprofile --norc -eo pipefail \"$bp_dir/$bp_id.sh\"\n"
