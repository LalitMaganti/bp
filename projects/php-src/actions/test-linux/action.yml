name: Test
inputs:
  runTestsParameters:
    default: ''
    required: false
  enableOpcache:
    default: 'false'
    required: false
  jitType:
    default: disable
    required: false
  idleCpu:
    default: 'false'
    required: false
runs:
  using: composite
  steps:
  - shell: sh
    run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\nset -x\nexport MYSQL_TEST_USER=root\nexport MYSQL_TEST_PASSWD=root\nif [[ -z \"$PDO_MYSQL_TEST_DSN\" ]]; then\n  export PDO_MYSQL_TEST_DSN=\"mysql:host=localhost;dbname=test\"\nfi\nexport PDO_MYSQL_TEST_USER=root\nexport PDO_MYSQL_TEST_PASS=root\nexport PDO_DBLIB_TEST_DSN=\"dblib:host=127.0.0.1;dbname=master;version=7.0\"\nexport PDO_DBLIB_TEST_USER=\"pdo_test\"\nexport PDO_DBLIB_TEST_PASS=\"password\"\nexport PGSQL_TEST_CONNSTR=\"host=localhost dbname=test port=5432 user=postgres password=postgres\"\nif [[ -z \"$PDO_PGSQL_TEST_DSN\" ]]; then\n  export PDO_PGSQL_TEST_DSN=\"pgsql:host=localhost port=5432 dbname=test user=postgres password=postgres\"\nfi\nexport PDO_FIREBIRD_TEST_DATABASE=test.fdb\nif [[ -z \"$PDO_FIREBIRD_TEST_DSN\" ]]; then\n  export PDO_FIREBIRD_TEST_DSN=firebird:dbname=localhost:test.fdb\nfi\nexport PDO_FIREBIRD_TEST_PASS=test\nexport PDO_FIREBIRD_TEST_USER=test\nexport ODBC_TEST_USER=\"odbc_test\"\nexport ODBC_TEST_PASS=\"password\"\nexport ODBC_TEST_DSN=\"Driver={ODBC Driver 17 for SQL Server};Server=127.0.0.1;Database=odbc;uid=$ODBC_TEST_USER;pwd=$ODBC_TEST_PASS\"\nexport PDO_ODBC_TEST_DSN=\"odbc:Driver={ODBC Driver 17 for SQL Server};Server=127.0.0.1;Database=pdo_odbc;uid=$ODBC_TEST_USER;pwd=$ODBC_TEST_PASS\"\nexport SKIP_IO_CAPTURE_TESTS=1\nexport STACK_LIMIT_DEFAULTS_CHECK=1\nexport RUN_RESOURCE_HEAVY_TESTS=1\nsapi/cli/php run-tests.php -P -q ${{ inputs.runTestsParameters }} \\\n  ${{ inputs.enableOpcache == 'true' && '-d opcache.enable_cli=1' || '' }} \\\n  -d opcache.jit=${{ inputs.jitType }} \\\n  -d opcache.protect_memory=1 \\\n  -d opcache.jit_buffer_size=64M \\\n  ${{ inputs.idleCpu == 'true' && '-j$(($(/usr/bin/nproc) - 1))' || '-j$(/usr/bin/nproc)' }} \\\n  -g FAIL,BORK,LEAK,XLEAK \\\n  --no-progress \\\n  --offline \\\n  --show-diff \\\n  --show-slow 1000 \\\n  --set-timeout 120\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\nASAN_OPTIONS=\"${ASAN_OPTIONS:+$ASAN_OPTIONS:}detect_leaks=0\" \"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open -o \"$bp_dir/$bp_id-set-x.buildprof\" -- bash --noprofile --norc -eo pipefail \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
