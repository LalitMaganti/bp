name: apt
runs:
  using: composite
  steps:
  - shell: sh
    run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s%N)\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\nset -x\n\nOPCACHE_TLS_TESTS_DEPS=\"gcc clang lld\"\n\nexport DEBIAN_FRONTEND=noninteractive\ndpkg --add-architecture i386\napt-get update -y | true\n# TODO: Reenable postgresql + postgresql-contrib packages once they work again.\napt-get install -y \\\n  autoconf \\\n  bison \\\n  curl \\\n  g++-multilib \\\n  gcc-multilib \\\n  language-pack-de \\\n  libbz2-dev:i386 \\\n  libc6:i386 \\\n  libcurl4-openssl-dev:i386 \\\n  libffi-dev:i386 \\\n  libfreetype6-dev:i386 \\\n  libgmp-dev:i386 \\\n  libicu-dev:i386 \\\n  libjpeg-dev:i386 \\\n  libonig-dev:i386 \\\n  libpng-dev:i386 \\\n  libpq-dev:i386 \\\n  libreadline-dev:i386 \\\n  libsasl2-dev:i386 \\\n  libsodium-dev:i386 \\\n  libsqlite3-dev:i386 \\\n  libssl-dev:i386 \\\n  libwebp-dev:i386 \\\n  libxml2-dev:i386 \\\n  libxpm-dev:i386 \\\n  libxslt1-dev:i386 \\\n  firebird-dev:i386 \\\n  locales \\\n  make \\\n  pkg-config:i386 \\\n  re2c \\\n  unzip \\\n  wget \\\n  zlib1g-dev:i386 \\\n  $OPCACHE_TLS_TESTS_DEPS\nBUILDPROF_SCRIPT_EOF\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open -o \"$bp_dir/$bp_id-set-x.buildprof\" -- bash --noprofile --norc -eo pipefail \"$bp_dir/$bp_id.sh\"\n"
