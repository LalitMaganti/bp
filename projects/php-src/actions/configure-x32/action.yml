name: ./configure
inputs:
  configurationParameters:
    default: ''
    required: false
runs:
  using: composite
  steps:
  - shell: sh
    run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\nset -x\n\nexport PKG_CONFIG_PATH=\"$PKG_CONFIG_PATH:/usr/lib/i386-linux-gnu/pkgconfig\"\n./buildconf --force\nexport CFLAGS=\"-m32 -msse2\"\nexport CXXFLAGS=\"-m32 -msse2\"\nexport LDFLAGS=-L/usr/lib/i386-linux-gnu\n./configure ${{ inputs.configurationParameters }} \\\n    --enable-option-checking=fatal \\\n    --build=i686-pc-linux-gnu \\\n    --prefix=/usr \\\n    --enable-phpdbg \\\n    --enable-fpm \\\n    --enable-intl \\\n    --with-pdo-mysql=mysqlnd \\\n    --with-mysqli=mysqlnd \\\n    --with-pgsql \\\n    --with-pdo-pgsql \\\n    --with-pdo-sqlite \\\n    --with-pdo-firebird \\\n    --without-pear \\\n    --enable-gd \\\n    --with-jpeg \\\n    --with-webp \\\n    --with-freetype \\\n    --with-xpm \\\n    --enable-exif \\\n    --with-zlib \\\n    --enable-soap \\\n    --enable-xmlreader \\\n    --with-xsl \\\n    --enable-sysvsem \\\n    --enable-sysvshm \\\n    --enable-shmop \\\n    --enable-pcntl \\\n    --with-readline \\\n    --enable-mbstring \\\n    --with-curl \\\n    --with-gettext \\\n    --enable-sockets \\\n    --with-bz2 \\\n    --with-openssl \\\n    --with-gmp \\\n    --enable-bcmath \\\n    --enable-calendar \\\n    --enable-ftp \\\n    --enable-sysvmsg \\\n    --with-ffi \\\n    --enable-zend-test \\\n    --enable-dl-test=shared \\\n    --with-mhash \\\n    --with-sodium \\\n    --enable-dba \\\n    --enable-werror \\\n    --with-config-file-path=/etc \\\n    --with-config-file-scan-dir=/etc/php.d\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\nif [ \"$(id -u)\" != 0 ] && sudo -n true 2>/dev/null; then\n  sudo -E env \"PATH=$PATH\" \"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 --run-as \"$(id -un)\" -o \"$bp_dir/$bp_id-set-x.buildprof\" -- bash --noprofile --norc -eo pipefail \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nelse\n  \"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-set-x.buildprof\" -- bash --noprofile --norc -eo pipefail \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nfi\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
