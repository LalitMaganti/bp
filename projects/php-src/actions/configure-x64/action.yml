name: ./configure
inputs:
  configurationParameters:
    default: ''
    required: false
  skipSlow:
    default: false
    required: false
  asan:
    default: false
    required: false
runs:
  using: composite
  steps:
  - shell: sh
    run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\nset -x\n./buildconf --force\n./configure \\\n  --enable-option-checking=fatal \\\n  --prefix=/usr \\\n  --enable-phpdbg \\\n  --enable-fpm \\\n  --with-pdo-mysql=mysqlnd \\\n  --with-mysqli=mysqlnd \\\n  ${{ inputs.skipSlow == 'false' && '--with-pgsql' || '' }} \\\n  ${{ inputs.skipSlow == 'false' && '--with-pdo-pgsql' || '' }} \\\n  ${{ inputs.skipSlow == 'false' && '--with-pdo-sqlite' || '' }} \\\n  --enable-intl \\\n  --without-pear \\\n  --enable-gd \\\n  --with-jpeg \\\n  --with-webp \\\n  ${{ inputs.asan == 'false' && '--with-avif' || '' }} \\\n  --with-freetype \\\n  --with-xpm \\\n  --enable-exif \\\n  --with-zip \\\n  --with-zlib \\\n  --enable-soap \\\n  --enable-xmlreader \\\n  --with-xsl \\\n  ${{ inputs.skipSlow == 'false' && '--with-tidy' || '' }} \\\n  --enable-sysvsem \\\n  --enable-sysvshm \\\n  --enable-shmop \\\n  --enable-pcntl \\\n  --without-readline --with-libedit \\\n  --enable-mbstring \\\n  --with-curl \\\n  --with-gettext \\\n  --enable-sockets \\\n  --with-bz2 \\\n  --with-openssl \\\n  --with-gmp \\\n  --enable-bcmath \\\n  --enable-calendar \\\n  --enable-ftp \\\n  ${{ inputs.skipSlow == 'false' && '--with-enchant=/usr' || '' }} \\\n  --enable-sysvmsg \\\n  --with-ffi \\\n  --enable-zend-test \\\n  ${{ inputs.skipSlow == 'false' && '--enable-dl-test=shared' || '' }} \\\n  ${{ inputs.skipSlow == 'false' && '--with-ldap' || '' }} \\\n  ${{ inputs.skipSlow == 'false' && '--with-ldap-sasl' || '' }} \\\n  --with-password-argon2 \\\n  --with-mhash \\\n  --with-sodium \\\n  --enable-dba \\\n  --with-cdb \\\n  --enable-flatfile \\\n  --enable-inifile \\\n  --with-tcadb \\\n  --with-lmdb \\\n  --with-qdbm \\\n  ${{ inputs.skipSlow == 'false' && '--with-snmp' || '' }} \\\n  ${{ inputs.skipSlow == 'false' && '--with-unixODBC' || '' }} \\\n  ${{ inputs.skipSlow == 'false' && '--with-pdo-odbc=unixODBC,/usr' || '' }} \\\n  --with-config-file-path=/etc \\\n  --with-config-file-scan-dir=/etc/php.d \\\n  ${{ inputs.skipSlow == 'false' && '--with-pdo-firebird' || '' }} \\\n  ${{ inputs.skipSlow == 'false' && '--with-pdo-dblib' || '' }} \\\n  --enable-werror \\\n  ${{ inputs.configurationParameters }}\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\nASAN_OPTIONS=\"${ASAN_OPTIONS:+$ASAN_OPTIONS:}detect_leaks=0\" \"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open -o \"$bp_dir/$bp_id-set-x.buildprof\" -- bash --noprofile --norc -eo pipefail \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
