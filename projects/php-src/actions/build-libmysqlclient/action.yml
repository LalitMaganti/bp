name: Build libmysqlclient
inputs:
  configurationParameters:
    default: ''
    required: false
  libmysql:
    required: true
runs:
  using: composite
  steps:
  - shell: sh
    run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\nset -x\nLIBMYSQL=${{ inputs.libmysql }}\nMYSQL_BASE=${LIBMYSQL%%-linux-*}\nMYSQL_DIR=$HOME/$MYSQL_BASE\nmkdir -p $MYSQL_DIR\nURL=https://downloads.mysql.com/archives/get/p/23/file/$LIBMYSQL\nwget -nv $URL\ntar -xf $LIBMYSQL --strip-components=1 -C $MYSQL_DIR\nPDO_MYSQL=${MYSQL_DIR}\n./buildconf --force\n./configure ${{ inputs.configurationParameters }} \\\n  --enable-option-checking=fatal \\\n  --disable-all \\\n  --enable-pdo \\\n  --with-pdo-mysql=${PDO_MYSQL}\nmake clean\nmake -j$(/usr/bin/nproc) >/dev/null\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-set-x.buildprof\" -- bash --noprofile --norc -eo pipefail \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
