name: apk
runs:
  using: composite
  steps:
  - shell: bash
    run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s%N)\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\nset -x\n\nOPCACHE_TLS_TESTS_DEPS=\"clang gcc binutils-gold lld\"\n# compiler-rt provides libclang_rt.asan-x86_64.a for clang20\n# https://pkgs.alpinelinux.org/contents?file=libclang_rt.asan-x86_64.a&path=&name=&branch=v3.22\nASAN_DEPS=\"clang20 compiler-rt\"\n\napk update -q\napk add \\\n    util-linux \\\n    bash \\\n    sudo \\\n    build-base \\\n    autoconf \\\n    unzip \\\n    tar \\\n    bison \\\n    re2c \\\n    pkgconf \\\n    mysql-client \\\n    bzip2-dev \\\n    curl-dev \\\n    freetype-dev \\\n    gettext-dev \\\n    gmp-dev \\\n    icu-dev \\\n    icu-data-full \\\n    jpeg-dev \\\n    libffi-dev \\\n    libpng-dev \\\n    libsodium-dev \\\n    libwebp-dev \\\n    libxml2-dev \\\n    libxpm-dev \\\n    libxslt-dev \\\n    libzip-dev \\\n    oniguruma-dev \\\n    openssl-dev \\\n    readline-dev \\\n    sqlite-dev \\\n    tidyhtml-dev \\\n    gdbm-dev \\\n    lmdb-dev \\\n    argon2-dev \\\n    enchant2-dev \\\n    freetds-dev \\\n    imap-dev \\\n    net-snmp-dev \\\n    openldap-dev \\\n    unixodbc-dev \\\n    postgresql-dev \\\n    tzdata \\\n    musl-locales \\\n    musl-locales-lang \\\n    $OPCACHE_TLS_TESTS_DEPS \\\n    $ASAN_DEPS\nBUILDPROF_SCRIPT_EOF\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open -o \"$bp_dir/$bp_id-set-x.buildprof\" -- sh -e \"$bp_dir/$bp_id.sh\"\n"
