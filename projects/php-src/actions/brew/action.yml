name: brew
runs:
  using: composite
  steps:
  - shell: bash
    run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s%N)\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\nset -x\n\nbrew update\n\n# Patch brew to overwrite always\nformula_installer=\"$(brew --repo)\"/Library/Homebrew/formula_installer.rb\ncode=\" keg.link\\(verbose: verbose\\?\"\nsudo sed -Ei '' \"s/$code.*/$code, overwrite: true\\)/\" \"$formula_installer\"\n\n# Some packages exist on x86 but not arm, or vice versa.\n# Install them with reinstall to avoid warnings.\nbrew reinstall -v \\\n  autoconf \\\n  webp \\\n  tidy-html5 \\\n  libzip \\\n  libsodium \\\n  icu4c \\\n  curl\nbrew install -v \\\n  bison \\\n  re2c\nbrew install -v \\\n  bzip2 \\\n  enchant \\\n  libffi \\\n  intltool \\\n  libiconv \\\n  t1lib \\\n  libxml2 \\\n  libjpeg \\\n  libxslt \\\n  openssl@4\nbrew link --force --overwrite openssl@4\nBUILDPROF_SCRIPT_EOF\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open -o \"$bp_dir/$bp_id-set-x.buildprof\" -- bash --noprofile --norc -eo pipefail \"$bp_dir/$bp_id.sh\"\n"
