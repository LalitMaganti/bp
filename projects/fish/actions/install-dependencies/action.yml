name: Install dependencies for system tests
inputs:
  include_sphinx:
    description: Whether to install Sphinx
    required: true
    default: false
  include_pcre:
    description: Whether to install the PCRE library
    required: false
    default: true
permissions:
  contents: read
runs:
  using: composite
  steps:
  - shell: sh
    env:
      include_pcre: ${{ inputs.include_pcre }}
    run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\nset -x\n: \"optional dependencies\"\nsudo apt install \\\n  gettext \\\n  $(if $include_pcre; then echo libpcre2-dev; fi) \\\n;\n: \"system test dependencies\"\nsudo apt install \\\n  diffutils $(: \"for diff\") \\\n  git \\\n  less \\\n  python3-pexpect \\\n  tmux \\\n  wget \\\n;\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-set-x.buildprof\" -- bash --noprofile --norc -eo pipefail \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
  - uses: ./.github/actions/install-sphinx
    if: ${{ inputs.include_sphinx == 'true' }}
