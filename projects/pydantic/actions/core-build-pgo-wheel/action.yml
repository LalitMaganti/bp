name: Build PGO wheel
description: Builds a PGO-optimized wheel
inputs:
  interpreter:
    description: Interpreter to build the wheel for
    required: true
  rust-toolchain:
    description: Rust toolchain to use
    required: true
  working-directory:
    description: Working directory to run the action in
    required: false
    default: ${{ github.workspace }}
outputs:
  wheel:
    description: Path to the built wheel
    value: ${{ steps.find_wheel.outputs.path }}
runs:
  using: composite
  steps:
  - name: Get uv installer
    if: runner.os == 'Linux'
    working-directory: ${{ inputs.working-directory }}
    run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\ncurl -LsSf https://astral.sh/uv/install.sh -o uv-installer.sh\ngh attestation verify uv-installer.sh \\\n  --repo astral-sh/uv \\\n  --signer-workflow astral-sh/uv/.github/workflows/release.yml \\\n  --deny-self-hosted-runners\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Get-uv-installer.buildprof\" -- bash --noprofile --norc -eo pipefail \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
    shell: sh
    env:
      GH_TOKEN: ${{ github.token }}
  - name: Build PGO-optimized wheel
    uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
    with:
      working-directory: ${{ inputs.working-directory }}
      maturin-version: v1.15.0
      manylinux: auto
      before-script-linux: 'env UV_UNMANAGED_INSTALL=/usr/local/bin sh uv-installer.sh

        '
      args: '--release --locked --pgo --out dist --interpreter ${{ inputs.interpreter }}

        '
      rust-toolchain: ${{ inputs.rust-toolchain }}
      docker-options: -e CI -e UV_PYTHON
  - name: Find built wheel
    id: find_wheel
    working-directory: ${{ inputs.working-directory }}
    run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

      cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

      echo "path=$(ls dist/*.whl)" | tee -a "$GITHUB_OUTPUT"

      BUILDPROF_SCRIPT_EOF

      ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

      bp_rc=0

      "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Find-built-wheel.buildprof" -- bash --noprofile --norc -eo pipefail "$bp_dir/$bp_id.sh" || bp_rc=$?

      kill $bp_watch 2>/dev/null; exit $bp_rc

      '
    shell: sh
