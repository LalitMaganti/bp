name: Turborepo Node.js Setup
description: Sets Node.js up for CI
inputs:
  extra-flags:
    description: Extra flags to pass to the pnpm install.
    required: false
    default: ''
  package-install:
    description: Don't run the install step.
    required: false
    default: 'true'
  node-version:
    description: Node version to install
    required: false
runs:
  using: composite
  steps:
  - name: Setup pnpm
    uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
  - name: Setup Node.js
    uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
    with:
      node-version-file: package.json
      node-version: ${{ inputs.node-version }}
  - name: Get pnpm store path
    if: ${{ inputs.package-install == 'true' }}
    id: pnpm-store
    shell: sh
    run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

      cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

      echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      BUILDPROF_SCRIPT_EOF

      ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

      bp_rc=0

      "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Get-pnpm-store-path.buildprof" -- bash --noprofile --norc -eo pipefail "$bp_dir/$bp_id.sh" || bp_rc=$?

      kill $bp_watch 2>/dev/null; exit $bp_rc

      '
  - name: Cache pnpm store
    if: ${{ inputs.package-install == 'true' }}
    uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
    with:
      path: ${{ steps.pnpm-store.outputs.path }}
      key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ github.head_ref || github.ref_name }}-${{ hashFiles('pnpm-lock.yaml') }}
      restore-keys: '${{ runner.os }}-${{ runner.arch }}-pnpm-${{ github.head_ref || github.ref_name }}-

        '
  - name: pnpm install
    id: install
    if: ${{ inputs.package-install == 'true' }}
    continue-on-error: true
    shell: sh
    run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

      cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

      pnpm install ${{ inputs.extra-flags }}

      BUILDPROF_SCRIPT_EOF

      ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

      bp_rc=0

      "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-pnpm-install.buildprof" -- bash --noprofile --norc -eo pipefail "$bp_dir/$bp_id.sh" || bp_rc=$?

      kill $bp_watch 2>/dev/null; exit $bp_rc

      '
  - name: pnpm install (second try)
    if: ${{ steps.install.outcome == 'failure' }}
    shell: sh
    run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

      cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

      pnpm install ${{ inputs.extra-flags }}

      BUILDPROF_SCRIPT_EOF

      ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

      bp_rc=0

      "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-pnpm-install-second-try.buildprof" -- bash --noprofile --norc -eo pipefail "$bp_dir/$bp_id.sh" || bp_rc=$?

      kill $bp_watch 2>/dev/null; exit $bp_rc

      '
