name: Setup Zig
description: Installs the Zig toolchain required to build libghostty-vt
inputs:
  version:
    description: Zig version to install
    required: false
    default: 0.17.0
runs:
  using: composite
  steps:
  - name: Install Zig
    shell: sh
    run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\nset -euo pipefail\n\nversion=\"${{ inputs.version }}\"\nzig_dir=\"${{ github.workspace }}/zig\"\nmkdir -p \"$zig_dir\"\n\nzig_arch() {\n  case \"$(uname -m)\" in\n    x86_64 | amd64) echo \"x86_64\" ;;\n    aarch64 | arm64) echo \"aarch64\" ;;\n    *)\n      echo \"Unsupported architecture: $(uname -m)\" >&2\n      exit 1\n      ;;\n  esac\n}\n\narch=\"$(zig_arch)\"\n\ncase \"${{ runner.os }}\" in\n  Linux)\n    archive=\"zig-${arch}-linux-${version}\"\n    executable=\"${zig_dir}/zig\"\n    curl --fail --show-error --silent --location \\\n      --output zig.tar.xz \\\n      \"https://ziglang.org/download/${version}/${archive}.tar.xz\"\n    tar -xJf zig.tar.xz -C \"$zig_dir\" --strip-components 1\n    rm zig.tar.xz\n    ;;\n  macOS)\n    archive=\"zig-${arch}-macos-${version}\"\n    executable=\"${zig_dir}/zig\"\n    curl --fail --show-error --silent --location \\\n      --output zig.tar.xz \\\n      \"https://ziglang.org/download/${version}/${archive}.tar.xz\"\n    tar -xJf zig.tar.xz -C \"$zig_dir\" --strip-components 1\n    rm zig.tar.xz\n    ;;\n  Windows)\n    archive=\"zig-${arch}-windows-${version}\"\n    executable=\"${zig_dir}/zig.exe\"\n    curl --fail --show-error --silent --location \\\n      --output zig.zip \\\n      \"https://ziglang.org/download/${version}/${archive}.zip\"\n    unzip -q zig.zip\n    extracted_dir=\"${archive}\"\n    mv \"${extracted_dir}\"/* \"$zig_dir/\"\n    rm -rf \"$extracted_dir\" zig.zip\n    ;;\n  *)\n    echo \"Unsupported runner OS: ${{ runner.os }}\" >&2\n    exit 1\n    ;;\nesac\n\n# Prefer this toolchain over any preinstalled `zig` on the runner.\necho \"${zig_dir}\" >> \"$GITHUB_PATH\"\necho \"ZIG_EXECUTABLE=${executable}\" >> \"$GITHUB_ENV\"\necho \"ZIG_GLOBAL_CACHE_DIR=${zig_dir}/global-cache\" >> \"$GITHUB_ENV\"\nmkdir -p \"${zig_dir}/global-cache\"\n\n\"${executable}\" version\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Install-Zig.buildprof\" -- bash --noprofile --norc -eo pipefail \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
