name: Setup Capnproto
description: Sets up capnproto for the current platform
inputs:
  use-cache:
    description: Whether to cache the capnproto installation. Disable for container builds.
    required: false
    default: 'true'
runs:
  using: composite
  steps:
  - name: Cache capnproto (Linux)
    if: runner.os == 'Linux' && inputs.use-cache == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
    id: cache-capnp-linux
    with:
      path: '/usr/bin/capnp

        /usr/bin/capnpc

        '
      key: ${{ runner.os }}-${{ github.head_ref || github.ref_name }}-capnproto-1.1.0-v2
  - name: Setup capnproto for Linux
    if: runner.os == 'Linux' && (steps.cache-capnp-linux.outcome == 'skipped' || steps.cache-capnp-linux.outputs.cache-hit != 'true')
    shell: sh
    run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\nif command -v capnp &> /dev/null; then\n  echo \"capnp already available: $(capnp --version)\"\n  exit 0\nfi\n\nif command -v apt-get &> /dev/null; then\n  sudo apt-get -y update && sudo apt-get install -y capnproto\nelif command -v apk &> /dev/null; then\n  apk add capnproto-dev\nelse\n  curl --fail --show-error --silent --location --output capnproto-c++-1.1.0.tar.gz https://capnproto.org/capnproto-c++-1.1.0.tar.gz\n  echo \"07167580e563f5e821e3b2af1c238c16ec7181612650c5901330fa9a0da50939  capnproto-c++-1.1.0.tar.gz\" | sha256sum --check --strict\n  tar -zxf capnproto-c++-1.1.0.tar.gz\n  cd capnproto-c++-1.1.0 && ./configure --prefix=/usr --disable-shared && make -j$(nproc) && make install && cd .. && rm -rf capnproto-c++-1.1.0\n  rm capnproto-c++-1.1.0.tar.gz\nfi\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Setup-capnproto-for-Linux.buildprof\" -- bash --noprofile --norc -eo pipefail \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
  - name: Setup capnproto for macos
    if: runner.os == 'macOS'
    shell: sh
    run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

      cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

      brew install capnp

      BUILDPROF_SCRIPT_EOF

      ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

      bp_rc=0

      "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Setup-capnproto-for-macos.buildprof" -- bash --noprofile --norc -eo pipefail "$bp_dir/$bp_id.sh" || bp_rc=$?

      kill $bp_watch 2>/dev/null; exit $bp_rc

      '
  - name: Cache capnproto (Windows)
    if: runner.os == 'Windows' && inputs.use-cache == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
    id: cache-capnp-windows
    with:
      path: .capnproto
      key: ${{ runner.os }}-${{ github.head_ref || github.ref_name }}-capnproto-1.1.0-v3
  - name: Setup capnproto for Windows
    if: runner.os == 'Windows' && (steps.cache-capnp-windows.outcome == 'skipped' || steps.cache-capnp-windows.outputs.cache-hit != 'true')
    shell: pwsh
    run: "$url = \"https://capnproto.org/capnproto-c++-win32-1.1.0.zip\"\n$zip = \"$env:RUNNER_TEMP\\capnproto.zip\"\nWrite-Host \"Downloading capnproto from $url\"\nInvoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing\n$expectedHash = \"623b7525501d410e6479c8029eba265aa57ac8153c6fa09ab21a62f906b3e3f9\"\n$actualHash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()\nif ($actualHash -ne $expectedHash) {\n  Write-Error \"capnproto checksum mismatch. Expected $expectedHash, got $actualHash\"\n  exit 1\n}\nExpand-Archive -Path $zip -DestinationPath \"$env:GITHUB_WORKSPACE\\.capnproto\" -Force\nRemove-Item $zip\n"
  - name: Add capnproto to PATH (Windows)
    if: runner.os == 'Windows'
    shell: pwsh
    run: "$toolsDir = \"$env:GITHUB_WORKSPACE\\.capnproto\\capnproto-tools-win32-1.1.0\"\nif (Test-Path \"$toolsDir\\capnp.exe\") {\n  Write-Host \"Adding $toolsDir to PATH\"\n  echo \"$toolsDir\" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append\n} else {\n  Write-Error \"capnp.exe not found at expected path: $toolsDir\"\n  Get-ChildItem -Path \"$env:GITHUB_WORKSPACE\\.capnproto\" -Recurse | Select-Object FullName\n  exit 1\n}\n"
