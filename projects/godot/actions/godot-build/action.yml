name: Build Godot
description: Build Godot with the provided options.
inputs:
  target:
    description: Build target (editor, template_release, template_debug).
    default: editor
    type: choice
    options:
    - editor
    - template_debug
    - template_release
  platform:
    description: Target platform.
    type: string
  scons-flags:
    description: Additional SCons flags.
    type: string
  scons-cache:
    description: The SCons cache path.
    default: ${{ github.workspace }}/.scons_cache/
    type: string
runs:
  using: composite
  steps:
  - name: SCons Build
    shell: sh
    run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\necho \"Building with flags:\" platform=${{ inputs.platform }} target=${{ inputs.target }} ${{ inputs.scons-flags }} \"cache_path=${{ inputs.scons-cache }}\" redirect_build_objects=no\n\nif [ \"${{ inputs.target }}\" != \"editor\" ]; then\n  # Ensure we don't include editor code in export template builds.\n  rm -rf editor\nfi\n\nif [ \"${{ github.event.number }}\" != \"\" ]; then\n  # Set build identifier with pull request number if available. This is displayed throughout the editor.\n  export BUILD_NAME=\"gh-${{ github.event.number }}\"\nelse\n  export BUILD_NAME=\"gh\"\nfi\n\nscons platform=${{ inputs.platform }} target=${{ inputs.target }} ${{ inputs.scons-flags }} \"cache_path=${{ inputs.scons-cache }}\" redirect_build_objects=no\nls -l bin/\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-SCons-Build.buildprof\" -- sh -e \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
