name: clangd-tidy
description: Setup and run clangd-tidy on relevant files
inputs:
  changed-files:
    description: A pre-filtered list of changed files.
    required: true
    type: string
runs:
  using: composite
  steps:
  - name: Setup clangd-tidy
    shell: sh
    run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\necho \"::group::Prerequisite checks\"\nif [ ! -f \"compile_commands.json\" ]; then\n  echo \"::error::clangd-tidy checker requires a compilation database to function\"\n  exit 1\nfi\necho \"::endgroup::\"\n\necho \"::group::Installing clangd-tidy\"\n# Don't know which python we're using, so just access the global scope.\npython -m pip install clangd clangd-tidy clang-tidy==22.1.7\necho \"::endgroup::\"\n\necho \"::group::Running clangd-tidy\"\nCHANGED_FILES='${{ inputs.changed-files }}'\nCHANGED_FILES_LENGTH=${#CHANGED_FILES}\nif [ \"$CHANGED_FILES_LENGTH\" -lt 5 ]; then\n  echo \"No changed files to check.\"\nelif [ \"$CHANGED_FILES_LENGTH\" -gt 100000 ]; then\n  # Avoid argument length limitations by using xargs to pass the file list.\n  printf '%s\\n' $CHANGED_FILES | tr -d '\"' | xargs clangd-tidy\nelse\n  clangd-tidy $CHANGED_FILES\nfi\necho \"::endgroup::\"\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Setup-clangd-tidy.buildprof\" -- sh -e \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
