name: Test Godot project converter
description: Test the Godot project converter.
inputs:
  bin:
    description: The path to the Godot executable
    required: true
runs:
  using: composite
  steps:
  - name: Test 3-to-4 conversion
    shell: sh
    run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

      cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

      mkdir converter_test

      cd converter_test

      touch project.godot

      ../${{ inputs.bin }} --headless --validate-conversion-3to4

      cd ..

      rm converter_test -rf

      BUILDPROF_SCRIPT_EOF

      ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

      bp_rc=0

      "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Test-3-to-4-conversion.buildprof" -- sh -e "$bp_dir/$bp_id.sh" || bp_rc=$?

      kill $bp_watch 2>/dev/null; exit $bp_rc

      '
