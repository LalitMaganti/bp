name: Setup Go
description: Setup Go
inputs:
  go-version:
    description: Go version to set up in go-install.ps1 format
    default: go1.26
runs:
  using: composite
  steps:
  - name: Install Go
    id: install-go
    shell: pwsh
    run: "# https://github.com/microsoft/go-infra/blob/main/goinstallscript/powershell/go-install.ps1\n${{ github.action_path }}/go-install.ps1 -Version ${{ inputs.go-version }} -GitHubActionsPath\n\n$goVersionOutput = go version\nWrite-Host $goVersionOutput\n# Extract version like \"1.23.4\" from \"go version go1.23.4 windows/amd64\"\nif ($goVersionOutput -match 'go version go([\\d\\.]+)') {\n  $exactVersion = $matches[1]\n  \"go-version=$exactVersion\" >> $env:GITHUB_OUTPUT\n  Write-Host \"Exact Go version: $exactVersion\"\n} else {\n  Write-Error \"Failed to parse Go version from: $goVersionOutput\"\n  exit 1\n}\n"
  - name: Verify Microsoft Go
    shell: pwsh
    run: "$goPath = (Get-Command go).Source\nWrite-Host \"Go executable path: $goPath\"\nif ($goPath -notlike \"*microsoft-go*\") {\n  Write-Error \"Go installation is not from microsoft-go. Path: $goPath\"\n  exit 1\n}\nWrite-Host \"✓ Verified: Microsoft Go is active\"\n"
  - name: Add GOBIN to PATH
    shell: sh
    run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\nGOBIN=$(go env GOBIN)\nif [ -z \"$GOBIN\" ]; then\n  GOBIN=\"$(go env GOPATH)/bin\"\nfi\necho \"$GOBIN\" >> $GITHUB_PATH\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Add-GOBIN-to-PATH.buildprof\" -- bash --noprofile --norc -eo pipefail \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
