name: Setup action
description: Sets up shared CI tooling
author: Andrew Kaster <akaster@serenityos.org>
inputs:
  os:
    description: Operating System to set up
    required: true
    default: Linux
  arch:
    description: Target Architecture to set up
    required: true
    default: x86_64
  toolchain:
    description: Toolchain to use
    required: true
    default: Clang
  type:
    description: Whether the setup is for building or linting
    required: false
    default: build
  build_preset:
    description: When the setup is for building, set the build preset (e.g. Release)
    required: false
    default: Release
outputs:
  ccache_path:
    description: Path to the ccache directory
    value: ${{ steps.workspace.outputs.ccache_path }}
  vcpkg_cache_path:
    description: Path to the vcpkg binary cache
    value: ${{ steps.workspace.outputs.vcpkg_cache_path }}
runs:
  using: composite
  steps:
  - name: Set workspace environment
    id: workspace
    shell: sh
    run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

      cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

      echo "LADYBIRD_SOURCE_DIR=${GITHUB_WORKSPACE}" >> "$GITHUB_ENV"

      echo "CCACHE_DIR=${GITHUB_WORKSPACE}/.ccache" >> "$GITHUB_ENV"

      echo "ccache_path=${GITHUB_WORKSPACE}/.ccache" >> "$GITHUB_OUTPUT"

      echo "vcpkg_cache_path=${GITHUB_WORKSPACE}/Build/caches/vcpkg-binary-cache" >> "$GITHUB_OUTPUT"

      echo "GIT_CONFIG_GLOBAL=${RUNNER_TEMP}/gitconfig" >> "$GITHUB_ENV"

      git config --file "${RUNNER_TEMP}/gitconfig" --add safe.directory "${GITHUB_WORKSPACE}"

      mkdir -p "${RUNNER_TEMP}/pip-cache"

      echo "PIP_CACHE_DIR=${RUNNER_TEMP}/pip-cache" >> "$GITHUB_ENV"

      BUILDPROF_SCRIPT_EOF

      ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

      bp_rc=0

      "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Set-workspace-environment.buildprof" -- bash --noprofile --norc -eo pipefail "$bp_dir/$bp_id.sh" || bp_rc=$?

      kill $bp_watch 2>/dev/null; exit $bp_rc

      '
  - uses: actions/setup-python@v7
    if: ${{ inputs.os != 'Linux' }}
    with:
      python-version: 3.12
      cache: pip
  - name: Set up Python environment
    if: ${{ inputs.os == 'Linux' }}
    shell: sh
    run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

      cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

      python3 -m venv "${RUNNER_TEMP}/ladybird-python"

      echo "${RUNNER_TEMP}/ladybird-python/bin" >> "$GITHUB_PATH"

      echo "pythonLocation=${RUNNER_TEMP}/ladybird-python" >> "$GITHUB_ENV"

      BUILDPROF_SCRIPT_EOF

      ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

      bp_rc=0

      "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Set-up-Python-environment.buildprof" -- bash --noprofile --norc -eo pipefail "$bp_dir/$bp_id.sh" || bp_rc=$?

      kill $bp_watch 2>/dev/null; exit $bp_rc

      '
  - name: Install Python dependencies
    shell: sh
    run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\npython3 -m pip install --upgrade pip\n\nif ${{ inputs.type == 'build' }} ; then\n  pip3 install pyyaml requests six cryptography\nelse\n  python3 \"${GITHUB_WORKSPACE}/Meta/Linters/run.py\"\nfi\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Install-Python-dependencies.buildprof\" -- bash --noprofile --norc -eo pipefail \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
  - name: Ensure clang-cl is available
    if: ${{ inputs.os == 'Windows' && inputs.toolchain == 'ClangCL' }}
    shell: sh
    run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\nif ! where clang-cl > /dev/null 2>&1 ; then\n  # Keep the LLVM version in sync with GitHub's Windows runner image:\n  # https://github.com/actions/runner-images/blob/main/images/windows/Windows2025-Readme.md\n  choco install -y llvm --no-progress --version=20.1.8\n\n  echo \"C:/Program Files/LLVM/bin\" >> \"${GITHUB_PATH}\"\n  export PATH=\"/c/Program Files/LLVM/bin:${PATH}\"\nfi\nclang-cl --version\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Ensure-clang-cl-is-available.buildprof\" -- bash --noprofile --norc -eo pipefail \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
  - name: Select latest Xcode
    if: ${{ inputs.os == 'macOS' || inputs.os == 'Android' }}
    uses: maxim-lobanov/setup-xcode@v1
    with:
      xcode-version: '26.6'
  - name: Install Dependencies
    if: ${{ inputs.os == 'macOS' || inputs.os == 'Android' }}
    shell: sh
    run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\nbrew update\n\nbrew unlink openssl@3 || true\n\nbrew install \\\n    autoconf \\\n    autoconf-archive \\\n    automake \\\n    bash \\\n    ccache \\\n    coreutils \\\n    libtool \\\n    llvm@22 \\\n    nasm \\\n    ninja \\\n    pkg-config \\\n    qt \\\n    unzip\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Install-Dependencies.buildprof\" -- bash --noprofile --norc -eo pipefail \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
  - name: Install Rust toolchain
    if: ${{ inputs.os == 'macOS' || inputs.os == 'Android' }}
    uses: dtolnay/rust-toolchain@stable
  - name: Warm up the Rust toolchain
    if: ${{ inputs.os == 'macOS' || inputs.os == 'Android' }}
    shell: sh
    run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\nif rustup toolchain install ; then\n  exit 0\nfi\n\n# Some Blacksmith runner images boot with a partially installed toolchain whose files rustup does not know\n# about. It cannot repair that on its own and fails with a \"detected conflict\" error, so wipe the toolchain and\n# retry.\nCHANNEL=$(sed -n 's/^channel *= *\"\\(.*\\)\"/\\1/p' \"${{ github.workspace }}/rust-toolchain.toml\")\nif [ -z \"${CHANNEL}\" ]; then\n  echo \"Could not determine the pinned Rust channel\" >&2\n  exit 1\nfi\n\necho \"Reinstalling Rust toolchain ${CHANNEL} from scratch\"\nrustup toolchain uninstall \"${CHANNEL}\" || rm -rf \"$(rustup show home)/toolchains/${CHANNEL}\"-*\nrustup toolchain install\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Warm-up-the-Rust-toolchain.buildprof\" -- bash --noprofile --norc -eo pipefail \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
  - name: Resolve wasm-tools release
    id: wasm-tools
    if: ${{ inputs.type == 'build' && inputs.os != 'Linux' }}
    shell: sh
    run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\nVERSION=1.243.0\nif ${{ inputs.arch == 'arm64' }} ; then\n  ARCH=aarch64\nelse\n  ARCH=${{ inputs.arch }}\nfi\nLOWERCASE_OS=$( echo -n '${{ inputs.os }}' | tr '[:upper:]' '[:lower:]')\nif ${{ inputs.os == 'Windows' }} ; then\n  EXTENSION=zip\nelse\n  EXTENSION=tar.gz\nfi\nNAME=\"wasm-tools-${VERSION}-${ARCH}-${LOWERCASE_OS}\"\necho \"version=${VERSION}\" >> \"$GITHUB_OUTPUT\"\necho \"name=${NAME}\" >> \"$GITHUB_OUTPUT\"\necho \"filename=${NAME}.${EXTENSION}\" >> \"$GITHUB_OUTPUT\"\necho \"extension=${EXTENSION}\" >> \"$GITHUB_OUTPUT\"\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Resolve-wasm-tools-release.buildprof\" -- bash --noprofile --norc -eo pipefail \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
  - name: Cache wasm-tools
    id: wasm-tools-cache
    if: ${{ inputs.type == 'build' && inputs.os != 'Linux' }}
    uses: actions/cache@v6
    with:
      path: ${{ github.workspace }}/${{ steps.wasm-tools.outputs.name }}
      key: ${{ steps.wasm-tools.outputs.name }}
  - name: Install wasm-tools
    if: ${{ inputs.type == 'build' && inputs.os != 'Linux' && steps.wasm-tools-cache.outputs.cache-hit != 'true' }}
    shell: sh
    run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\nFILENAME=\"${{ steps.wasm-tools.outputs.filename }}\"\nURL=\"https://github.com/bytecodealliance/wasm-tools/releases/download/v${{ steps.wasm-tools.outputs.version }}/${FILENAME}\"\n\ndelays=(5 15 45)\nattempt=1\nuntil curl --fail --location --output \"${FILENAME}\" \"${URL}\"; do\n  if (( attempt > ${#delays[@]} )); then\n    echo \"wasm-tools download failed after $(( ${#delays[@]} + 1 )) attempts\" >&2\n    exit 1\n  fi\n  echo \"wasm-tools download failed; retrying in ${delays[attempt-1]}s\" >&2\n  sleep \"${delays[attempt-1]}\"\n  attempt=$(( attempt + 1 ))\ndone\n\nif [ \"${{ steps.wasm-tools.outputs.extension }}\" == 'zip' ]; then\n  unzip \"${FILENAME}\"\nelse\n  tar -xzf \"${FILENAME}\"\nfi\nrm \"${FILENAME}\"\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Install-wasm-tools.buildprof\" -- bash --noprofile --norc -eo pipefail \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
  - name: Add wasm-tools to PATH
    if: ${{ inputs.type == 'build' && inputs.os != 'Linux' }}
    shell: sh
    run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

      cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

      echo "${GITHUB_WORKSPACE}/${{ steps.wasm-tools.outputs.name }}" >> "$GITHUB_PATH"

      BUILDPROF_SCRIPT_EOF

      ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

      bp_rc=0

      "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Add-wasm-tools-to-PATH.buildprof" -- bash --noprofile --norc -eo pipefail "$bp_dir/$bp_id.sh" || bp_rc=$?

      kill $bp_watch 2>/dev/null; exit $bp_rc

      '
  - name: Set required environment variables
    if: ${{ inputs.os == 'Linux' && inputs.arch == 'arm64' }}
    shell: sh
    run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

      cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

      echo "VCPKG_FORCE_SYSTEM_BINARIES=1" >> "$GITHUB_ENV"

      BUILDPROF_SCRIPT_EOF

      ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

      bp_rc=0

      "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Set-required-environment-variables.buildprof" -- bash --noprofile --norc -eo pipefail "$bp_dir/$bp_id.sh" || bp_rc=$?

      kill $bp_watch 2>/dev/null; exit $bp_rc

      '
  - name: Install vcpkg
    if: ${{ inputs.type == 'build' }}
    shell: sh
    run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

      cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

      ./Meta/ladybird.py vcpkg --preset "${{ inputs.build_preset }}"

      BUILDPROF_SCRIPT_EOF

      ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

      bp_rc=0

      "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Install-vcpkg.buildprof" -- bash --noprofile --norc -eo pipefail "$bp_dir/$bp_id.sh" || bp_rc=$?

      kill $bp_watch 2>/dev/null; exit $bp_rc

      '
