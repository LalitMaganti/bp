name: Set up ARM64 Windows build environment
description: 'Install the build tools that the `windows-11-arm` runner image lacks: bash (PortableGit), Rust, VS Build Tools with Clang, CMake and jq. Adds them to `GITHUB_PATH` for the following steps.

  '
runs:
  using: composite
  steps:
  - name: Setup build environment (ARM64 Windows)
    shell: powershell
    run: "Write-Output \"> Update Expand-Archive (Microsoft.PowerShell.Archive)\"\nInstall-PackageProvider -Name NuGet -Force\nInstall-Module -Name Microsoft.PowerShell.Archive -Force\n\nWrite-Output \"> Setup bash.exe (git-for-windows/PortableGit)\"\nInvoke-WebRequest \"https://github.com/git-for-windows/git/releases/download/v2.55.0.windows.5/PortableGit-2.55.0.5-arm64.7z.exe\" -OutFile /git.7z.exe\n/git.7z.exe -o/git -y\n\nWrite-Output \"> Setup Rust\"\nInvoke-WebRequest \"https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe\" -OutFile /rustup-init.exe\n/rustup-init.exe --default-host aarch64-pc-windows-msvc -y\n\nWrite-Output \"> Setup VS Build Tools\"\nInvoke-WebRequest \"https://aka.ms/vs/17/release/vs_BuildTools.exe\" -OutFile /vs_BuildTools.exe\nStart-Process C:/vs_BuildTools.exe -ArgumentList \" `\n    --add Microsoft.VisualStudio.Workload.NativeDesktop `\n    --add Microsoft.VisualStudio.Workload.VCTools `\n    --add Microsoft.VisualStudio.Component.VC.Tools.arm64 `\n    --add Microsoft.VisualStudio.Component.VC.Llvm.Clang `\n    --add Microsoft.VisualStudio.Component.VC.Llvm.ClangToolset `\n    --includeRecommended --quiet --norestart --wait\" -Wait\n\nWrite-Output \"> Setup CMake\"\nInvoke-WebRequest \"https://github.com/Kitware/CMake/releases/download/v4.4.3/cmake-4.4.3-windows-arm64.zip\" -OutFile /cmake.zip\nExpand-Archive /cmake.zip -DestinationPath /\n\nWrite-Output \"> Download jq.exe (github.com/jqlang) (needed for tomlq / yq)\"\nInvoke-WebRequest https://github.com/jqlang/jq/releases/download/jq-1.8.2/jq-windows-arm64.exe -OutFile /jq.exe\n\nWrite-Output \"> Update GITHUB_PATH\"\n[System.IO.File]::AppendAllText($Env:GITHUB_PATH, \"`n\" + \"C:/git/bin/\")\n[System.IO.File]::AppendAllText($Env:GITHUB_PATH, \"`n\" + $Env:USERPROFILE + \"/.cargo/bin/\")\n[System.IO.File]::AppendAllText($Env:GITHUB_PATH, \"`n\" + \"C:/Program Files (x86)/Microsoft Visual Studio/2022/BuildTools/VC/Tools/Llvm/bin/\")\n[System.IO.File]::AppendAllText($Env:GITHUB_PATH, \"`n\" + \"C:/cmake-4.4.3-windows-arm64/bin\")\n[System.IO.File]::AppendAllText($Env:GITHUB_PATH, \"`n\" + \"C:/\")\n[System.IO.File]::AppendAllText($Env:GITHUB_PATH, \"`n\")\n\nGet-Content $Env:GITHUB_PATH | Out-Host\n"
  - name: Check build environment (ARM64 Windows)
    shell: sh
    run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

      cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

      set -x

      bash --version

      rustup show

      clang -v

      cmake --version

      BUILDPROF_SCRIPT_EOF

      ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

      bp_rc=0

      "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Check-build-environment-ARM64-Windows.buildprof" -- bash --noprofile --norc -eo pipefail "$bp_dir/$bp_id.sh" || bp_rc=$?

      kill $bp_watch 2>/dev/null; exit $bp_rc

      '
