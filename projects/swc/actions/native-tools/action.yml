name: Native artifact verifier
description: Build the private host verifier with the repository toolchain
runs:
  using: composite
  steps:
  - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
    with:
      toolchain: nightly-2026-04-10
  - name: Build host tools
    shell: sh
    env:
      RUSTFLAGS: ''
      CARGO_ENCODED_RUSTFLAGS: ''
    run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

      cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

      cargo build --locked -p swc_native_addon_pack --release

      echo "SWC_NATIVE_TOOLS=$GITHUB_WORKSPACE/target/release" >> "$GITHUB_ENV"

      BUILDPROF_SCRIPT_EOF

      ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

      bp_rc=0

      "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Build-host-tools.buildprof" -- bash --noprofile --norc -eo pipefail "$bp_dir/$bp_id.sh" || bp_rc=$?

      kill $bp_watch 2>/dev/null; exit $bp_rc

      '
