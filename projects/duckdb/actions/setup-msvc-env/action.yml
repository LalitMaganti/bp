name: Setup MSVC Environment
description: Configure Visual Studio build tools environment variables via VsDevCmd
inputs:
  arch:
    description: Target architecture passed to VsDevCmd -arch
    required: false
    default: x64
  host_arch:
    description: Host architecture passed to VsDevCmd -host_arch
    required: false
    default: x64
runs:
  using: composite
  steps:
  - name: Setup MSVC variables
    shell: pwsh
    run: "$arch = '${{ inputs.arch }}'\n$hostArch = '${{ inputs.host_arch }}'\n$vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\\Installer\\vswhere.exe'\nif (!(Test-Path $vswhere)) {\n  throw \"vswhere not found at $vswhere\"\n}\n$installationPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath\nif (-not $installationPath) {\n  throw \"Visual Studio with VC tools not found\"\n}\n$vsDevCmd = Join-Path $installationPath 'Common7\\Tools\\VsDevCmd.bat'\nif (!(Test-Path $vsDevCmd)) {\n  throw \"VsDevCmd.bat not found at $vsDevCmd\"\n}\ncmd /c \"`\"$vsDevCmd`\" -no_logo -arch=$arch -host_arch=$hostArch && set\" |\n  ForEach-Object {\n    if ($_ -match '^([^=]+)=(.*)$') {\n      \"$($matches[1])=$($matches[2])\" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append\n    }\n  }\n"
