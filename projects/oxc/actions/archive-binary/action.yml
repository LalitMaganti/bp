name: Archive Binary
description: Archives a single binary using platform-appropriate compression (zip for Windows, tar.gz for Unix)
inputs:
  source_path:
    description: Path to the source binary file
    required: true
  binary_name:
    description: Name for the binary file inside the archive (can include extension like .exe or .node)
    required: true
  archive_name:
    description: Name for the archive file without extension (extension will be added based on platform)
    required: true
runs:
  using: composite
  steps:
  - name: Archive Binary (Windows)
    if: runner.os == 'Windows'
    shell: sh
    run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

      cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

      mv "${INPUTS_SOURCE_PATH}" "${INPUTS_BINARY_NAME}"

      7z a "${INPUTS_ARCHIVE_NAME}.zip" "${INPUTS_BINARY_NAME}"

      BUILDPROF_SCRIPT_EOF

      ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

      bp_rc=0

      "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Archive-Binary-Windows.buildprof" -- bash --noprofile --norc -eo pipefail "$bp_dir/$bp_id.sh" || bp_rc=$?

      kill $bp_watch 2>/dev/null; exit $bp_rc

      '
    env:
      INPUTS_SOURCE_PATH: ${{ inputs.source_path }}
      INPUTS_BINARY_NAME: ${{ inputs.binary_name }}
      INPUTS_ARCHIVE_NAME: ${{ inputs.archive_name }}
  - name: Archive Binary (Unix)
    if: runner.os != 'Windows'
    shell: sh
    run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

      cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

      mv "${INPUTS_SOURCE_PATH}" "${INPUTS_BINARY_NAME}"

      tar czf "${INPUTS_ARCHIVE_NAME}.tar.gz" "${INPUTS_BINARY_NAME}"

      BUILDPROF_SCRIPT_EOF

      ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

      bp_rc=0

      "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Archive-Binary-Unix.buildprof" -- bash --noprofile --norc -eo pipefail "$bp_dir/$bp_id.sh" || bp_rc=$?

      kill $bp_watch 2>/dev/null; exit $bp_rc

      '
    env:
      INPUTS_SOURCE_PATH: ${{ inputs.source_path }}
      INPUTS_BINARY_NAME: ${{ inputs.binary_name }}
      INPUTS_ARCHIVE_NAME: ${{ inputs.archive_name }}
