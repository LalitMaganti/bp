name: Check changes
description: Detect whether a CI job should run based on changed files and crate dependencies.
inputs:
  packages:
    required: false
    description: Comma-separated crate names whose transitive deps (via cargo tree) to check (include mode)
  exclude:
    required: false
    description: Comma-separated crate names to exclude (exclude mode); job runs unless ALL changes are in these dirs
  paths:
    required: false
    description: Comma-separated additional paths that always trigger the job
  token:
    required: false
    description: GitHub token for API access
  pr-number:
    required: false
    description: Pull request number
outputs:
  changed:
    description: Whether the job should run ("true" or "false")
    value: ${{ steps.check.outputs.changed }}
runs:
  using: composite
  steps:
  - name: Check changes
    id: check
    shell: sh
    env:
      GITHUB_TOKEN: ${{ inputs.token }}
      GITHUB_PR_NUMBER: ${{ inputs.pr-number }}
      INPUT_PACKAGES: ${{ inputs.packages }}
      INPUT_EXCLUDE: ${{ inputs.exclude }}
      INPUT_PATHS: ${{ inputs.paths }}
    run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\nARGS=()\nif [ -n \"$INPUT_PACKAGES\" ]; then\n  ARGS+=(\"--packages\" \"$INPUT_PACKAGES\")\nfi\nif [ -n \"$INPUT_EXCLUDE\" ]; then\n  ARGS+=(\"--exclude\" \"$INPUT_EXCLUDE\")\nfi\nif [ -n \"$INPUT_PATHS\" ]; then\n  ARGS+=(\"--paths\" \"$INPUT_PATHS\")\nfi\nSHOULD_RUN=$(node .github/scripts/check-changes.js \"${ARGS[@]}\")\necho \"changed=$SHOULD_RUN\" >> $GITHUB_OUTPUT\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Check-changes.buildprof\" -- bash --noprofile --norc -eo pipefail \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
