name: Build docker image
description: Build docker image
inputs:
  context:
    description: Context argument
    required: true
  file:
    description: Docker file
    required: true
  cache_key_prefix:
    description: Cache key prefix
    required: true
runs:
  using: composite
  steps:
  - name: Pull buildkit image
    shell: sh
    run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\nfor attempt in 1 2 3 4 5; do\n  [ \"$attempt\" = \"5\" ] && exit 1\n  docker pull moby/buildkit:buildx-stable-1 && break\n  sleep 5\ndone\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Pull-buildkit-image.buildprof\" -- bash --noprofile --norc -eo pipefail \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
  - name: Set up Docker Buildx
    uses: docker/setup-buildx-action@v4
    with:
      driver-opts: image=moby/buildkit:buildx-stable-1
  - name: Setup Github Actions cache
    uses: actions/cache/restore@v5
    id: cache-restore
    with:
      path: ${{ runner.tool_cache }}/docker-buildx-cache
      key: ${{ inputs.cache_key_prefix }}-${{ hashFiles(inputs.file) }}
  - name: Build docker image
    shell: sh
    run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\nfor attempt in 1 2 3 4 5; do\n  [ \"$attempt\" = \"5\" ] && exit 1\n  docker buildx build \\\n    --file ${{ inputs.file }} \\\n    --tag build-image \\\n    --cache-from type=local,src=${{ runner.tool_cache }}/docker-buildx-cache \\\n    --cache-to type=local,dest=${{ runner.tool_cache }}/docker-buildx-cache \\\n    --load \\\n    ${{ inputs.context }} && break\n  sleep 5\ndone\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Build-docker-image.buildprof\" -- bash --noprofile --norc -eo pipefail \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
  - name: Save Github Actions cache
    uses: actions/cache/save@v5
    if: github.ref == 'refs/heads/main'
    with:
      path: ${{ runner.tool_cache }}/docker-buildx-cache
      key: ${{ steps.cache-restore.outputs.cache-primary-key }}
