name: 'fish: make serial vs -j4 (untraced)'
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [serial, j4]
        rep: [1, 2, 3]
    env:
      FISH_TEST_MAX_CONCURRENCY: "4"
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
    steps:
    - uses: actions/checkout@v4
      with:
        repository: fish-shell/fish-shell
        ref: 849fea792a5cefd3299df33f43a8ae98aed10b6f
    - uses: ./.github/actions/rust-toolchain@oldest-supported
    - uses: ./.github/actions/install-dependencies
      with:
        include_sphinx: true
    - run: lscpu | grep -E 'Model name|^CPU\(s\)'
    - run: mkdir build && cd build && cmake .. -DCMAKE_BUILD_TYPE=RelWithDebInfo
    - name: make
      run: |
        j=; [ "${{ matrix.mode }}" = j4 ] && j=-j4
        start=$(date +%s)
        make -C build VERBOSE=1 $j > make.log 2>&1 || { tail -50 make.log; exit 1; }
        echo "MAKE ${{ matrix.mode }} $(( $(date +%s) - start )) s"
    - name: make fish_run_tests
      run: |
        start=$(date +%s); rc=0
        make -C build VERBOSE=1 fish_run_tests > test.log 2>&1 || rc=$?
        echo "TESTS ${{ matrix.mode }} $(( $(date +%s) - start )) s rc=$rc"; tail -5 test.log; exit $rc
