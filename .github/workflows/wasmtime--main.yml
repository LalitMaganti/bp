    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: ${{ 'push' != 'pull_request' }}
      matrix: ${{ fromJson(needs.determine.outputs.build-matrix) }}
    env: ${{ matrix.env || fromJSON('{}') }}
    steps:
    - name: Fetch buildprof
      uses: actions/checkout@v4
