  test_wasi_tls:
    name: Test wasi-tls
    needs: determine
    if: needs.determine.outputs.run-full
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
        - ubuntu-latest
    steps:
    - name: Fetch buildprof
      uses: actions/checkout@v4
      with:
        repository: LalitMaganti/bp
        path: .buildprof-fetch
        sparse-checkout: '.buildprof

          projects/wasmtime'
        persist-credentials: false
    - name: Install buildprof
      shell: sh
      working-directory: ${{ github.workspace }}
      run: 'mkdir -p "$RUNNER_TEMP/buildprof-bin" "$RUNNER_TEMP/buildprof-actions"

        cp .buildprof-fetch/.buildprof/buildprof-* "$RUNNER_TEMP/buildprof-bin/" && chmod +x "$RUNNER_TEMP/buildprof-bin/"*

        if [ "$(id -u)" != 0 ] && sudo -n true 2>/dev/null; then sudo setcap cap_sys_ptrace,cap_sys_admin+ep "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)"; fi

        if [ -d .buildprof-fetch/projects/wasmtime/actions ]; then cp -r .buildprof-fetch/projects/wasmtime/actions/. "$RUNNER_TEMP/buildprof-actions/"; fi

        rm -rf .buildprof-fetch

        '
    - uses: actions/checkout@v7
      with:
        submodules: true
        repository: bytecodealliance/wasmtime
        ref: 1a9d6d2d41603924ce0bedc36c5c2f50d2fd6b74
    - name: Wrap upstream composite actions
      shell: sh
      working-directory: ${{ github.workspace }}
      run: "if [ -n \"$(ls -A \"$RUNNER_TEMP/buildprof-actions\" 2>/dev/null)\" ]; then\n  cp -r \"$RUNNER_TEMP/buildprof-actions/.\" \"./.github/actions/\"\n  (cd \".\" && git ls-files -m .github/actions | xargs -r git update-index --assume-unchanged) 2>/dev/null || true\nfi\n"
    - uses: ./.github/actions/install-rust
    - name: Configure OpenSSL (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: 'mkdir "C:\Program Files\OpenSSL\certs"

        $sslCertFile = "C:\Program Files\OpenSSL\certs\cacert.pem"

        $opensslDir = "C:\Program Files\OpenSSL"

        $opensslLibDir = "C:\Program Files\OpenSSL\lib\VC\x64\MD"

        curl.exe -o $sslCertFile https://curl.se/ca/cacert.pem

        "SSL_CERT_FILE=$sslCertFile" | Out-File -FilePath $env:GITHUB_ENV -Append

        "OPENSSL_DIR=$opensslDir" | Out-File -FilePath $env:GITHUB_ENV -Append

        "OPENSSL_LIB_DIR=$opensslLibDir" | Out-File -FilePath $env:GITHUB_ENV -Append

        '
