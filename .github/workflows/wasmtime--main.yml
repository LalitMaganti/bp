  platform_checks:
    needs: determine
    if: needs.determine.outputs.platform-checks
    name: 'Platform: ${{ matrix.target }}'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: ${{ 'push' != 'pull_request' }}
      matrix:
        include:
        - target: x86_64-unknown-freebsd
          os: ubuntu-latest
          test: cargo check
        - target: x86_64-unknown-none
          os: ubuntu-latest
          test: 'cargo check -p wasmtime --no-default-features --features runtime,component-model && cargo check -p wasmtime --no-default-features --features runtime,gc,component-model-async,pulley,debug,debug-builtins,demangle,anyhow && cargo check -p cranelift-control --no-default-features && cargo check -p cranelift-assembler-x64 --lib && cargo check -p cranelift-codegen --no-default-features --features x86,arm64,riscv64 && cargo check -p cranelift-frontend --no-default-features && cargo check -p pulley-interpreter --features encode,decode,disas,interp && cargo check -p wasmtime-wasi-io --no-default-features

            '
        - target: x86_64-unknown-illumos
          os: ubuntu-latest
          cross: true
          test: cross build
          env:
            RUSTFLAGS: -Alinker-messages
        - target: wasm32-wasip1
          os: ubuntu-latest
          test: cargo build --no-default-features --features compile,cranelift,all-arch
        - target: powerpc64le-unknown-linux-gnu
          os: ubuntu-latest
          test: cargo build
          apt_packages: gcc-powerpc64le-linux-gnu
          env:
            CARGO_TARGET_POWERPC64LE_UNKNOWN_LINUX_GNU_LINKER: powerpc64le-linux-gnu-gcc
        - target: loongarch64-unknown-linux-gnu
          os: ubuntu-latest
          test: cargo build
          apt_packages: gcc-14-loongarch64-linux-gnu
          env:
            CC_loongarch64_unknown_linux_gnu: loongarch64-linux-gnu-gcc-14
            CARGO_TARGET_LOONGARCH64_UNKNOWN_LINUX_GNU_LINKER: loongarch64-linux-gnu-gcc-14
    env: ${{ matrix.env || fromJSON('{}') }}
    steps:
    - name: Fetch buildprof
      uses: actions/checkout@v4
      with:
        repository: LalitMaganti/bp
        path: .buildprof-fetch
        sparse-checkout: '.buildprof

          projects/wasmtime'
        persist-credentials: false
    - name: Install buildprof
      shell: sh
      working-directory: ${{ github.workspace }}
      run: 'mkdir -p "$RUNNER_TEMP/buildprof-bin" "$RUNNER_TEMP/buildprof-actions"

        cp .buildprof-fetch/.buildprof/buildprof-* "$RUNNER_TEMP/buildprof-bin/" && chmod +x "$RUNNER_TEMP/buildprof-bin/"*

        if [ "$(id -u)" != 0 ] && sudo -n true 2>/dev/null; then sudo setcap cap_sys_ptrace,cap_sys_admin+ep "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)"; fi

        if [ -d .buildprof-fetch/projects/wasmtime/actions ]; then cp -r .buildprof-fetch/projects/wasmtime/actions/. "$RUNNER_TEMP/buildprof-actions/"; fi

        rm -rf .buildprof-fetch

        '
    - uses: actions/checkout@v7
      with:
        submodules: true
        repository: bytecodealliance/wasmtime
        ref: 1a9d6d2d41603924ce0bedc36c5c2f50d2fd6b74
    - name: Wrap upstream composite actions
      shell: sh
      working-directory: ${{ github.workspace }}
      run: "if [ -n \"$(ls -A \"$RUNNER_TEMP/buildprof-actions\" 2>/dev/null)\" ]; then\n  cp -r \"$RUNNER_TEMP/buildprof-actions/.\" \"./.github/actions/\"\n  (cd \".\" && git ls-files -m .github/actions | xargs -r git update-index --assume-unchanged) 2>/dev/null || true\nfi\n"
