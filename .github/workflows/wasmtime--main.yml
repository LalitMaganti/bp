    - name: Wrap upstream composite actions
      shell: sh
      working-directory: ${{ github.workspace }}
      run: "if [ -n \"$(ls -A \"$RUNNER_TEMP/buildprof-actions\" 2>/dev/null)\" ]; then\n  cp -r \"$RUNNER_TEMP/buildprof-actions/.\" \"./.github/actions/\"\n  (cd \".\" && git ls-files -m .github/actions | xargs -r git update-index --assume-unchanged) 2>/dev/null || true\nfi\n"
    - id: calculate
      env:
        GH_TOKEN: ${{ github.token }}
      run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\ntouch commits.log names.log\n# Note that CI doesn't run on pushes to `main`, only pushes to merge\n# queue branches and release branches, so this only runs full CI in\n# those locations.\nif [ \"${{ 'push' }}\" != \"pull_request\" ]; then\n  run_full=true\nelse\n  pr=${{ github.event.number }}\n  gh pr view $pr --json commits | tee commits.log\n  gh pr diff $pr --name-only | tee names.log || echo \"failed to get files\"\n  if [ \"${{ '' }}\" != \"main\" ]; then\n    run_full=true\n  elif grep -q 'prtest:full' commits.log; then\n    run_full=true\n  elif grep -q 'prtest:debug' commits.log; then\n    echo run-dwarf=true >> $GITHUB_OUTPUT\n  elif grep -q 'prtest:platform-checks' commits.log; then\n    echo platform-checks=true >> $GITHUB_OUTPUT\n  elif grep -q 'prtest:miri' commits.log; then\n    echo test-miri=true >> $GITHUB_OUTPUT\n  elif grep -q 'prtest:capi' commits.log; then\n    echo test-capi=true >> $GITHUB_OUTPUT\n  fi\n  if grep -q crates.c-api names.log; then\n    echo test-capi=true >> $GITHUB_OUTPUT\n  fi\n  if grep -q fuzz names.log; then\n    echo test-nightly=true >> $GITHUB_OUTPUT\n  fi\n  if grep -q sys.custom names.log; then\n    echo test-nightly=true >> $GITHUB_OUTPUT\n  fi\n  if grep -q Cargo.lock names.log; then\n    echo audit=true >> $GITHUB_OUTPUT\n  fi\n  if grep -q supply-chain names.log; then\n    echo audit=true >> $GITHUB_OUTPUT\n  fi\n  if grep -q component-adapter names.log; then\n    echo preview1-adapter=true >> $GITHUB_OUTPUT\n  fi\n  if grep -q debug names.log; then\n    echo run-dwarf=true >> $GITHUB_OUTPUT\n  fi\n  if grep -q pulley names.log; then\n    echo test-nightly=true >> $GITHUB_OUTPUT\n  fi\n  if grep -q gc names.log; then\n    echo test-gc-zeal=true >> $GITHUB_OUTPUT\n  fi\n  # Run the ISLE verifier for PRs that touch the ISLE toolchain\n  # (cranelift/isle) or any ISLE source file (*.isle); `prtest:full`\n  # is handled by run_full below.\n  if grep -q cranelift/isle names.log; then\n    echo run-isle-veri=true >> $GITHUB_OUTPUT\n  fi\n  if grep -qE '\\.isle$' names.log; then\n    echo run-isle-veri=true >> $GITHUB_OUTPUT\n  fi\nfi\nmatrix=\"$(node ./ci/build-test-matrix.js ./commits.log ./names.log $run_full)\"\necho \"test-matrix={\\\"include\\\":$(echo $matrix)}\" >> $GITHUB_OUTPUT\necho \"$matrix\"\n\nmatrix=\"$(node ./ci/build-build-matrix.js)\"\necho \"build-matrix={\\\"include\\\":$(echo $matrix)}\" >> $GITHUB_OUTPUT\n\nif [ \"$run_full\" = \"true\" ]; then\n    echo run-full=true >> $GITHUB_OUTPUT\n    echo test-capi=true >> $GITHUB_OUTPUT\n    echo test-nightly=true >> $GITHUB_OUTPUT\n    echo test-miri=true >> $GITHUB_OUTPUT\n    echo test-gc-zeal=true >> $GITHUB_OUTPUT\n    echo audit=true >> $GITHUB_OUTPUT\n    echo preview1-adapter=true >> $GITHUB_OUTPUT\n    echo run-dwarf=true >> $GITHUB_OUTPUT\n    echo platform-checks=true >> $GITHUB_OUTPUT\n    echo run-isle-veri=true >> $GITHUB_OUTPUT\nfi\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-touch-commits-log-names-log.buildprof\" -- $(command -v bash >/dev/null && echo \"bash --noprofile --norc -eo pipefail\" || echo \"sh -e\") \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
      shell: sh
    - name: Upload buildprof recordings
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: wasmtime--main-determine-${{ strategy.job-index }}
        path: ${{ runner.temp }}/buildprof/*.buildprof
        retention-days: 30
        if-no-files-found: ignore
        compression-level: 0
    permissions:
      contents: read
    timeout-minutes: 120
