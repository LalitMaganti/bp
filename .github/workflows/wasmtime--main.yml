      env:
        CARGO_BUILD_TARGET: ${{ matrix.target }}
      shell: sh
    - name: Upload buildprof recordings
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: wasmtime--main-platform_checks-${{ strategy.job-index }}
        path: ${{ runner.temp }}/buildprof/*.buildprof
        retention-days: 30
