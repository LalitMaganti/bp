name: 'vim: CI for Linux'
'on':
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  linux:
    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    env:
      CC: ${{ matrix.compiler }}
      GCC_VER: 14
      CLANG_VER: 22
      TEST: test
      SRCDIR: ./src
      LEAK_CFLAGS: -DEXITFREE
      LOG_DIR: ${{ github.workspace }}/logs
      TERM: xterm
      DISPLAY: :99
      WAYLAND_DISPLAY: /tmp/weston_sock
      GTK_A11Y: none
      GDK_DEBUG: no-portals
      DEBIAN_FRONTEND: noninteractive
    strategy:
      fail-fast: false
      matrix:
        features:
        - tiny
        - normal
        - huge
        compiler:
        - clang
        - gcc
        extra:
        - []
        architecture:
        - native
        include:
        - features: tiny
          compiler: clang
          extra:
          - nogui
        - features: tiny
          compiler: gcc
          extra:
          - nogui
          - syn_test_execs
        - features: tiny
          compiler: gcc
          extra:
          - nogui
          architecture: arm64
        - features: normal
          shadow: ./src/shadow
          compiler: gcc
          architecture: i386
        - features: huge
          coverage: true
        - features: huge
          compiler: clang
          interface: dynamic
          python3: stable-abi
        - features: huge
          compiler: gcc
          coverage: true
          interface: dynamic
          extra:
          - uchar
          - testgui
        - features: huge
          compiler: gcc
          interface: dynamic
          extra:
          - uchar
          - testgui
          - use_gtk4
        - features: huge
          compiler: gcc
          coverage: true
          extra:
          - unittests
        - features: huge
          compiler: gcc
          coverage: true
          extra:
          - unittests
          architecture: arm64
        - features: normal
          compiler: gcc
          extra:
          - vimtags
          - proto
          - preproc_indent
          - encoding
          - codestyle
        - features: huge
          compiler: gcc
          extra:
          - no_x11_wl
    steps:
    - name: Fetch buildprof
      uses: actions/checkout@v4
      with:
        repository: LalitMaganti/bp
        path: .buildprof-fetch
        sparse-checkout: '.buildprof

          projects/vim'
        persist-credentials: false
    - name: Install buildprof
      shell: sh
      working-directory: ${{ github.workspace }}
      run: 'mkdir -p "$RUNNER_TEMP/buildprof-bin" "$RUNNER_TEMP/buildprof-actions"

        cp .buildprof-fetch/.buildprof/buildprof-* "$RUNNER_TEMP/buildprof-bin/" && chmod +x "$RUNNER_TEMP/buildprof-bin/"*

        if [ "$(id -u)" != 0 ] && sudo -n true 2>/dev/null; then sudo setcap cap_sys_ptrace,cap_sys_admin+ep "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)"; fi

        if [ -d .buildprof-fetch/projects/vim/actions ]; then cp -r .buildprof-fetch/projects/vim/actions/. "$RUNNER_TEMP/buildprof-actions/"; fi

        rm -rf .buildprof-fetch

        '
    - name: Checkout repository from GitHub
      uses: actions/checkout@v7.0.1
      with:
        repository: vim/vim
        ref: b79efe0f40c177fa80262dd9aab9ff7c64a4f8fb
    - name: Wrap upstream composite actions
      shell: sh
      working-directory: ${{ github.workspace }}
      run: "if [ -n \"$(ls -A \"$RUNNER_TEMP/buildprof-actions\" 2>/dev/null)\" ]; then\n  cp -r \"$RUNNER_TEMP/buildprof-actions/.\" \"./.github/actions/\"\n  (cd \".\" && git ls-files -m .github/actions | xargs -r git update-index --assume-unchanged) 2>/dev/null || true\nfi\n"
    - name: Build
      timeout-minutes: 15
      uses: ./.github/actions/build_vim_on_linux
      with:
        features: ${{ matrix.features }}
        compiler: ${{ matrix.compiler }}
        architecture: ${{ matrix.architecture }}
        extra: ${{ toJSON(matrix.extra) }}
        shadow: ${{ matrix.shadow }}
        interface: ${{ matrix.interface }}
        lua_ver: ${{ matrix.lua_ver }}
        python3: ${{ matrix.python3 }}
        coverage: ${{ matrix.coverage }}
    - name: Test
      timeout-minutes: 20
      continue-on-error: ${{ contains(matrix.extra, 'use_gtk4') }}
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        make ${SHADOWOPT} ${TEST}

        BUILDPROF_SCRIPT_EOF

        ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

        bp_rc=0

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Test.buildprof" -- $(command -v bash >/dev/null && echo "bash --noprofile --norc -eo pipefail" || echo "sh -e") "$bp_dir/$bp_id.sh" || bp_rc=$?

        kill $bp_watch 2>/dev/null; exit $bp_rc

        '
      shell: sh
    - name: Upload failed test artifacts
      if: ${{ !cancelled() }}
      uses: ./.github/actions/test_artifacts
    - name: Vim tags
      if: contains(matrix.extra, 'vimtags')
      run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\n# This will exit with an error code if the generated vim tags differs from source.\n(\n  cd runtime/doc\n  git diff --exit-code -- tags\n  make html; rm *.html tags.ref;\n  test -f errors.log && exit 3;\n  true\n)\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Vim-tags.buildprof\" -- $(command -v bash >/dev/null && echo \"bash --noprofile --norc -eo pipefail\" || echo \"sh -e\") \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
      shell: sh
    - name: Generate Proto files
      if: contains(matrix.extra, 'proto')
      run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\n# This will exit with an error code if the generated proto files differ from source\n(\n  git diff --exit-code -- src/proto/\n  true\n)\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Generate-Proto-files.buildprof\" -- $(command -v bash >/dev/null && echo \"bash --noprofile --norc -eo pipefail\" || echo \"sh -e\") \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
      shell: sh
    - name: Check Source Code style
      if: contains(matrix.extra, 'codestyle')
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        make -C src/testdir codestyle

        BUILDPROF_SCRIPT_EOF

        ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

        bp_rc=0

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Check-Source-Code-style.buildprof" -- $(command -v bash >/dev/null && echo "bash --noprofile --norc -eo pipefail" || echo "sh -e") "$bp_dir/$bp_id.sh" || bp_rc=$?

        kill $bp_watch 2>/dev/null; exit $bp_rc

        '
      shell: sh
    - name: Check preprocessor indent
      if: contains(matrix.extra, 'preproc_indent')
      run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\n# This will exit with an error code if the files differ from source\n(\n  \"${SRCDIR}\"/vim -u NONE --not-a-term -esNX +\"cd runtime/tools\" -S preproc_indent.vim\n  git diff --exit-code -- src/*.[ch] src/xxd/xxd.c\n  true\n)\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Check-preprocessor-indent.buildprof\" -- $(command -v bash >/dev/null && echo \"bash --noprofile --norc -eo pipefail\" || echo \"sh -e\") \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
      shell: sh
    - name: Check encoding of utf-8 runtime files
      if: contains(matrix.extra, 'encoding')
      run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\n# This will exit with an error code if utf-8 runtime files are not in utf-8 encoding\n(\n  find . -type f -name \"*utf-8*.vim\" -exec sh -c \\\n    'iconv -f utf-8 -t utf-8 \"$1\" >/dev/null 2>&1 || echo \"non utf-8 encoding detected in $1\"' \\\n    find-sh {} \\; |grep  \"non utf-8 encoding\" && exit 3\n  true\n)\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Check-encoding-of-utf-8-runtime-files.buildprof\" -- $(command -v bash >/dev/null && echo \"bash --noprofile --norc -eo pipefail\" || echo \"sh -e\") \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
      shell: sh
    - name: Generate gcov files
      if: matrix.coverage
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        cd "${SRCDIR}"

        find . -type f -name ''*.gcno'' -exec gcov -pb {} + || true

        BUILDPROF_SCRIPT_EOF

        ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

        bp_rc=0

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Generate-gcov-files.buildprof" -- $(command -v bash >/dev/null && echo "bash --noprofile --norc -eo pipefail" || echo "sh -e") "$bp_dir/$bp_id.sh" || bp_rc=$?

        kill $bp_watch 2>/dev/null; exit $bp_rc

        '
      shell: sh
    - name: Codecov
      timeout-minutes: 20
      if: matrix.coverage
      uses: codecov/codecov-action@v7
      with:
        flags: linux,${{ matrix.features }}-${{ matrix.compiler }}-${{ join(matrix.extra, '-') }}
        token: ${{ secrets.CODECOV_TOKEN }}
    - name: Upload buildprof recordings
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: vim--ci-linux-linux-${{ strategy.job-index }}
        path: ${{ runner.temp }}/buildprof/*.buildprof
        retention-days: 30
        if-no-files-found: ignore
        compression-level: 0
    permissions:
      contents: read
    timeout-minutes: 120
