      matrix:
        os:
        - ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTEST_WORKERS: auto
      PATTERN: not slow and not network and not clipboard and not single_cpu
      PYTEST_TARGET: pandas
    steps:
    - name: Fetch buildprof
      uses: actions/checkout@v4
