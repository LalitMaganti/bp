name: 'pandas: Unit Tests'
'on':
  workflow_dispatch: null
permissions:
  contents: read
defaults:
  run:
    shell: bash -euox pipefail {0}
jobs:
  ubuntu:
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: read
    timeout-minutes: 120
    strategy:
      matrix:
        platform:
        - ubuntu-24.04
        - ubuntu-24.04-arm
        environment:
        - py311
        - py312
        - py313
        - py314
        pytest_marker_expression:
        - ''
        pandas_future:
        - default
        include:
        - name: Downstream Compat
          environment: downstream
          pytest_marker_expression: not slow and not network and not single_cpu
          pytest_target: pandas/tests/test_downstream.py
          platform: ubuntu-24.04
        - name: Minimum Versions
          environment: minimum-versions
          pytest_marker_expression: not slow and not network and not single_cpu
          platform: ubuntu-24.04
        - name: Freethreading
          environment: py314-freethreading
          pytest_marker_expression: not slow and not network and not single_cpu
          platform: ubuntu-24.04
        - name: Without PyArrow
          environment: no-pyarrow
          pytest_marker_expression: not slow and not network and not single_cpu
          platform: ubuntu-24.04
        - name: 'Locale: it_IT'
          environment: py313
          pytest_marker_expression: not slow and not network and not single_cpu
          extra_apt: language-pack-it
          lang: it_IT.utf8
          lc_all: it_IT.utf8
          extra_loc: it_IT
          platform: ubuntu-24.04
        - name: 'Locale: zh_CN'
          environment: py313
          pytest_marker_expression: not slow and not network and not single_cpu
          extra_apt: language-pack-zh-hans
          lang: zh_CN.utf8
          lc_all: zh_CN.utf8
          extra_loc: zh_CN
          platform: ubuntu-24.04
        - name: Future configs legacy values
          environment: py313
          pandas_future: legacy
          platform: ubuntu-24.04
        - name: Future configs upcoming values
          environment: py313
          pandas_future: upcoming
          platform: ubuntu-24.04
        - name: Numpy Nightly
          environment: numpy-nightly
          pytest_marker_expression: not slow and not network and not single_cpu
          platform: ubuntu-24.04
        - name: Pyarrow Nightly
          environment: pyarrow-nightly
          pytest_marker_expression: not slow and not network and not single_cpu
          platform: ubuntu-24.04
      fail-fast: false
    name: ${{ matrix.name || format('{0} {1}', matrix.platform, matrix.environment) }}
    env:
      LANG: ${{ matrix.lang || 'C.UTF-8' }}
      LC_ALL: ${{ matrix.lc_all || '' }}
    services:
      mysql:
        image: mysql:9
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: true
          MYSQL_DATABASE: pandas
        options: --health-cmd "mysqladmin ping" --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
        - 3306:3306
      postgres:
        image: postgres:18
        env:
          PGUSER: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pandas
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
        - 5432:5432
      moto:
        image: motoserver/moto:5.1.18
        ports:
        - 5000:5000
    steps:
    - name: Fetch buildprof
      uses: actions/checkout@v4
      with:
        repository: LalitMaganti/bp
        path: .buildprof-fetch
        sparse-checkout: '.buildprof

          projects/pandas'
        persist-credentials: false
    - name: Install buildprof
      shell: sh
      working-directory: ${{ github.workspace }}
      run: 'mkdir -p "$RUNNER_TEMP/buildprof-bin" "$RUNNER_TEMP/buildprof-actions"

        cp .buildprof-fetch/.buildprof/buildprof-* "$RUNNER_TEMP/buildprof-bin/" && chmod +x "$RUNNER_TEMP/buildprof-bin/"*

        if [ "$(id -u)" != 0 ] && sudo -n true 2>/dev/null; then sudo setcap cap_sys_ptrace,cap_sys_admin+ep "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)"; fi

        if [ -d .buildprof-fetch/projects/pandas/actions ]; then cp -r .buildprof-fetch/projects/pandas/actions/. "$RUNNER_TEMP/buildprof-actions/"; fi

        rm -rf .buildprof-fetch

        '
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
        repository: pandas-dev/pandas
        ref: bd94549744b25d29e3ce676a7092a14261d3cd19
    - name: Wrap upstream composite actions
      shell: sh
      working-directory: ${{ github.workspace }}
      run: "if [ -n \"$(ls -A \"$RUNNER_TEMP/buildprof-actions\" 2>/dev/null)\" ]; then\n  cp -r \"$RUNNER_TEMP/buildprof-actions/.\" \"./.github/actions/\"\n  (cd \".\" && git ls-files -m .github/actions | xargs -r git update-index --assume-unchanged) 2>/dev/null || true\nfi\n"
    - name: Generate extra locales
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        sudo apt-get update

        sudo apt-get install --yes ${{ matrix.extra_apt }}

        sudo locale-gen ${{ matrix.extra_loc }}

        BUILDPROF_SCRIPT_EOF

        ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

        bp_rc=0

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Generate-extra-locales.buildprof" -- $(command -v bash >/dev/null && echo "bash --noprofile --norc -eo pipefail" || echo "sh -e") "$bp_dir/$bp_id.sh" || bp_rc=$?

        kill $bp_watch 2>/dev/null; exit $bp_rc

        '
      if: ${{ matrix.extra_loc && matrix.extra_apt }}
      shell: sh
    - name: Create virtual environment with Pixi
      uses: ./.github/actions/setup-pixi
      with:
        environment: ${{ matrix.environment }}
    - name: Build pandas
      id: build
      run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\npixi run \\\n  --environment ${{ matrix.environment }} \\\n  build-pandas \\\n  --editable \\\n  ${{ ! (matrix.name == 'Freethreading' || matrix.name == 'Minimum Versions') && '-Csetup-args=\"--werror\"' || '' }}\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Build-pandas.buildprof\" -- $(command -v bash >/dev/null && echo \"bash --noprofile --norc -eo pipefail\" || echo \"sh -e\") \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
      shell: sh
    - name: Import check
      run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\npixi run \\\n  --environment ${{ matrix.environment }} \\\n  ci-check-import\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Import-check.buildprof\" -- $(command -v bash >/dev/null && echo \"bash --noprofile --norc -eo pipefail\" || echo \"sh -e\") \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
      shell: sh
    - name: Test (not single_cpu)
      uses: ./.github/actions/run-tests
      id: test-not-single-cpu
      env:
        PANDAS_MOTO_URL: http://localhost:5000
      with:
        environment: ${{ matrix.environment }}
        numprocesses: auto
        pytest_marker_expression: ${{ matrix.pytest_marker_expression == '' && 'not single_cpu' || matrix.pytest_marker_expression }}
        pytest_target: ${{ matrix.pytest_target || 'pandas' }}
        pandas_future: ${{ matrix.pandas_future || 'default' }}
    - name: Test (single_cpu)
      id: test-single-cpu
      uses: ./.github/actions/run-tests
      env:
        PANDAS_MOTO_URL: http://localhost:5000
      with:
        environment: ${{ matrix.environment }}
        numprocesses: 0
        pytest_marker_expression: single_cpu
        pytest_target: ${{ matrix.pytest_target || 'pandas' }}
        pandas_future: ${{ matrix.pandas_future || 'default' }}
      if: ${{ matrix.pytest_marker_expression == '' && (always() && steps.build.outcome == 'success')}}
    - name: Upload test coverage to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
      with:
        flags: unittests
        name: codecov-pandas-${{ matrix.name || format('{0}-{1}', matrix.platform, matrix.environment) }}
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false
        disable_telem: true
      if: ${{ steps.test-not-single-cpu.outcome == 'success' && steps.test-single-cpu.outcome == 'success' }}
    - name: Upload buildprof recordings
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pandas--unit-tests-ubuntu-${{ strategy.job-index }}
        path: ${{ runner.temp }}/buildprof/*.buildprof
        retention-days: 30
        if-no-files-found: ignore
        compression-level: 0
  Linux-32-bit:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    container:
      image: quay.io/pypa/manylinux_2_28_i686
      options: --platform linux/386
    steps:
    - name: Fetch buildprof
      uses: actions/checkout@v4
      with:
        repository: LalitMaganti/bp
        path: .buildprof-fetch
        sparse-checkout: '.buildprof

          projects/pandas'
        persist-credentials: false
    - name: Install buildprof
      shell: sh
      working-directory: ${{ github.workspace }}
      run: 'mkdir -p "$RUNNER_TEMP/buildprof-bin" "$RUNNER_TEMP/buildprof-actions"

        cp .buildprof-fetch/.buildprof/buildprof-* "$RUNNER_TEMP/buildprof-bin/" && chmod +x "$RUNNER_TEMP/buildprof-bin/"*

        if [ "$(id -u)" != 0 ] && sudo -n true 2>/dev/null; then sudo setcap cap_sys_ptrace,cap_sys_admin+ep "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)"; fi

        if [ -d .buildprof-fetch/projects/pandas/actions ]; then cp -r .buildprof-fetch/projects/pandas/actions/. "$RUNNER_TEMP/buildprof-actions/"; fi

        rm -rf .buildprof-fetch

        '
    - name: Checkout pandas Repo
      run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\ngit config --global --add safe.directory $PWD\n\nif [ $GITHUB_EVENT_NAME != pull_request ]; then\n    git clone --recursive --branch=$GITHUB_REF_NAME https://github.com/${GITHUB_REPOSITORY}.git $GITHUB_WORKSPACE\n    git reset --hard $GITHUB_SHA\nelse\n    git clone --recursive https://github.com/${GITHUB_REPOSITORY}.git $GITHUB_WORKSPACE\n    git fetch origin $GITHUB_REF:my_ref_name\n    git checkout $GITHUB_BASE_REF\n    git -c user.email=\"you@example.com\" merge --no-commit my_ref_name\nfi\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Checkout-pandas-Repo.buildprof\" -- $(command -v bash >/dev/null && echo \"bash --noprofile --norc -eo pipefail\" || echo \"sh -e\") \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
      shell: sh
    - name: Build environment
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        /opt/python/cp313-cp313/bin/python -m venv ~/virtualenvs/pandas-dev

        . ~/virtualenvs/pandas-dev/bin/activate

        python -m pip install --no-cache-dir -U pip wheel meson[ninja] meson-python

        python -m pip install numpy -Csetup-args="-Dallow-noblas=true"

        python -m pip install --no-cache-dir versioneer[toml] cython python-dateutil "pytest>=8.3.4" pytest-xdist>=3.6.1 pytest-cov

        python -m pip install --no-cache-dir --no-build-isolation -e . -Csetup-args="--werror" -Csetup-args=-Dc_args="-Wno-overflow -Wno-type-limits -Wno-shift-count-overflow -Wno-sign-compare"

        python -m pip list --no-cache-dir

        BUILDPROF_SCRIPT_EOF

        ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

        bp_rc=0

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Build-environment.buildprof" -- $(command -v bash >/dev/null && echo "bash --noprofile --norc -eo pipefail" || echo "sh -e") "$bp_dir/$bp_id.sh" || bp_rc=$?

        kill $bp_watch 2>/dev/null; exit $bp_rc

        '
      shell: sh
    - name: Run Tests
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        . ~/virtualenvs/pandas-dev/bin/activate

        python -m pytest -m ''not slow and not network and not clipboard and not single_cpu'' pandas

        BUILDPROF_SCRIPT_EOF

        ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

        bp_rc=0

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Run-Tests.buildprof" -- $(command -v bash >/dev/null && echo "bash --noprofile --norc -eo pipefail" || echo "sh -e") "$bp_dir/$bp_id.sh" || bp_rc=$?

        kill $bp_watch 2>/dev/null; exit $bp_rc

        '
      shell: sh
    - name: Upload buildprof recordings
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pandas--unit-tests-Linux-32-bit-${{ strategy.job-index }}
        path: ${{ runner.temp }}/buildprof/*.buildprof
        retention-days: 30
        if-no-files-found: ignore
        compression-level: 0
    timeout-minutes: 120
