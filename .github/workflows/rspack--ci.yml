name: 'rspack: CI'
'on':
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  check-changed:
    runs-on: ${{ fromJSON(vars.CI_LINUX_MINI_RUNNER || '"ubuntu-latest"') }}
    name: Check Source Changed
    outputs:
      code_changed: ${{ steps.filter.outputs.code_changed == 'true' }}
      document_changed: ${{ steps.filter.outputs.document_changed == 'true' }}
    steps:
    - name: Fetch buildprof
      uses: actions/checkout@v4
      with:
        repository: LalitMaganti/bp
        path: .buildprof-fetch
        sparse-checkout: '.buildprof

          projects/rspack'
        persist-credentials: false
    - name: Install buildprof
      shell: sh
      working-directory: ${{ github.workspace }}
      run: 'mkdir -p "$RUNNER_TEMP/buildprof-bin" "$RUNNER_TEMP/buildprof-actions"

        cp .buildprof-fetch/.buildprof/buildprof-* "$RUNNER_TEMP/buildprof-bin/" && chmod +x "$RUNNER_TEMP/buildprof-bin/"*

        if [ "$(id -u)" != 0 ] && sudo -n true 2>/dev/null; then sudo setcap cap_sys_ptrace,cap_sys_admin+ep "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)"; fi

        if [ -d .buildprof-fetch/projects/rspack/actions ]; then cp -r .buildprof-fetch/projects/rspack/actions/. "$RUNNER_TEMP/buildprof-actions/"; fi

        rm -rf .buildprof-fetch

        '
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: web-infra-dev/rspack
        ref: 162dd637f972c2f99165ca264d14fde12bea391d
    - name: Wrap upstream composite actions
      shell: sh
      working-directory: ${{ github.workspace }}
      run: "if [ -n \"$(ls -A \"$RUNNER_TEMP/buildprof-actions\" 2>/dev/null)\" ]; then\n  cp -r \"$RUNNER_TEMP/buildprof-actions/.\" \"./.github/actions/\"\n  (cd \".\" && git ls-files -m .github/actions | xargs -r git update-index --assume-unchanged) 2>/dev/null || true\nfi\n"
    - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
      id: filter
      with:
        predicate-quantifier: every
        filters: "code_changed:\n  - \"!**/*.md\"\n  - \"!**/*.mdx\"\n  - \"!.agents/**\"\n  - \"!website/**\"\ndocument_changed:\n  - \"website/**\"\n"
    - name: Upload buildprof recordings
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: rspack--ci-check-changed-${{ strategy.job-index }}
        path: ${{ runner.temp }}/buildprof/*.buildprof
        retention-days: 30
        if-no-files-found: ignore
        compression-level: 0
    permissions:
      contents: read
    timeout-minutes: 120
  build-linux:
    name: Build Linux
    needs:
    - check-changed
    if: ${{ needs.check-changed.outputs.code_changed == 'true' }}
    uses: ./.github/workflows/rspack--reusable-build-build.yml
    with:
      target: x86_64-unknown-linux-gnu
      profile: ci
      runner: ${{ vars.LINUX_SELF_HOSTED_RUNNER_LABELS || '"ubuntu-22.04"' }}
  build-website-for-fork:
    name: Build Website for Fork PR
    needs:
    - check-changed
    if: ${{ 'push' == 'pull_request' && github.event.pull_request.head.repo.fork && needs.check-changed.outputs.document_changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
    - name: Fetch buildprof
      uses: actions/checkout@v4
      with:
        repository: LalitMaganti/bp
        path: .buildprof-fetch
        sparse-checkout: '.buildprof

          projects/rspack'
        persist-credentials: false
    - name: Install buildprof
      shell: sh
      working-directory: ${{ github.workspace }}
      run: 'mkdir -p "$RUNNER_TEMP/buildprof-bin" "$RUNNER_TEMP/buildprof-actions"

        cp .buildprof-fetch/.buildprof/buildprof-* "$RUNNER_TEMP/buildprof-bin/" && chmod +x "$RUNNER_TEMP/buildprof-bin/"*

        if [ "$(id -u)" != 0 ] && sudo -n true 2>/dev/null; then sudo setcap cap_sys_ptrace,cap_sys_admin+ep "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)"; fi

        if [ -d .buildprof-fetch/projects/rspack/actions ]; then cp -r .buildprof-fetch/projects/rspack/actions/. "$RUNNER_TEMP/buildprof-actions/"; fi

        rm -rf .buildprof-fetch

        '
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: web-infra-dev/rspack
        ref: 162dd637f972c2f99165ca264d14fde12bea391d
    - name: Wrap upstream composite actions
      shell: sh
      working-directory: ${{ github.workspace }}
      run: "if [ -n \"$(ls -A \"$RUNNER_TEMP/buildprof-actions\" 2>/dev/null)\" ]; then\n  cp -r \"$RUNNER_TEMP/buildprof-actions/.\" \"./.github/actions/\"\n  (cd \".\" && git ls-files -m .github/actions | xargs -r git update-index --assume-unchanged) 2>/dev/null || true\nfi\n"
    - name: Pnpm Setup
      uses: ./.github/actions/pnpm/setup
    - name: Pnpm Install
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        pnpm install --frozen-lockfile

        BUILDPROF_SCRIPT_EOF

        ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

        bp_rc=0

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Pnpm-Install.buildprof" -- $(command -v bash >/dev/null && echo "bash --noprofile --norc -eo pipefail" || echo "sh -e") "$bp_dir/$bp_id.sh" || bp_rc=$?

        kill $bp_watch 2>/dev/null; exit $bp_rc

        '
      shell: sh
    - name: Build Website
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        pnpm --dir website run build

        BUILDPROF_SCRIPT_EOF

        ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

        bp_rc=0

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Build-Website.buildprof" -- $(command -v bash >/dev/null && echo "bash --noprofile --norc -eo pipefail" || echo "sh -e") "$bp_dir/$bp_id.sh" || bp_rc=$?

        kill $bp_watch 2>/dev/null; exit $bp_rc

        '
      shell: sh
    - name: Upload buildprof recordings
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: rspack--ci-build-website-for-fork-${{ strategy.job-index }}
        path: ${{ runner.temp }}/buildprof/*.buildprof
        retention-days: 30
        if-no-files-found: ignore
        compression-level: 0
  test-linux:
    name: Test Linux
    needs:
    - check-changed
    - build-linux
    if: ${{ needs.check-changed.outputs.code_changed == 'true' }}
    uses: ./.github/workflows/rspack--reusable-build-test.yml
    with:
      target: x86_64-unknown-linux-gnu
      runner: '"ubuntu-22.04"'
  bench-rust:
    name: Rust Bench
    needs:
    - check-changed
    if: ${{ needs.check-changed.outputs.code_changed == 'true' }}
    uses: ./.github/workflows/rspack--bench-rust.yml
    with:
      target: x86_64-unknown-linux-gnu
      runner: '"rspack-ubuntu-24.04-vm-medium-verify"'
  bench-rust-walltime:
    name: Rust Bench Walltime
    needs:
    - check-changed
    if: ${{ needs.check-changed.outputs.code_changed == 'true' && ('push' == 'workflow_dispatch' || ('push' == 'push' && ('refs/heads/main' == 'refs/heads/main' || 'refs/heads/main' == 'refs/heads/release/2.3.0'))) }}
    uses: ./.github/workflows/rspack--bench-rust.yml
    with:
      target: x86_64-unknown-linux-gnu
      measurement: walltime
      bench_target: walltime
      runner: '"physical-1-exclusive"'
  test-windows:
    name: Test Windows
    needs:
    - check-changed
    if: ${{ needs.check-changed.outputs.code_changed == 'true' }}
    uses: ./.github/workflows/rspack--reusable-build.yml
    with:
      target: x86_64-pc-windows-msvc
      profile: ci
      runner: ${{ vars.WINDOWS_SELF_HOSTED_RUNNER_LABELS || '"windows-latest"' }}
      test-runner: '"windows-latest"'
      test: true
  test-mac:
    name: Test Mac ARM64
    needs:
    - check-changed
    if: ${{ needs.check-changed.outputs.code_changed == 'true' }}
    uses: ./.github/workflows/rspack--reusable-build.yml
    with:
      target: aarch64-apple-darwin
      profile: ci
      runner: ${{ vars.MAC_SELF_HOSTED_RUNNER_LABELS || '"macos-latest"' }}
      test-runner: ${{ '"macos-latest"' }}
      test: true
  build-wasm:
    name: Build WASM
    needs:
    - check-changed
    if: ${{ needs.check-changed.outputs.code_changed == 'true' }}
    uses: ./.github/workflows/rspack--reusable-build-build.yml
    with:
      target: wasm32-wasip1-threads
      profile: ci
      runner: ${{ vars.LINUX_SELF_HOSTED_RUNNER_LABELS || '"ubuntu-22.04"' }}
  test-wasm:
    name: Test WASM
    needs:
    - check-changed
    - build-wasm
    if: ${{ needs.check-changed.outputs.code_changed == 'true' }}
    uses: ./.github/workflows/rspack--reusable-build-test.yml
    with:
      target: wasm32-wasip1-threads
      runner: ${{ vars.LINUX_SELF_HOSTED_RUNNER_LABELS || '"ubuntu-22.04"' }}
  build-riscv64:
    name: Build riscv64
    needs:
    - check-changed
    if: ${{ needs.check-changed.outputs.code_changed == 'true' && 'push' == 'push' && ('refs/heads/main' == 'refs/heads/main' || 'refs/heads/main' == 'refs/heads/release/2.3.0') }}
    uses: ./.github/workflows/rspack--reusable-build-build.yml
    with:
      target: riscv64gc-unknown-linux-gnu
      profile: ci
      runner: ${{ vars.LINUX_SELF_HOSTED_RUNNER_LABELS || '"ubuntu-22.04"' }}
  build-ppc64:
    name: Build ppc64
    needs:
    - check-changed
    if: ${{ needs.check-changed.outputs.code_changed == 'true' && 'push' == 'push' && ('refs/heads/main' == 'refs/heads/main' || 'refs/heads/main' == 'refs/heads/release/2.3.0') }}
    uses: ./.github/workflows/rspack--reusable-build-build.yml
    with:
      target: powerpc64le-unknown-linux-gnu
      profile: ci
      runner: ${{ vars.LINUX_SELF_HOSTED_RUNNER_LABELS || '"ubuntu-22.04"' }}
  build-s390x:
    name: Build s390x
    needs:
    - check-changed
    if: ${{ needs.check-changed.outputs.code_changed == 'true' && 'push' == 'push' && ('refs/heads/main' == 'refs/heads/main' || 'refs/heads/main' == 'refs/heads/release/2.3.0') }}
    uses: ./.github/workflows/rspack--reusable-build-build.yml
    with:
      target: s390x-unknown-linux-gnu
      profile: ci
      runner: ${{ vars.LINUX_SELF_HOSTED_RUNNER_LABELS || '"ubuntu-22.04"' }}
  check-cache:
    name: Check Cache Portable
    needs:
    - test-linux
    - test-windows
    if: ${{ false }}
    runs-on: ${{ fromJSON(vars.LINUX_SELF_HOSTED_RUNNER_LABELS || '"ubuntu-22.04"') }}
    steps:
    - name: Fetch buildprof
      uses: actions/checkout@v4
      with:
        repository: LalitMaganti/bp
        path: .buildprof-fetch
        sparse-checkout: '.buildprof

          projects/rspack'
        persist-credentials: false
    - name: Install buildprof
      shell: sh
      working-directory: ${{ github.workspace }}
      run: 'mkdir -p "$RUNNER_TEMP/buildprof-bin" "$RUNNER_TEMP/buildprof-actions"

        cp .buildprof-fetch/.buildprof/buildprof-* "$RUNNER_TEMP/buildprof-bin/" && chmod +x "$RUNNER_TEMP/buildprof-bin/"*

        if [ "$(id -u)" != 0 ] && sudo -n true 2>/dev/null; then sudo setcap cap_sys_ptrace,cap_sys_admin+ep "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)"; fi

        if [ -d .buildprof-fetch/projects/rspack/actions ]; then cp -r .buildprof-fetch/projects/rspack/actions/. "$RUNNER_TEMP/buildprof-actions/"; fi

        rm -rf .buildprof-fetch

        '
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: web-infra-dev/rspack
        ref: 162dd637f972c2f99165ca264d14fde12bea391d
    - name: Wrap upstream composite actions
      shell: sh
      working-directory: ${{ github.workspace }}
      run: "if [ -n \"$(ls -A \"$RUNNER_TEMP/buildprof-actions\" 2>/dev/null)\" ]; then\n  cp -r \"$RUNNER_TEMP/buildprof-actions/.\" \"./.github/actions/\"\n  (cd \".\" && git ls-files -m .github/actions | xargs -r git update-index --assume-unchanged) 2>/dev/null || true\nfi\n"
    - name: Install Rust Toolchain
      uses: ./.github/actions/rustup
      with:
        key: test_cache
        save-if: true
    - name: Download linux cache
      uses: ./.github/actions/artifact/download
      with:
        name: testCase-persistentCache-linux
        path: ./cache-linux
        force-use-github-only: true
    - name: Download windows cache
      uses: ./.github/actions/artifact/download
      with:
        name: testCase-persistentCache-windows
        path: ./cache-windows
        force-use-github-only: true
    - name: Run compare kit
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        cargo run -p rspack_tools -- compare ./cache-linux ./cache-windows

        BUILDPROF_SCRIPT_EOF

        ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

        bp_rc=0

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Run-compare-kit.buildprof" -- $(command -v bash >/dev/null && echo "bash --noprofile --norc -eo pipefail" || echo "sh -e") "$bp_dir/$bp_id.sh" || bp_rc=$?

        kill $bp_watch 2>/dev/null; exit $bp_rc

        '
      shell: sh
    - name: Upload buildprof recordings
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: rspack--ci-check-cache-${{ strategy.job-index }}
        path: ${{ runner.temp }}/buildprof/*.buildprof
        retention-days: 30
        if-no-files-found: ignore
        compression-level: 0
    permissions:
      contents: read
    timeout-minutes: 120
  test_required_check:
    name: Test Required Check
    needs:
    - build-linux
    - build-website-for-fork
    - test-linux
    - test-windows
    - test-mac
    - build-wasm
    - build-riscv64
    - build-ppc64
    - build-s390x
    - test-wasm
    - check-changed
    - check-cache
    if: ${{ always() && !cancelled() }}
    runs-on: ${{ fromJSON(vars.CI_LINUX_MINI_RUNNER || '"ubuntu-latest"') }}
    steps:
    - name: Fetch buildprof
      uses: actions/checkout@v4
      with:
        repository: LalitMaganti/bp
        path: .buildprof-fetch
        sparse-checkout: '.buildprof

          projects/rspack'
        persist-credentials: false
    - name: Install buildprof
      shell: sh
      working-directory: ${{ github.workspace }}
      run: 'mkdir -p "$RUNNER_TEMP/buildprof-bin" "$RUNNER_TEMP/buildprof-actions"

        cp .buildprof-fetch/.buildprof/buildprof-* "$RUNNER_TEMP/buildprof-bin/" && chmod +x "$RUNNER_TEMP/buildprof-bin/"*

        if [ "$(id -u)" != 0 ] && sudo -n true 2>/dev/null; then sudo setcap cap_sys_ptrace,cap_sys_admin+ep "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)"; fi

        if [ -d .buildprof-fetch/projects/rspack/actions ]; then cp -r .buildprof-fetch/projects/rspack/actions/. "$RUNNER_TEMP/buildprof-actions/"; fi

        rm -rf .buildprof-fetch

        '
    - name: Log
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        echo ${{ join(needs.*.result, '','') }}

        BUILDPROF_SCRIPT_EOF

        ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

        bp_rc=0

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Log.buildprof" -- $(command -v bash >/dev/null && echo "bash --noprofile --norc -eo pipefail" || echo "sh -e") "$bp_dir/$bp_id.sh" || bp_rc=$?

        kill $bp_watch 2>/dev/null; exit $bp_rc

        '
      shell: sh
    - name: Test check
      if: "${{\n  needs.check-changed.result != 'success' ||\n  (needs.check-changed.outputs.code_changed == 'true' &&\n    (needs.build-linux.result != 'success' ||\n      needs.test-linux.result != 'success' ||\n      needs.test-windows.result != 'success' ||\n      needs.test-mac.result != 'success' ||\n      needs.build-wasm.result != 'success' ||\n      ('push' == 'push' &&\n        ('refs/heads/main' == 'refs/heads/main' || 'refs/heads/main' == 'refs/heads/release/2.3.0') &&\n        (needs.build-riscv64.result != 'success' ||\n          needs.build-ppc64.result != 'success' ||\n          needs.build-s390x.result != 'success')) ||\n      needs.test-wasm.result != 'success' ||\n      needs.check-cache.result != 'skipped'))\n}}"
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        echo "Test Failed" && exit 1

        BUILDPROF_SCRIPT_EOF

        ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

        bp_rc=0

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Test-check.buildprof" -- $(command -v bash >/dev/null && echo "bash --noprofile --norc -eo pipefail" || echo "sh -e") "$bp_dir/$bp_id.sh" || bp_rc=$?

        kill $bp_watch 2>/dev/null; exit $bp_rc

        '
      shell: sh
    - name: Website check
      if: "${{\n  'push' == 'pull_request' &&\n  github.event.pull_request.head.repo.fork &&\n  needs.check-changed.outputs.document_changed == 'true' &&\n  needs.build-website-for-fork.result != 'success'\n}}"
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        echo "Website Build Failed" && exit 1

        BUILDPROF_SCRIPT_EOF

        ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

        bp_rc=0

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Website-check.buildprof" -- $(command -v bash >/dev/null && echo "bash --noprofile --norc -eo pipefail" || echo "sh -e") "$bp_dir/$bp_id.sh" || bp_rc=$?

        kill $bp_watch 2>/dev/null; exit $bp_rc

        '
      shell: sh
    - name: No check to Run test
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        echo "Success"

        BUILDPROF_SCRIPT_EOF

        ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

        bp_rc=0

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-No-check-to-Run-test.buildprof" -- $(command -v bash >/dev/null && echo "bash --noprofile --norc -eo pipefail" || echo "sh -e") "$bp_dir/$bp_id.sh" || bp_rc=$?

        kill $bp_watch 2>/dev/null; exit $bp_rc

        '
      shell: sh
    - name: Upload buildprof recordings
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: rspack--ci-test_required_check-${{ strategy.job-index }}
        path: ${{ runner.temp }}/buildprof/*.buildprof
        retention-days: 30
        if-no-files-found: ignore
        compression-level: 0
    permissions:
      contents: read
    timeout-minutes: 120
  size-limit:
    name: Binary Size Limit
    needs:
    - check-changed
    - build-linux
    if: ${{ needs.check-changed.outputs.code_changed == 'true' && ('push' == 'pull_request' || ('push' == 'push' && 'web-infra-dev/rspack' == 'web-infra-dev/rspack')) }}
    uses: ./.github/workflows/rspack--size-limit.yml
  ecosystem_ci_per_commit:
    name: Run ecosystem CI per commit
    needs:
    - check-changed
    - build-linux
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    if: ${{ needs.check-changed.outputs.code_changed == 'true' && 'push' == 'push' }}
    steps:
    - name: Fetch buildprof
      uses: actions/checkout@v4
      with:
        repository: LalitMaganti/bp
        path: .buildprof-fetch
        sparse-checkout: '.buildprof

          projects/rspack'
        persist-credentials: false
    - name: Install buildprof
      shell: sh
      working-directory: ${{ github.workspace }}
      run: 'mkdir -p "$RUNNER_TEMP/buildprof-bin" "$RUNNER_TEMP/buildprof-actions"

        cp .buildprof-fetch/.buildprof/buildprof-* "$RUNNER_TEMP/buildprof-bin/" && chmod +x "$RUNNER_TEMP/buildprof-bin/"*

        if [ "$(id -u)" != 0 ] && sudo -n true 2>/dev/null; then sudo setcap cap_sys_ptrace,cap_sys_admin+ep "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)"; fi

        if [ -d .buildprof-fetch/projects/rspack/actions ]; then cp -r .buildprof-fetch/projects/rspack/actions/. "$RUNNER_TEMP/buildprof-actions/"; fi

        rm -rf .buildprof-fetch

        '
    - name: Trigger Ecosystem CI
      uses: rstackjs/rstack-ecosystem-ci/.github/actions/ecosystem_ci_per_commit@4b0ec855ccbd27595a0df4781ed58b77e64d25ee
      with:
        github-token: ${{ secrets.REPO_RSTACK_ECO_CI_GITHUB_TOKEN }}
        ecosystem-owner: web-infra-dev
        ecosystem-repo: rspack
        workflow-file: rspack-ecosystem-ci-from-commit.yml
        client-payload: '{"commitSHA":"${{ github.sha }}","updateComment":true,"repo":"web-infra-dev/rspack","suite":"-","suiteRefType":"precoded","suiteRef":"precoded","sourceRunId":"${{ github.run_id }}","sourceRepo":"web-infra-dev/rspack"}'
    - name: Upload buildprof recordings
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: rspack--ci-ecosystem_ci_per_commit-${{ strategy.job-index }}
        path: ${{ runner.temp }}/buildprof/*.buildprof
        retention-days: 30
        if-no-files-found: ignore
        compression-level: 0
  upload-binary-size:
    name: Upload Binary Size
    needs:
    - check-changed
    - build-linux
    if: ${{ needs.check-changed.outputs.code_changed == 'true' && 'push' == 'push' && 'web-infra-dev/rspack' == 'web-infra-dev/rspack' }}
    runs-on: ${{ fromJSON(vars.CI_LINUX_MINI_RUNNER || '"ubuntu-latest"') }}
    steps:
    - name: Fetch buildprof
      uses: actions/checkout@v4
      with:
        repository: LalitMaganti/bp
        path: .buildprof-fetch
        sparse-checkout: '.buildprof

          projects/rspack'
        persist-credentials: false
    - name: Install buildprof
      shell: sh
      working-directory: ${{ github.workspace }}
      run: 'mkdir -p "$RUNNER_TEMP/buildprof-bin" "$RUNNER_TEMP/buildprof-actions"

        cp .buildprof-fetch/.buildprof/buildprof-* "$RUNNER_TEMP/buildprof-bin/" && chmod +x "$RUNNER_TEMP/buildprof-bin/"*

        if [ "$(id -u)" != 0 ] && sudo -n true 2>/dev/null; then sudo setcap cap_sys_ptrace,cap_sys_admin+ep "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)"; fi

        if [ -d .buildprof-fetch/projects/rspack/actions ]; then cp -r .buildprof-fetch/projects/rspack/actions/. "$RUNNER_TEMP/buildprof-actions/"; fi

        rm -rf .buildprof-fetch

        '
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: web-infra-dev/rspack
        ref: 162dd637f972c2f99165ca264d14fde12bea391d
    - name: Wrap upstream composite actions
      shell: sh
      working-directory: ${{ github.workspace }}
      run: "if [ -n \"$(ls -A \"$RUNNER_TEMP/buildprof-actions\" 2>/dev/null)\" ]; then\n  cp -r \"$RUNNER_TEMP/buildprof-actions/.\" \"./.github/actions/\"\n  (cd \".\" && git ls-files -m .github/actions | xargs -r git update-index --assume-unchanged) 2>/dev/null || true\nfi\n"
    - name: Download binding artifact
      uses: ./.github/actions/artifact/download
      with:
        name: bindings-x86_64-unknown-linux-gnu
        path: crates/node_binding/
    - name: Strip binary
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        strip crates/node_binding/rspack.linux-x64-gnu.node

        BUILDPROF_SCRIPT_EOF

        ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

        bp_rc=0

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Strip-binary.buildprof" -- $(command -v bash >/dev/null && echo "bash --noprofile --norc -eo pipefail" || echo "sh -e") "$bp_dir/$bp_id.sh" || bp_rc=$?

        kill $bp_watch 2>/dev/null; exit $bp_rc

        '
      shell: sh
    - name: Upload binary size
      uses: actions/github-script@450193c5abd4cdb17ba9f3ffcfe8f635c4bb6c2a
      env:
        PERF_DATA_TOKEN: ${{ secrets.PERF_DATA_TOKEN }}
      with:
        script: 'const { pathToFileURL } = require(''node:url'');

          const { default: upload } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/actions/binary-limit/upload-binary-size.mjs`).href);

          upload({ sha: context.sha, token: process.env.PERF_DATA_TOKEN });

          '
    - name: Upload buildprof recordings
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: rspack--ci-upload-binary-size-${{ strategy.job-index }}
        path: ${{ runner.temp }}/buildprof/*.buildprof
        retention-days: 30
        if-no-files-found: ignore
        compression-level: 0
    permissions:
      contents: read
    timeout-minutes: 120
