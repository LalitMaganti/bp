root.tar.xz | sudo tar -x\nsudo mount --rbind /dev /sysroot/dev\nsudo mount --rbind /sys /sysroot/sys\nsudo mount --rbind /home /sysroot/home\nsudo mount -t proc /proc /sysroot/proc\ncd\n\necho \"Done.\"\n\n# Configure the build environment. Both Rust and Clang will produce\n# llvm bitcode only, so we can use lld's incremental LTO support.\n\n# Load the sysroot's env vars\necho \"sysroot env:\"\ncat /sysroot/.env\n. /sysroot/.env\n\n# Important notes:\n#   1. -ldl seems to be required to avoid a failure in FFI tests. This flag seems\n#      to be in the Rust default flags in the smoketest, so uncertain why we need\n#      to be explicit here.\n#   2. RUSTFLAGS and RUSTDOCFLAGS must be specified, otherwise the doctests fail\n#      to build because the object formats are not compatible.\necho \"\nCARGO_PROFILE_BENCH_INCREMENTAL=false\nCARGO_PROFILE_RELEASE_INCREMENTAL=false\nRUSTFLAGS<<__1\n  -C linker-plugin-lto=true\n  -C linker=clang-22\n  -C link-arg=-fuse-ld=lld-22\n  -C link-arg=-Wl,--icf=safe\n  -C link-arg=-ldl\n  -C link-arg=-Wl,--allow-shlib-undefined\n  -C link-arg=-Wl,--thinlto-cache-dir=$(pwd)/target/release/lto-cache\n  -C link-arg=-Wl,--thinlto-cache-policy,cache_size_bytes=700m\n  -C link-arg=/tmp/memfd_create_shim.o\n  -C link-arg=/tmp/glibc_math_shim.o\n  -C link-arg=-Wl,--wrap=expf\n  -C link-arg=-Wl,--wrap=powf\n  -C link-arg=-Wl,--wrap=exp2f\n  -C link-arg=-Wl,--wrap=log2f\n  -C link-arg=-Wl,--wrap=logf\n  --cfg tokio_unstable\n  $RUSTFLAGS\n__1\nRUSTDOCFLAGS<<__1\n  -C linker-plugin-lto=true\n  -C linker=clang-22\n  -C link-arg=-fuse-ld=lld-22\n  -C link-arg=-Wl,--icf=safe\n  -C link-arg=-ldl\n  -C link-arg=-Wl,--allow-shlib-undefined\n  -C link-arg=-Wl,--thinlto-cache-dir=$(pwd)/target/release/lto-cache\n  -C link-arg=-Wl,--thinlto-cache-policy,cache_size_bytes=700m\n  -C link-arg=/tmp/memfd_create_shim.o\n  -C link-arg=/tmp/glibc_math_shim.o\n  -C link-arg=-Wl,--wrap=expf\n  -C link-arg=-Wl,--wrap=powf\n  -C link-arg=-Wl,--wrap=exp2f\n  -C link-arg=-Wl,--wrap=log2f\n  -C link-arg=-Wl,--wrap=logf\n  --cfg tokio_unstable\n  $RUSTFLAGS\n__1\nCC=/usr/bin/clang-22\nCFLAGS=$CFLAGS\n\" > $GITHUB_ENV\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Set-up-incremental-LTO-and-sysroot-build.buildprof\" -- bash --noprofile --norc -eo pipefail \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
