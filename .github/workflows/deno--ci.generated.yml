    - name: Log versions
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        echo ''*** Python''

        command -v python && python --version || echo ''No python found or bad executable''

        echo ''*** Rust''

        command -v rustc && rustc --version || echo ''No rustc found or bad executable''

        echo ''*** Cargo''

