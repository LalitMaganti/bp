  test-release-linux-x86_64:
    name: test ${{ matrix.test_crate }} ${{ matrix.shard_label }}release linux-x86_64
    needs:
    - build-release-linux-x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        include:
        - test_crate: integration
          test_package: integration_tests
          shard_index: '0'
          shard_total: '2'
          shard_label: '(1/2) '
        - test_crate: integration
          test_package: integration_tests
          shard_index: '1'
          shard_total: '2'
          shard_label: '(2/2) '
        - test_crate: node_compat
          test_package: node_compat_tests
          shard_index: '0'
          shard_total: '3'
          shard_label: '(1/3) '
        - test_crate: node_compat
          test_package: node_compat_tests
          shard_index: '1'
          shard_total: '3'
          shard_label: '(2/3) '
        - test_crate: node_compat
          test_package: node_compat_tests
          shard_index: '2'
          shard_total: '3'
          shard_label: '(3/3) '
        - test_crate: specs
          test_package: specs_tests
          shard_index: '0'
          shard_total: '2'
          shard_label: '(1/2) '
        - test_crate: specs
          test_package: specs_tests
          shard_index: '1'
          shard_total: '2'
          shard_label: '(2/2) '
        - test_crate: unit
          test_package: unit_tests
          shard_index: '0'
          shard_total: '1'
          shard_label: ''
        - test_crate: unit_node
          test_package: unit_node_tests
          shard_index: '0'
          shard_total: '1'
          shard_label: ''
      fail-fast: false
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: full
      RUST_LIB_BACKTRACE: 0
    steps:
    - name: Fetch buildprof
      uses: actions/checkout@v4
      with:
        repository: LalitMaganti/bp
        path: .buildprof-fetch
        sparse-checkout: '.buildprof

          projects/deno'
        persist-credentials: false
    - name: Install buildprof
      shell: sh
      working-directory: ${{ github.workspace }}
      run: 'mkdir -p "$RUNNER_TEMP/buildprof-bin" "$RUNNER_TEMP/buildprof-actions"

        cp .buildprof-fetch/.buildprof/buildprof-* "$RUNNER_TEMP/buildprof-bin/" && chmod +x "$RUNNER_TEMP/buildprof-bin/"*

        if [ "$(id -u)" != 0 ] && sudo -n true 2>/dev/null; then sudo setcap cap_sys_ptrace,cap_sys_admin+ep "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)"; fi

        if [ -d .buildprof-fetch/projects/deno/actions ]; then cp -r .buildprof-fetch/projects/deno/actions/. "$RUNNER_TEMP/buildprof-actions/"; fi

        rm -rf .buildprof-fetch

        '
    - name: Configure git
      if: '!startsWith(''refs/heads/main'', ''refs/tags/'') && (matrix.shard_index == 0 || ''push'' == ''pull_request'')'
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        git config --global core.symlinks true

        git config --global fetch.parallel 32

        BUILDPROF_SCRIPT_EOF

        ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

        bp_rc=0

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Configure-git.buildprof" -- bash --noprofile --norc -eo pipefail "$bp_dir/$bp_id.sh" || bp_rc=$?

        kill $bp_watch 2>/dev/null; exit $bp_rc

        '
      shell: sh
    - name: Clone repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      if: '!startsWith(''refs/heads/main'', ''refs/tags/'') && (matrix.shard_index == 0 || ''push'' == ''pull_request'')'
      with:
        fetch-depth: 5
        submodules: false
        repository: denoland/deno
        ref: 9766cc5e3bc958d11f4fdb98ea841a47d13da8e4
    - name: Wrap upstream composite actions
      shell: sh
      working-directory: ${{ github.workspace }}
      run: "if [ -n \"$(ls -A \"$RUNNER_TEMP/buildprof-actions\" 2>/dev/null)\" ]; then\n  cp -r \"$RUNNER_TEMP/buildprof-actions/.\" \"./.github/actions/\"\n  (cd \".\" && git ls-files -m .github/actions | xargs -r git update-index --assume-unchanged) 2>/dev/null || true\nfi\n"
    - name: Clone submodule ./tests/node_compat/runner/suite
      if: '!startsWith(''refs/heads/main'', ''refs/tags/'') && (matrix.shard_index == 0 || ''push'' == ''pull_request'') && matrix.test_crate == ''node_compat'''
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        git submodule update --init --recursive --depth=1 -- ./tests/node_compat/runner/suite

        BUILDPROF_SCRIPT_EOF

        ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

        bp_rc=0

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Clone-submodule-tests-node-compat-runner.buildprof" -- bash --noprofile --norc -eo pipefail "$bp_dir/$bp_id.sh" || bp_rc=$?

        kill $bp_watch 2>/dev/null; exit $bp_rc

        '
      shell: sh
    - name: Clone submodule ./tests/util/std
      if: '!startsWith(''refs/heads/main'', ''refs/tags/'') && (matrix.shard_index == 0 || ''push'' == ''pull_request'')'
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        git submodule update --init --recursive --depth=1 -- ./tests/util/std

        BUILDPROF_SCRIPT_EOF

        ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

        bp_rc=0

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Clone-submodule-tests-util-std.buildprof" -- bash --noprofile --norc -eo pipefail "$bp_dir/$bp_id.sh" || bp_rc=$?

        kill $bp_watch 2>/dev/null; exit $bp_rc

        '
      shell: sh
    - name: Restore cache cargo home
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      if: '!startsWith(''refs/heads/main'', ''refs/tags/'') && (matrix.shard_index == 0 || ''push'' == ''pull_request'')'
      with:
        path: '~/.cargo/.crates.toml

          ~/.cargo/.crates2.json

          ~/.cargo/bin

          ~/.cargo/registry/index

          ~/.cargo/registry/cache

          ~/.cargo/git/db'
        key: never_saved
        restore-keys: 125-cargo-home-linux-x86_64-test-${{ matrix.test_crate }}-
    - name: Restore cache build output
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      if: '!startsWith(''refs/heads/main'', ''refs/tags/'') && (matrix.shard_index == 0 || ''push'' == ''pull_request'') && ''refs/heads/main'' != ''refs/heads/main'''
      with:
        path: './target

          !./target/*/gn_out

          !./target/*/gn_root

          !./target/*/*.zip

          !./target/*/*.tar.gz'
        key: never_saved
        restore-keys: 125-cargo-target-linux-x86_64-release-test-${{ matrix.test_crate }}-
    - name: Apply and update mtime cache
      uses: ./.github/mtime_cache
      if: '!startsWith(''refs/heads/main'', ''refs/tags/'') && (matrix.shard_index == 0 || ''push'' == ''pull_request'')'
      with:
        cache-path: ./target
    - name: Install Node
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
      if: '!startsWith(''refs/heads/main'', ''refs/tags/'') && (matrix.shard_index == 0 || ''push'' == ''pull_request'')'
      with:
        node-version: 22
    - name: Pre-install rustup 1.28.2 (workaround broken 1.29.0)
      if: '!startsWith(''refs/heads/main'', ''refs/tags/'') && (matrix.shard_index == 0 || ''push'' == ''pull_request'')'
      shell: sh
      run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\nif command -v rustup >/dev/null 2>&1; then\n  if ! rustup --version 2>&1 | grep -q '1\\.29\\.0'; then exit 0; fi\n  echo \"Detected broken rustup 1.29.0, replacing with 1.28.2\"\nfi\ncase \"${RUNNER_OS}-${RUNNER_ARCH}\" in\n  Linux-X64)     target=x86_64-unknown-linux-gnu; ext= ;;\n  Linux-ARM64)   target=aarch64-unknown-linux-gnu; ext= ;;\n  macOS-X64)     target=x86_64-apple-darwin; ext= ;;\n  macOS-ARM64)   target=aarch64-apple-darwin; ext= ;;\n  Windows-X64)   target=x86_64-pc-windows-msvc; ext=.exe ;;\n  Windows-ARM64) target=aarch64-pc-windows-msvc; ext=.exe ;;\n  *) echo \"Unsupported: ${RUNNER_OS}-${RUNNER_ARCH}\"; exit 1 ;;\nesac\ncurl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused -fsSL \\\n  \"https://static.rust-lang.org/rustup/archive/1.28.2/${target}/rustup-init${ext}\" \\\n  -o \"rustup-init${ext}\"\nchmod +x \"rustup-init${ext}\"\n\"./rustup-init${ext}\" -y --default-toolchain none --no-modify-path\nrm \"rustup-init${ext}\"\necho \"${CARGO_HOME:-$HOME/.cargo}/bin\" >> \"$GITHUB_PATH\"\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Pre-install-rustup-1-28-2-workaround-bro.buildprof\" -- bash --noprofile --norc -eo pipefail \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
    - uses: dsherret/rust-toolchain-file@3551321aa44dd44a0393eb3b6bdfbc5d25ecf621
      if: '!startsWith(''refs/heads/main'', ''refs/tags/'') && (matrix.shard_index == 0 || ''push'' == ''pull_request'')'
    - name: Set up incremental LTO and sysroot build
      if: '!startsWith(''refs/heads/main'', ''refs/tags/'') && (matrix.shard_index == 0 || ''push'' == ''pull_request'')'
      timeout-minutes: 10
      run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\n# Setting up sysroot\nexport DEBIAN_FRONTEND=noninteractive\n# Avoid running man-db triggers, which sometimes takes several minutes\n# to complete.\nsudo apt-get -qq remove --purge -y man-db > /dev/null 2> /dev/null\n# Remove older clang before we install\nsudo apt-get -qq remove   'clang-12*' 'clang-13*' 'clang-14*' 'clang-15*' 'clang-16*' 'clang-17*' 'clang-18*' 'clang-19*' 'clang-20*' 'clang-21*' 'llvm-12*' 'llvm-13*' 'llvm-14*' 'llvm-15*' 'llvm-16*' 'llvm-17*' 'llvm-18*' 'llvm-19*' 'llvm-20*' 'llvm-21*' 'lld-12*' 'lld-13*' 'lld-14*' 'lld-15*' 'lld-16*' 'lld-17*' 'lld-18*' 'lld-19*' 'lld-20*' 'lld-21*' > /dev/null 2> /dev/null\n\n# Install clang-XXX, lld-XXX, and debootstrap.\necho \"deb http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main\" |\n  sudo dd of=/etc/apt/sources.list.d/llvm-toolchain-noble-22.list\ncurl https://apt.llvm.org/llvm-snapshot.gpg.key |\n  gpg --dearmor                                 |\nsudo dd of=/etc/apt/trusted.gpg.d/llvm-snapshot.gpg\nsudo apt-get update\n# this was unreliable sometimes, so try again if it fails\nsudo apt-get install -y --no-install-recommends clang-22 lld-22 clang-tools-22 clang-format-22 clang-tidy-22 || (echo 'Failed. Trying again.' && sudo apt-get clean && sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-22 lld-22 clang-tools-22 clang-format-22 clang-tidy-22)\n# Fix alternatives\n(yes '' | sudo update-alternatives --force --all) > /dev/null 2> /dev/null || true\n\nclang-22 -c -o /tmp/memfd_create_shim.o tools/memfd_create_shim.c -fPIC\nclang-22 -c -o /tmp/glibc_math_shim.o tools/glibc_math_shim.c -fPIC\n\necho \"Decompressing sysroot...\"\nwget -q https://github.com/denoland/deno_sysroot_build/releases/download/sysroot-20250207/sysroot-`uname -m`.tar.xz -O /tmp/sysroot.tar.xz\ncd /\nxzcat /tmp/sysroot.tar.xz | sudo tar -x\nsudo mount --rbind /dev /sysroot/dev\nsudo mount --rbind /sys /sysroot/sys\nsudo mount --rbind /home /sysroot/home\nsudo mount -t proc /proc /sysroot/proc\ncd\n\necho \"Done.\"\n\n# Configure the build environment. Both Rust and Clang will produce\n# llvm bitcode only, so we can use lld's incremental LTO support.\n\n# Load the sysroot's env vars\necho \"sysroot env:\"\ncat /sysroot/.env\n. /sysroot/.env\n\n# Important notes:\n#   1. -ldl seems to be required to avoid a failure in FFI tests. This flag seems\n#      to be in the Rust default flags in the smoketest, so uncertain why we need\n#      to be explicit here.\n#   2. RUSTFLAGS and RUSTDOCFLAGS must be specified, otherwise the doctests fail\n#      to build because the object formats are not compatible.\necho \"\nCARGO_PROFILE_BENCH_INCREMENTAL=false\nCARGO_PROFILE_RELEASE_INCREMENTAL=false\nRUSTFLAGS<<__1\n  -C linker-plugin-lto=true\n  -C linker=clang-22\n  -C link-arg=-fuse-ld=lld-22\n  -C link-arg=-Wl,--icf=safe\n  -C link-arg=-ldl\n  -C link-arg=-Wl,--allow-shlib-undefined\n  -C link-arg=-Wl,--thinlto-cache-dir=$(pwd)/target/release/lto-cache\n  -C link-arg=-Wl,--thinlto-cache-policy,cache_size_bytes=700m\n  -C link-arg=/tmp/memfd_create_shim.o\n  -C link-arg=/tmp/glibc_math_shim.o\n  -C link-arg=-Wl,--wrap=expf\n  -C link-arg=-Wl,--wrap=powf\n  -C link-arg=-Wl,--wrap=exp2f\n  -C link-arg=-Wl,--wrap=log2f\n  -C link-arg=-Wl,--wrap=logf\n  --cfg tokio_unstable\n  $RUSTFLAGS\n__1\nRUSTDOCFLAGS<<__1\n  -C linker-plugin-lto=true\n  -C linker=clang-22\n  -C link-arg=-fuse-ld=lld-22\n  -C link-arg=-Wl,--icf=safe\n  -C link-arg=-ldl\n  -C link-arg=-Wl,--allow-shlib-undefined\n  -C link-arg=-Wl,--thinlto-cache-dir=$(pwd)/target/release/lto-cache\n  -C link-arg=-Wl,--thinlto-cache-policy,cache_size_bytes=700m\n  -C link-arg=/tmp/memfd_create_shim.o\n  -C link-arg=/tmp/glibc_math_shim.o\n  -C link-arg=-Wl,--wrap=expf\n  -C link-arg=-Wl,--wrap=powf\n  -C link-arg=-Wl,--wrap=exp2f\n  -C link-arg=-Wl,--wrap=log2f\n  -C link-arg=-Wl,--wrap=logf\n  --cfg tokio_unstable\n  $RUSTFLAGS\n__1\nCC=/usr/bin/clang-22\nCFLAGS=$CFLAGS\n\" > $GITHUB_ENV\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Set-up-incremental-LTO-and-sysroot-build.buildprof\" -- bash --noprofile --norc -eo pipefail \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
