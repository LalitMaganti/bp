      if: '!startsWith(''refs/heads/main'', ''refs/tags/'') && !(!contains(github.event.pull_request.labels.*.name, ''ci-full'') && ''push'' == ''pull_request'') && (matrix.shard_index == 0 || ''push'' == ''pull_request'')'
