  test-debug-linux-x86_64:
    name: test ${{ matrix.test_crate }} ${{ matrix.shard_label }}debug linux-x86_64
    needs:
    - build-debug-linux-x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        include:
        - test_crate: integration
          test_package: integration_tests
          shard_index: '0'
          shard_total: '2'
          shard_label: '(1/2) '
        - test_crate: integration
          test_package: integration_tests
          shard_index: '1'
          shard_total: '2'
          shard_label: '(2/2) '
        - test_crate: node_compat
          test_package: node_compat_tests
          shard_index: '0'
          shard_total: '3'
          shard_label: '(1/3) '
        - test_crate: node_compat
          test_package: node_compat_tests
          shard_index: '1'
          shard_total: '3'
          shard_label: '(2/3) '
        - test_crate: node_compat
          test_package: node_compat_tests
          shard_index: '2'
          shard_total: '3'
          shard_label: '(3/3) '
        - test_crate: specs
          test_package: specs_tests
          shard_index: '0'
          shard_total: '2'
          shard_label: '(1/2) '
        - test_crate: specs
          test_package: specs_tests
          shard_index: '1'
          shard_total: '2'
          shard_label: '(2/2) '
        - test_crate: unit
