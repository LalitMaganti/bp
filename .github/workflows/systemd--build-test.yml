name: 'systemd: Build test'
'on':
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
        - ubuntu-24.04
        python-version:
        - ''
        env:
        - COMPILER: gcc
          COMPILER_VERSION: '11'
          LINKER: bfd
        - COMPILER: gcc
          COMPILER_VERSION: '13'
          LINKER: mold
        - COMPILER: clang
          COMPILER_VERSION: '14'
          LINKER: mold
        - COMPILER: clang
          COMPILER_VERSION: '16'
          LINKER: bfd
        - COMPILER: clang
          COMPILER_VERSION: '18'
          LINKER: lld
        include:
        - env:
            COMPILER: gcc
            COMPILER_VERSION: '11'
            LINKER: bfd
          runner:
          - ubuntu-24.04-ppc64le
          python-version: ''
        - env:
            COMPILER: gcc
            COMPILER_VERSION: '13'
            LINKER: mold
          runner:
          - ubuntu-24.04-arm
          python-version: ''
        - env:
            COMPILER: gcc
            COMPILER_VERSION: '13'
            LINKER: bfd
            CROSS_ARCH: armhf
          runner:
          - ubuntu-24.04-arm
          python-version: ''
        - env:
            COMPILER: gcc
            COMPILER_VERSION: '13'
            LINKER: bfd
            CROSS_ARCH: riscv64
          runner:
          - ubuntu-24.04-arm
          python-version: ''
        - env:
            COMPILER: clang
            COMPILER_VERSION: '18'
            LINKER: lld
          runner:
          - ubuntu-24.04-s390x
          python-version: ''
        - env:
            COMPILER: gcc
            COMPILER_VERSION: '12'
            LINKER: bfd
            CUSTOM_PYTHON: '1'
          runner:
          - ubuntu-22.04
          python-version: '3.9'
    env: ${{ matrix.env }}
    steps:
    - name: Fetch buildprof
      uses: actions/checkout@v4
      with:
        repository: LalitMaganti/bp
        path: .buildprof-fetch
        sparse-checkout: '.buildprof

          projects/systemd'
        persist-credentials: false
    - name: Install buildprof
      shell: sh
      working-directory: ${{ github.workspace }}
      run: 'mkdir -p "$RUNNER_TEMP/buildprof-bin" "$RUNNER_TEMP/buildprof-actions"

        cp .buildprof-fetch/.buildprof/buildprof-* "$RUNNER_TEMP/buildprof-bin/" && chmod +x "$RUNNER_TEMP/buildprof-bin/"*

        if [ "$(id -u)" != 0 ] && sudo -n true 2>/dev/null; then sudo setcap cap_sys_ptrace,cap_sys_admin+ep "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)"; fi

        if [ -d .buildprof-fetch/projects/systemd/actions ]; then cp -r .buildprof-fetch/projects/systemd/actions/. "$RUNNER_TEMP/buildprof-actions/"; fi

        rm -rf .buildprof-fetch

        '
    - name: Repository checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        repository: systemd/systemd
        ref: f34f98ccf50a44a9eb44afffdb8134f876ac7e0c
    - name: Wrap upstream composite actions
      shell: sh
      working-directory: ${{ github.workspace }}
      run: "if [ -n \"$(ls -A \"$RUNNER_TEMP/buildprof-actions\" 2>/dev/null)\" ]; then\n  cp -r \"$RUNNER_TEMP/buildprof-actions/.\" \"./.github/actions/\"\n  (cd \".\" && git ls-files -m .github/actions | xargs -r git update-index --assume-unchanged) 2>/dev/null || true\nfi\n"
    - name: Setup python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: ${{ matrix.python-version }}
    - name: Build check
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        .github/workflows/build-test.sh

        BUILDPROF_SCRIPT_EOF

        ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

        bp_rc=0

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Build-check.buildprof" -- $(command -v bash >/dev/null && echo "bash --noprofile --norc -eo pipefail" || echo "sh -e") "$bp_dir/$bp_id.sh" || bp_rc=$?

        kill $bp_watch 2>/dev/null; exit $bp_rc

        '
      shell: sh
    - name: Upload buildprof recordings
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: systemd--build-test-build-${{ strategy.job-index }}
        path: ${{ runner.temp }}/buildprof/*.buildprof
        retention-days: 30
        if-no-files-found: ignore
        compression-level: 0
    permissions:
      contents: read
    timeout-minutes: 120
