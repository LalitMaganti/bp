name: 'uv: Build release binaries'
'on':
  workflow_call:
    inputs:
      plan:
        required: false
        type: string
permissions:
  contents: read
env:
  ACTIONS_CACHE_MODE: none
  AWS_LC_SYS_USE_SYSTEM: '0'
  PACKAGE_NAME: uv
  MODULE_NAME: uv
  PYTHON_VERSION: '3.11'
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: 10
  UV_LOCKED: 1
jobs:
  sdist:
    name: sdist
    runs-on: ubuntu-24.04
    steps:
    - name: Fetch buildprof
      uses: actions/checkout@v4
      with:
        repository: LalitMaganti/buildprof-ci-survey
        path: .buildprof-fetch
        sparse-checkout: '.buildprof

          projects/uv'
        persist-credentials: false
    - name: Install buildprof
      shell: sh
      working-directory: ${{ github.workspace }}
      run: 'mkdir -p "$RUNNER_TEMP/buildprof-bin" "$RUNNER_TEMP/buildprof-actions"

        cp .buildprof-fetch/.buildprof/buildprof-* "$RUNNER_TEMP/buildprof-bin/" && chmod +x "$RUNNER_TEMP/buildprof-bin/"*

        if [ "$(id -u)" != 0 ] && sudo -n true 2>/dev/null; then sudo setcap cap_sys_ptrace,cap_sys_admin+ep "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)"; fi

        if [ -d .buildprof-fetch/projects/uv/actions ]; then cp -r .buildprof-fetch/projects/uv/actions/. "$RUNNER_TEMP/buildprof-actions/"; fi

        rm -rf .buildprof-fetch

        '
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        repository: astral-sh/uv
        ref: 5477928f71f0634db593a8a10a8012044fe02349
    - name: Wrap upstream composite actions
      shell: sh
      working-directory: ${{ github.workspace }}
      run: 'if [ -n "$(ls -A "$RUNNER_TEMP/buildprof-actions" 2>/dev/null)" ]; then cp -r "$RUNNER_TEMP/buildprof-actions/." "./.github/actions/"; fi

        '
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        cache: ''
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Prep README.md
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        python scripts/transform_readme.py --target pypi

        BUILDPROF_SCRIPT_EOF

        ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

        bp_rc=0

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Prep-README-md.buildprof" -- $(command -v bash >/dev/null && echo "bash --noprofile --norc -eo pipefail" || echo "sh -e") "$bp_dir/$bp_id.sh" || bp_rc=$?

        kill $bp_watch 2>/dev/null; exit $bp_rc

        '
      shell: sh
    - name: Check Cargo.lock
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        cargo metadata --locked --format-version 1 > /dev/null

        BUILDPROF_SCRIPT_EOF

        ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

        bp_rc=0

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Check-Cargo-lock.buildprof" -- $(command -v bash >/dev/null && echo "bash --noprofile --norc -eo pipefail" || echo "sh -e") "$bp_dir/$bp_id.sh" || bp_rc=$?

        kill $bp_watch 2>/dev/null; exit $bp_rc

        '
      shell: sh
    - name: Build sdist
      uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
      with:
        sccache: false
        maturin-version: v1.15.0
        command: sdist
        args: --out dist
    - name: Fix Cargo.lock in sdist
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        # Ensure maturin did not update the workspace Cargo.lock.

        git diff --exit-code -- Cargo.lock

        python scripts/repair-sdist-cargo-lock.py dist/${PACKAGE_NAME}-*.tar.gz

        BUILDPROF_SCRIPT_EOF

        ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

        bp_rc=0

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Fix-Cargo-lock-in-sdist.buildprof" -- $(command -v bash >/dev/null && echo "bash --noprofile --norc -eo pipefail" || echo "sh -e") "$bp_dir/$bp_id.sh" || bp_rc=$?

        kill $bp_watch 2>/dev/null; exit $bp_rc

        '
      shell: sh
    - name: Test sdist
      uses: astral-sh/github-actions/release-smoke-test@76d2758fc5c4394ada46510f46605deb7cec477e
      with:
        image: python:3.11-bookworm@sha256:35d3a4a3d5e42e02ab916d44513a050689f12c0533d45598d229672503fe77ca
        artifacts: dist
        rust-toolchain: rust-toolchain.toml
        run: 'apt-get update

          apt-get install -y --no-install-recommends cmake

          # We can''t use `--find-links` here, since we need maturin, which means no `--no-index`, and without that option

          # we run the risk that pip pull uv from PyPI instead.

          pip install /dist/${PACKAGE_NAME}-*.tar.gz --force-reinstall --config-settings=maturin.build-args=--locked

          ${MODULE_NAME} --help

          python -m ${MODULE_NAME} --help

          uvx --help

          '
    - name: Upload sdist
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: build-sdist-uv
        path: dist
    - name: Build sdist uv-build
      uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
      with:
        sccache: false
        maturin-version: v1.15.0
        command: sdist
        args: --out crates/uv-build/dist -m crates/uv-build/Cargo.toml
    - name: Fix Cargo.lock in sdist uv-build
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        # Ensure maturin did not update the workspace Cargo.lock.

        git diff --exit-code -- Cargo.lock

        python scripts/repair-sdist-cargo-lock.py crates/uv-build/dist/${PACKAGE_NAME}_build-*.tar.gz

        BUILDPROF_SCRIPT_EOF

        ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

        bp_rc=0

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Fix-Cargo-lock-in-sdist-uv-build.buildprof" -- $(command -v bash >/dev/null && echo "bash --noprofile --norc -eo pipefail" || echo "sh -e") "$bp_dir/$bp_id.sh" || bp_rc=$?

        kill $bp_watch 2>/dev/null; exit $bp_rc

        '
      shell: sh
    - name: Test sdist uv-build
      uses: astral-sh/github-actions/release-smoke-test@76d2758fc5c4394ada46510f46605deb7cec477e
      with:
        image: python:3.11-bookworm@sha256:35d3a4a3d5e42e02ab916d44513a050689f12c0533d45598d229672503fe77ca
        artifacts: crates/uv-build/dist
        rust-toolchain: crates/uv-build/rust-toolchain.toml
        run: 'apt-get update

          apt-get install -y --no-install-recommends cmake

          pip install /dist/${PACKAGE_NAME}_build-*.tar.gz --force-reinstall --config-settings=maturin.build-args=--locked

          ${MODULE_NAME}-build --help

          python -m ${MODULE_NAME}_build --help

          '
    - name: Upload sdist uv-build
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: build-sdist-uv_build
        path: crates/uv-build/dist
    - name: Upload buildprof recordings
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: uv--build-release-binaries-sdist-${{ strategy.job-index }}
        path: ${{ runner.temp }}/buildprof/*.buildprof
        retention-days: 30
        if-no-files-found: ignore
        compression-level: 0
    permissions:
      contents: read
    timeout-minutes: 120
  linux:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
        - target: i686-unknown-linux-gnu
          cc: gcc -m32
        - target: x86_64-unknown-linux-gnu
          cc: gcc
    steps:
    - name: Fetch buildprof
      uses: actions/checkout@v4
      with:
        repository: LalitMaganti/buildprof-ci-survey
        path: .buildprof-fetch
        sparse-checkout: '.buildprof

          projects/uv'
        persist-credentials: false
    - name: Install buildprof
      shell: sh
      working-directory: ${{ github.workspace }}
      run: 'mkdir -p "$RUNNER_TEMP/buildprof-bin" "$RUNNER_TEMP/buildprof-actions"

        cp .buildprof-fetch/.buildprof/buildprof-* "$RUNNER_TEMP/buildprof-bin/" && chmod +x "$RUNNER_TEMP/buildprof-bin/"*

        if [ "$(id -u)" != 0 ] && sudo -n true 2>/dev/null; then sudo setcap cap_sys_ptrace,cap_sys_admin+ep "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)"; fi

        if [ -d .buildprof-fetch/projects/uv/actions ]; then cp -r .buildprof-fetch/projects/uv/actions/. "$RUNNER_TEMP/buildprof-actions/"; fi

        rm -rf .buildprof-fetch

        '
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        repository: astral-sh/uv
        ref: 5477928f71f0634db593a8a10a8012044fe02349
    - name: Wrap upstream composite actions
      shell: sh
      working-directory: ${{ github.workspace }}
      run: 'if [ -n "$(ls -A "$RUNNER_TEMP/buildprof-actions" 2>/dev/null)" ]; then cp -r "$RUNNER_TEMP/buildprof-actions/." "./.github/actions/"; fi

        '
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        cache: ''
        python-version: ${{ env.PYTHON_VERSION }}
        architecture: x64
    - name: Prep README.md
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        python scripts/transform_readme.py --target pypi

        BUILDPROF_SCRIPT_EOF

        ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

        bp_rc=0

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Prep-README-md.buildprof" -- $(command -v bash >/dev/null && echo "bash --noprofile --norc -eo pipefail" || echo "sh -e") "$bp_dir/$bp_id.sh" || bp_rc=$?

        kill $bp_watch 2>/dev/null; exit $bp_rc

        '
      shell: sh
    - name: Build wheels
      uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
      with:
        sccache: false
        maturin-version: v1.15.0
        target: ${{ matrix.target }}
        container: quay.io/pypa/manylinux2014
        manylinux: 217
        docker-options: -e CARGO -e AWS_LC_SYS_USE_SYSTEM
        args: --release --locked --out dist --features self-update --compatibility pypi
        before-script-linux: "# Install the 32-bit cross target on 64-bit (noop if we're already on 64-bit)\nrustup target add ${{ matrix.target }}\n# If we're running on rhel centos, install needed packages.\nif command -v yum &> /dev/null; then\n    yum update -y && yum install -y pkgconfig libatomic\n\n    # Install cross build requirements\n    if [[ \"${{ matrix.target }}\" == \"i686-unknown-linux-gnu\" ]]; then\n      yum install -y glibc-devel.i686 libstdc++-devel.i686 libatomic.i686\n    fi\n\n    # Symlink libatomic so the linker can find it with -latomic.\n    if [[ -f \"/usr/lib/libatomic.so.1\" && ! -f \"/usr/lib/libatomic.so\" ]]; then\n        ln -s /usr/lib/libatomic.so.1 /usr/lib/libatomic.so\n    fi\nelse\n    # If we're running on debian-based system.\n    apt update -y && apt-get install -y pkg-config\nfi\n# Install cargo extensions as a static musl binary so it runs in any container.\nscripts/install-cargo-extensions.sh\n\n# Keep package/version/file information in diagnostics without embedding\n# the build machine's Cargo home and registry index directory in every path.\n# TODO: Use Cargo's profile-level `trim-paths` once it is stable.\ncargo fetch --locked --target \"${{ matrix.target }}\"\nfor registry in \"${CARGO_HOME:-$HOME/.cargo}\"/registry/src/*; do\n    [[ -d \"$registry\" ]] || continue\n    export RUSTFLAGS=\"${RUSTFLAGS:+${RUSTFLAGS} }--remap-path-prefix=$registry/=registry/\"\ndone\n\nif [[ \"${{ matrix.target }}\" == \"x86_64-unknown-linux-gnu\" ]]; then\n    rustup component add llvm-tools-preview\n    python${{ env.PYTHON_VERSION }} scripts/build_uv_pgo.py \\\n        --target \"${{ matrix.target }}\" \\\n        --target-dir \"$PWD/target/uv-pgo\" \\\n        --train-only\n\n    export RUSTFLAGS=\"${RUSTFLAGS:+${RUSTFLAGS} }-Cprofile-use=$PWD/target/uv-pgo/uv.profdata\"\nfi\n"
      env:
        CC: ${{ matrix.cc }}
        CARGO: ${{ github.workspace }}/scripts/cargo.sh
    - name: Test wheel
      if: ${{ startsWith(matrix.target, 'x86_64') }}
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        pip install ${PACKAGE_NAME} --no-index --find-links dist/ --force-reinstall

        ${MODULE_NAME} --help

        python -m ${MODULE_NAME} --help

        uvx --help

        BUILDPROF_SCRIPT_EOF

        ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

        bp_rc=0

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Test-wheel.buildprof" -- $(command -v bash >/dev/null && echo "bash --noprofile --norc -eo pipefail" || echo "sh -e") "$bp_dir/$bp_id.sh" || bp_rc=$?

        kill $bp_watch 2>/dev/null; exit $bp_rc

        '
      shell: sh
    - name: Upload wheels
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: build-wheels-uv-${{ matrix.target }}
        path: dist
    - name: Archive binary
      shell: sh
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        ARCHIVE_NAME=uv-$TARGET

        ARCHIVE_FILE=$ARCHIVE_NAME.tar.gz


        mkdir -p $ARCHIVE_NAME

        cp target/$TARGET/release/uv $ARCHIVE_NAME/uv

        cp target/$TARGET/release/uvx $ARCHIVE_NAME/uvx

        tar czvf $ARCHIVE_FILE $ARCHIVE_NAME

        shasum -a 256 $ARCHIVE_FILE > $ARCHIVE_FILE.sha256

        BUILDPROF_SCRIPT_EOF

        ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

        bp_rc=0

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Archive-binary.buildprof" -- bash --noprofile --norc -eo pipefail "$bp_dir/$bp_id.sh" || bp_rc=$?

        kill $bp_watch 2>/dev/null; exit $bp_rc

        '
      env:
        TARGET: ${{ matrix.target }}
    - name: Upload binary
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: build-github-archives-${{ matrix.target }}
        path: '*.tar.gz

          *.sha256

          '
    - name: Build wheels uv-build
      uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
      with:
        sccache: false
        maturin-version: v1.15.0
        target: ${{ matrix.target }}
        manylinux: 217
        docker-options: -e CARGO -e AWS_LC_SYS_USE_SYSTEM
        args: --profile minimal-size --locked --out crates/uv-build/dist -m crates/uv-build/Cargo.toml --compatibility pypi
        before-script-linux: "scripts/install-cargo-extensions.sh\n\n# TODO: Use Cargo's profile-level `trim-paths` once it is stable.\ncargo fetch --locked --target \"${{ matrix.target }}\"\nfor registry in \"${CARGO_HOME:-$HOME/.cargo}\"/registry/src/*; do\n    [[ -d \"$registry\" ]] || continue\n    export RUSTFLAGS=\"${RUSTFLAGS:+${RUSTFLAGS} }--remap-path-prefix=$registry/=registry/\"\ndone\n\nif [[ \"${{ matrix.target }}\" == \"x86_64-unknown-linux-gnu\" ]]; then\n    # Fold identical functions with Rust's bundled LLD.\n    bundled_lld_dir=\"$(rustc --print sysroot)/lib/rustlib/${{ matrix.target }}/bin/gcc-ld\"\n    test -x \"${bundled_lld_dir}/ld.lld\"\n    export RUSTFLAGS=\"${RUSTFLAGS:+${RUSTFLAGS} }-C link-arg=-B${bundled_lld_dir} -C link-arg=-fuse-ld=lld -C link-arg=-Wl,--icf=all\"\nfi\n"
      env:
        CARGO: ${{ github.workspace }}/scripts/cargo.sh
    - name: Test wheel uv-build
      if: ${{ startsWith(matrix.target, 'x86_64') }}
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        pip install ${PACKAGE_NAME}_build --no-index --find-links crates/uv-build/dist --force-reinstall

        ${MODULE_NAME}-build --help

        python -m ${MODULE_NAME}_build --help

        BUILDPROF_SCRIPT_EOF

        ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

        bp_rc=0

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Test-wheel-uv-build.buildprof" -- $(command -v bash >/dev/null && echo "bash --noprofile --norc -eo pipefail" || echo "sh -e") "$bp_dir/$bp_id.sh" || bp_rc=$?

        kill $bp_watch 2>/dev/null; exit $bp_rc

        '
      shell: sh
    - name: Upload wheels uv-build
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: build-wheels-uv_build-${{ matrix.target }}
        path: crates/uv-build/dist
    - name: Upload buildprof recordings
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: uv--build-release-binaries-linux-${{ strategy.job-index }}
        path: ${{ runner.temp }}/buildprof/*.buildprof
        retention-days: 30
        if-no-files-found: ignore
        compression-level: 0
    permissions:
      contents: read
    timeout-minutes: 120
  linux-arm:
    name: ${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 120
    strategy:
      matrix:
        platform:
        - target: aarch64-unknown-linux-gnu
          arch: aarch64
          test_image: arm64v8/ubuntu:20.04@sha256:0908a765aeb02fe4e564b543eaed1d77839b7a08de94041e24328b2cb62ac553
          test_platform: linux/arm64
          runner: ubuntu-24.04-arm
          pgo: true
          maturin_docker_options: -e JEMALLOC_SYS_WITH_LG_PAGE=16
          manylinux: 228
        - target: armv7-unknown-linux-gnueabihf
          arch: armv7
          test_image: arm32v7/ubuntu:20.04@sha256:d9a6ab6baaf86907ea1d46f0cbc87547920077c9c6017721faed6eeb51e9aa7e
          test_platform: linux/arm/v7
          runner: ubuntu-24.04
          pgo: false
          manylinux: 217
        - target: arm-unknown-linux-musleabihf
          arch: arm
          test_image: balenalib/rpi-raspbian:bullseye@sha256:851cfc48b26f6413a72a7f6873a7624ba2a427048976f6ab4483f72fe165d4f1
          test_platform: linux/arm/v6
          runner: ubuntu-24.04
          pgo: false
          manylinux: auto
    steps:
    - name: Fetch buildprof
      uses: actions/checkout@v4
      with:
        repository: LalitMaganti/buildprof-ci-survey
        path: .buildprof-fetch
        sparse-checkout: '.buildprof

          projects/uv'
        persist-credentials: false
    - name: Install buildprof
      shell: sh
      working-directory: ${{ github.workspace }}
      run: 'mkdir -p "$RUNNER_TEMP/buildprof-bin" "$RUNNER_TEMP/buildprof-actions"

        cp .buildprof-fetch/.buildprof/buildprof-* "$RUNNER_TEMP/buildprof-bin/" && chmod +x "$RUNNER_TEMP/buildprof-bin/"*

        if [ "$(id -u)" != 0 ] && sudo -n true 2>/dev/null; then sudo setcap cap_sys_ptrace,cap_sys_admin+ep "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)"; fi

        if [ -d .buildprof-fetch/projects/uv/actions ]; then cp -r .buildprof-fetch/projects/uv/actions/. "$RUNNER_TEMP/buildprof-actions/"; fi

        rm -rf .buildprof-fetch

        '
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        repository: astral-sh/uv
        ref: 5477928f71f0634db593a8a10a8012044fe02349
    - name: Wrap upstream composite actions
      shell: sh
      working-directory: ${{ github.workspace }}
      run: 'if [ -n "$(ls -A "$RUNNER_TEMP/buildprof-actions" 2>/dev/null)" ]; then cp -r "$RUNNER_TEMP/buildprof-actions/." "./.github/actions/"; fi

        '
