        rust-toolchain: ${{ matrix.platform.toolchain || null }}
        before-script-linux: 'scripts/install-cargo-extensions.sh

          '
      env:
        CARGO: ${{ github.workspace }}/scripts/cargo.sh
    - name: Test wheel
      uses: astral-sh/github-actions/release-smoke-test@76d2758fc5c4394ada46510f46605deb7cec477e
      with:
        image: ${{ matrix.platform.test_image }}
        platform: ${{ matrix.platform.test_platform }}
        artifacts: crates/uv-build/dist
        run: 'apk add python3

          python -m venv .venv

          .venv/bin/pip install ${PACKAGE_NAME}-build --no-index --find-links /dist --force-reinstall

          .venv/bin/${MODULE_NAME}-build --help

          # TODO(konsti): Enable this test on all platforms, currently `find_uv_bin` is failing to discover uv here.

          # .venv/bin/python -m ${MODULE_NAME}_build --help

          '
    - name: Test wheel (manylinux)
      uses: astral-sh/github-actions/release-smoke-test@76d2758fc5c4394ada46510f46605deb7cec477e
      if: matrix.platform.arch == 'aarch64'
      with:
        image: arm64v8/ubuntu:20.04@sha256:0908a765aeb02fe4e564b543eaed1d77839b7a08de94041e24328b2cb62ac553
        platform: linux/arm64
        artifacts: crates/uv-build/dist
        run: 'apt-get update

          apt-get install -y --no-install-recommends python3 python3-pip python-is-python3

          pip3 install --upgrade --require-hashes -r /pip-requirements.txt

          pip install ${PACKAGE_NAME}-build --no-index --find-links /dist --force-reinstall

          ${MODULE_NAME}-build --help

          # TODO(konsti): Enable this test on all platforms, currently `find_uv_bin` is failing to discover uv here.

          # python -m ${MODULE_NAME}_build --help

          '
    - name: Upload wheels
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: build-wheels-uv_build-${{ matrix.platform.target }}
        path: crates/uv-build/dist
    - name: Upload buildprof recordings
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: uv--build-release-binaries-musllinux-cross-${{ strategy.job-index }}
        path: ${{ runner.temp }}/buildprof/*.buildprof
        retention-days: 30
        if-no-files-found: ignore
        compression-level: 0
    permissions:
      contents: read
    timeout-minutes: 120
