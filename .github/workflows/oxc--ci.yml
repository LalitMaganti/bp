name: 'oxc: CI'
'on':
  workflow_dispatch: null
permissions:
  contents: read
env:
  INSTA_REQUIRE_FULL_MATCH: 1
jobs:
  test-ubuntu-aarch64:
    if: ${{ 'main' == 'main' }}
    name: Test Linux ARM64
    runs-on: ubuntu-24.04-arm
    steps:
    - name: Fetch buildprof
      uses: actions/checkout@v4
      with:
        repository: LalitMaganti/bp
        path: .buildprof-fetch
        sparse-checkout: '.buildprof

          projects/oxc'
        persist-credentials: false
    - name: Install buildprof
      shell: sh
      working-directory: ${{ github.workspace }}
      run: 'mkdir -p "$RUNNER_TEMP/buildprof-bin" "$RUNNER_TEMP/buildprof-actions"

        cp .buildprof-fetch/.buildprof/buildprof-* "$RUNNER_TEMP/buildprof-bin/" && chmod +x "$RUNNER_TEMP/buildprof-bin/"*

        if [ "$(id -u)" != 0 ] && sudo -n true 2>/dev/null; then sudo setcap cap_sys_ptrace,cap_sys_admin+ep "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)"; fi

        if [ -d .buildprof-fetch/projects/oxc/actions ]; then cp -r .buildprof-fetch/projects/oxc/actions/. "$RUNNER_TEMP/buildprof-actions/"; fi

        rm -rf .buildprof-fetch

        '
    - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b
    - parallel:
      - uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c
      - uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12
        with:
          save-cache: ${{ 'main' == 'main' }}
          cache-key: warm-aarch64
    - run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        cargo ck

        BUILDPROF_SCRIPT_EOF

        ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

        bp_rc=0

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-cargo-ck.buildprof" -- $(command -v bash >/dev/null && echo "bash --noprofile --norc -eo pipefail" || echo "sh -e") "$bp_dir/$bp_id.sh" || bp_rc=$?

        kill $bp_watch 2>/dev/null; exit $bp_rc

        '
      shell: sh
    - run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        cargo test --all-features

        BUILDPROF_SCRIPT_EOF

        ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

        bp_rc=0

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-cargo-test-all-features.buildprof" -- $(command -v bash >/dev/null && echo "bash --noprofile --norc -eo pipefail" || echo "sh -e") "$bp_dir/$bp_id.sh" || bp_rc=$?

        kill $bp_watch 2>/dev/null; exit $bp_rc

        '
      shell: sh
    - run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        git diff --exit-code

        BUILDPROF_SCRIPT_EOF

        ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

        bp_rc=0

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-git-diff-exit-code.buildprof" -- $(command -v bash >/dev/null && echo "bash --noprofile --norc -eo pipefail" || echo "sh -e") "$bp_dir/$bp_id.sh" || bp_rc=$?

        kill $bp_watch 2>/dev/null; exit $bp_rc

        '
      shell: sh
    - name: Upload buildprof recordings
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: oxc--ci-test-ubuntu-aarch64-${{ strategy.job-index }}
        path: ${{ runner.temp }}/buildprof/*.buildprof
        retention-days: 30
        if-no-files-found: ignore
        compression-level: 0
    permissions:
      contents: read
    timeout-minutes: 120
  typos:
    name: Spell Check
    runs-on: ubuntu-slim
    steps:
    - name: Fetch buildprof
      uses: actions/checkout@v4
      with:
        repository: LalitMaganti/bp
        path: .buildprof-fetch
        sparse-checkout: '.buildprof

          projects/oxc'
        persist-credentials: false
    - name: Install buildprof
      shell: sh
      working-directory: ${{ github.workspace }}
      run: 'mkdir -p "$RUNNER_TEMP/buildprof-bin" "$RUNNER_TEMP/buildprof-actions"

        cp .buildprof-fetch/.buildprof/buildprof-* "$RUNNER_TEMP/buildprof-bin/" && chmod +x "$RUNNER_TEMP/buildprof-bin/"*

        if [ "$(id -u)" != 0 ] && sudo -n true 2>/dev/null; then sudo setcap cap_sys_ptrace,cap_sys_admin+ep "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)"; fi

        if [ -d .buildprof-fetch/projects/oxc/actions ]; then cp -r .buildprof-fetch/projects/oxc/actions/. "$RUNNER_TEMP/buildprof-actions/"; fi

        rm -rf .buildprof-fetch

        '
    - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b
    - uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b
      with:
        files: .
    - name: Upload buildprof recordings
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: oxc--ci-typos-${{ strategy.job-index }}
        path: ${{ runner.temp }}/buildprof/*.buildprof
        retention-days: 30
        if-no-files-found: ignore
        compression-level: 0
    permissions:
      contents: read
    timeout-minutes: 120
  lexer:
    name: Lexer (${{ matrix.variant }})
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_BUILD_WARNINGS: deny
    strategy:
      fail-fast: false
      matrix:
        include:
        - variant: Neon
          runner: ubuntu-24.04-arm
          suffix: ''
    steps:
    - name: Fetch buildprof
      uses: actions/checkout@v4
      with:
        repository: LalitMaganti/bp
        path: .buildprof-fetch
        sparse-checkout: '.buildprof

          projects/oxc'
        persist-credentials: false
    - name: Install buildprof
      shell: sh
      working-directory: ${{ github.workspace }}
      run: 'mkdir -p "$RUNNER_TEMP/buildprof-bin" "$RUNNER_TEMP/buildprof-actions"

        cp .buildprof-fetch/.buildprof/buildprof-* "$RUNNER_TEMP/buildprof-bin/" && chmod +x "$RUNNER_TEMP/buildprof-bin/"*

        if [ "$(id -u)" != 0 ] && sudo -n true 2>/dev/null; then sudo setcap cap_sys_ptrace,cap_sys_admin+ep "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)"; fi

        if [ -d .buildprof-fetch/projects/oxc/actions ]; then cp -r .buildprof-fetch/projects/oxc/actions/. "$RUNNER_TEMP/buildprof-actions/"; fi

        rm -rf .buildprof-fetch

        '
    - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b
    - name: Check if lexer checks should run
      id: filter
      uses: ./.github/actions/check-changes
      with:
        packages: oxc_lexer,oxc_coverage
        paths: crates/oxc_lexer/,tasks/coverage/,.cargo/lexer-avx2.toml,justfile,.github/workflows/ci.yml
        token: ${{ secrets.GITHUB_TOKEN }}
        pr-number: ${{ github.event.pull_request.number }}
    - uses: ./.github/actions/clone-submodules
      id: lexer-fixtures
      if: steps.filter.outputs.changed == 'true'
      with:
        node-compat-table: false
      background: true
    - uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9
      if: ${{ steps.filter.outputs.changed == 'true' && matrix.variant != 'Neon' }}
      with:
        path: /home/runner/.rustup
        cache: rust
    - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad
      if: ${{ steps.filter.outputs.changed == 'true' && matrix.variant != 'Neon' }}
      with:
        tool: just
    - run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        rustup component add clippy

        BUILDPROF_SCRIPT_EOF

        ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

        bp_rc=0

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-rustup-component-add-clippy.buildprof" -- $(command -v bash >/dev/null && echo "bash --noprofile --norc -eo pipefail" || echo "sh -e") "$bp_dir/$bp_id.sh" || bp_rc=$?

        kill $bp_watch 2>/dev/null; exit $bp_rc

        '
      if: ${{ steps.filter.outputs.changed == 'true' && matrix.variant == 'AVX2' }}
      shell: sh
    - uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12
      if: ${{ steps.filter.outputs.changed == 'true' && matrix.variant == 'Neon' }}
      with:
        save-cache: ${{ 'main' == 'main' }}
        cache-key: lexer-aarch64
        tools: just
        components: clippy
    - name: Lint
      if: ${{ steps.filter.outputs.changed == 'true' && matrix.variant != 'generic' }}
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        just lint-lexer${{ matrix.suffix }}

        BUILDPROF_SCRIPT_EOF

        ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

        bp_rc=0

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Lint.buildprof" -- $(command -v bash >/dev/null && echo "bash --noprofile --norc -eo pipefail" || echo "sh -e") "$bp_dir/$bp_id.sh" || bp_rc=$?

        kill $bp_watch 2>/dev/null; exit $bp_rc

        '
      shell: sh
    - name: Test
      if: ${{ steps.filter.outputs.changed == 'true' && matrix.variant != 'generic' }}
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        just test-lexer${{ matrix.suffix }}

        BUILDPROF_SCRIPT_EOF

        ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

        bp_rc=0

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Test.buildprof" -- $(command -v bash >/dev/null && echo "bash --noprofile --norc -eo pipefail" || echo "sh -e") "$bp_dir/$bp_id.sh" || bp_rc=$?

        kill $bp_watch 2>/dev/null; exit $bp_rc

        '
      shell: sh
    - wait: lexer-fixtures
    - name: Conformance
      if: steps.filter.outputs.changed == 'true'
      run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\nset -o pipefail\njust conformance-lexer${{ matrix.suffix }} | tee \"$RUNNER_TEMP/lexer.log\"\ngrep -qxF \"Lexer implementation: ${{ matrix.variant }}\" \"$RUNNER_TEMP/lexer.log\" ||\n  { echo \"::error::Expected ${{ matrix.variant }}, but the harness reported otherwise\"; exit 1; }\ngit diff --exit-code\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Conformance.buildprof\" -- $(command -v bash >/dev/null && echo \"bash --noprofile --norc -eo pipefail\" || echo \"sh -e\") \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
      shell: sh
    - name: Upload buildprof recordings
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: oxc--ci-lexer-${{ strategy.job-index }}
        path: ${{ runner.temp }}/buildprof/*.buildprof
        retention-days: 30
        if-no-files-found: ignore
        compression-level: 0
    permissions:
      contents: read
    timeout-minutes: 120
