name: 'ruff: CI'
'on':
  workflow_dispatch: null
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  UV_LOCKED: 1
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_PROFILE_DEV_LTO: 'false'
  CARGO_PROFILE_DEV_OPT_LEVEL: 0
  CARGO_TERM_COLOR: always
  HAWK_VERSION: 0.1.15
  RUSTUP_MAX_RETRIES: 10
  PACKAGE_NAME: ruff
  PYTHON_VERSION: '3.14'
  NEXTEST_PROFILE: ci
  MDTEST_EXTERNAL: '1'
jobs:
  determine_changes:
    name: Determine changes
    if: ${{ 'astral-sh/ruff' != 'astral-sh/ruff-security' || 'refs/heads/main' != 'refs/heads/main' }}
    runs-on: ${{ 'astral-sh/ruff' == 'astral-sh/ruff' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    outputs:
      comparison_base: ${{ steps.merge_base.outputs.sha }}
      parser: ${{ steps.check_parser.outputs.changed }}
      linter: ${{ steps.check_linter.outputs.changed }}
      formatter: ${{ steps.check_formatter.outputs.changed }}
      code: ${{ steps.check_code.outputs.changed }}
      fuzz: ${{ steps.check_fuzzer.outputs.changed }}
      ty: ${{ steps.check_ty.outputs.changed }}
      py-fuzzer: ${{ steps.check_py_fuzzer.outputs.changed }}
      playground: ${{ steps.check_playground.outputs.changed }}
      benchmarks: ${{ steps.check_benchmarks.outputs.changed }}
      release: ${{ steps.check_release.outputs.changed }}
    steps:
    - name: Fetch buildprof
      uses: actions/checkout@v4
      with:
        repository: LalitMaganti/buildprof-ci-survey
        path: .buildprof-fetch
        sparse-checkout: '.buildprof

          projects/ruff'
        persist-credentials: false
    - name: Install buildprof
      shell: sh
      run: 'mkdir -p "$RUNNER_TEMP/buildprof-bin" "$RUNNER_TEMP/buildprof-actions"

        cp .buildprof-fetch/.buildprof/buildprof-* "$RUNNER_TEMP/buildprof-bin/" && chmod +x "$RUNNER_TEMP/buildprof-bin/"*

        if [ "$(id -u)" != 0 ] && sudo -n true 2>/dev/null; then sudo setcap cap_sys_ptrace,cap_sys_admin+ep "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)"; fi

        if [ -d .buildprof-fetch/projects/ruff/actions ]; then cp -r .buildprof-fetch/projects/ruff/actions/. "$RUNNER_TEMP/buildprof-actions/"; fi

        rm -rf .buildprof-fetch

        '
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        repository: astral-sh/ruff
        ref: 2c6359372bb5893bd01aa34f78950055803cafac
    - name: Wrap upstream composite actions
      shell: sh
      run: 'if [ -n "$(ls -A "$RUNNER_TEMP/buildprof-actions" 2>/dev/null)" ]; then cp -r "$RUNNER_TEMP/buildprof-actions/." "./.github/actions/"; fi

        '
    - name: Fetch full history without tags
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        gh auth setup-git

        git fetch --no-tags --filter=blob:none --unshallow origin

        BUILDPROF_SCRIPT_EOF

        ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

        bp_rc=0

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Fetch-full-history-without-tags.buildprof" -- bash --noprofile --norc -eo pipefail "$bp_dir/$bp_id.sh" || bp_rc=$?

        kill $bp_watch 2>/dev/null; exit $bp_rc

        '
      shell: sh
    - name: Determine merge base
      id: merge_base
      env:
        BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
      run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\nif [[ \"$GITHUB_EVENT_NAME\" == \"pull_request\" ]]; then\n  # The first parent contains any preceding layers in a stacked pull request.\n  sha=\"$(git rev-parse \"${GITHUB_SHA}^1\")\"\nelse\n  sha=\"$(git merge-base HEAD \"origin/${BASE_REF}\")\"\nfi\necho \"sha=${sha}\" >> \"$GITHUB_OUTPUT\"\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Determine-merge-base.buildprof\" -- bash --noprofile --norc -eo pipefail \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
      shell: sh
    - name: Check if release build inputs changed
      id: check_release
      env:
        MERGE_BASE: ${{ steps.merge_base.outputs.sha }}
      run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\nif git diff --quiet \"${MERGE_BASE}...HEAD\" -- \\\n  ':pyproject.toml' \\\n  ':.github/workflows/build-binaries.yml' \\\n  ':scripts/build_ruff_pgo.py' \\\n; then\n    echo \"changed=false\" >> \"$GITHUB_OUTPUT\"\nelse\n    echo \"changed=true\" >> \"$GITHUB_OUTPUT\"\nfi\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Check-if-release-build-inputs-changed.buildprof\" -- bash --noprofile --norc -eo pipefail \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
      shell: sh
    - name: Check if the parser code changed
      id: check_parser
      env:
        MERGE_BASE: ${{ steps.merge_base.outputs.sha }}
      run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\nif git diff --quiet \"${MERGE_BASE}...HEAD\" -- \\\n  ':Cargo.toml' \\\n  ':Cargo.lock' \\\n  ':rust-toolchain.toml' \\\n  ':cargo/config.toml' \\\n  ':crates/ruff_python_trivia/**' \\\n  ':crates/ruff_source_file/**' \\\n  ':crates/ruff_text_size/**' \\\n  ':crates/ruff_python_ast/**' \\\n  ':crates/ruff_python_parser/**' \\\n  ':.github/workflows/ci.yaml' \\\n; then\n    echo \"changed=false\" >> \"$GITHUB_OUTPUT\"\nelse\n    echo \"changed=true\" >> \"$GITHUB_OUTPUT\"\nfi\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Check-if-the-parser-code-changed.buildprof\" -- bash --noprofile --norc -eo pipefail \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
      shell: sh
    - name: Check if the linter code changed
      id: check_linter
      env:
        MERGE_BASE: ${{ steps.merge_base.outputs.sha }}
      run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\nif git diff --quiet \"${MERGE_BASE}...HEAD\" -- ':Cargo.toml' \\\n  ':Cargo.lock' \\\n  ':rust-toolchain.toml' \\\n  ':cargo/config.toml' \\\n  ':crates/**' \\\n  ':!crates/ty*/**' \\\n  ':!crates/ruff_python_formatter/**' \\\n  ':!crates/ruff_formatter/**' \\\n  ':!crates/ruff_dev/**' \\\n  ':!crates/ruff_benchmark/**' \\\n  ':scripts/*' \\\n  ':python/**' \\\n  ':.github/workflows/ci.yaml' \\\n; then\n    echo \"changed=false\" >> \"$GITHUB_OUTPUT\"\nelse\n    echo \"changed=true\" >> \"$GITHUB_OUTPUT\"\nfi\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Check-if-the-linter-code-changed.buildprof\" -- bash --noprofile --norc -eo pipefail \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
      shell: sh
    - name: Check if the formatter code changed
      id: check_formatter
      env:
        MERGE_BASE: ${{ steps.merge_base.outputs.sha }}
      run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\nif git diff --quiet \"${MERGE_BASE}...HEAD\" -- ':Cargo.toml' \\\n  ':Cargo.lock' \\\n  ':rust-toolchain.toml' \\\n  ':cargo/config.toml' \\\n  ':crates/ruff_python_formatter/**' \\\n  ':crates/ruff_formatter/**' \\\n  ':crates/ruff_python_trivia/**' \\\n  ':crates/ruff_python_ast/**' \\\n  ':crates/ruff_source_file/**' \\\n  ':crates/ruff_python_index/**' \\\n  ':crates/ruff_python_index/**' \\\n  ':crates/ruff_text_size/**' \\\n  ':crates/ruff_python_parser/**' \\\n  ':scripts/*' \\\n  ':python/**' \\\n  ':.github/workflows/ci.yaml' \\\n; then\n    echo \"changed=false\" >> \"$GITHUB_OUTPUT\"\nelse\n    echo \"changed=true\" >> \"$GITHUB_OUTPUT\"\nfi\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Check-if-the-formatter-code-changed.buildprof\" -- bash --noprofile --norc -eo pipefail \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
      shell: sh
    - name: Check if the fuzzer code changed
      id: check_fuzzer
      env:
        MERGE_BASE: ${{ steps.merge_base.outputs.sha }}
      run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\nif git diff --quiet \"${MERGE_BASE}...HEAD\" -- ':Cargo.toml' \\\n  ':Cargo.lock' \\\n  ':rust-toolchain.toml' \\\n  ':cargo/config.toml' \\\n  ':fuzz/fuzz_targets/**' \\\n  ':.github/workflows/ci.yaml' \\\n; then\n    echo \"changed=false\" >> \"$GITHUB_OUTPUT\"\nelse\n    echo \"changed=true\" >> \"$GITHUB_OUTPUT\"\nfi\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Check-if-the-fuzzer-code-changed.buildprof\" -- bash --noprofile --norc -eo pipefail \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
      shell: sh
    - name: Check if the py-fuzzer code changed
      id: check_py_fuzzer
      env:
        MERGE_BASE: ${{ steps.merge_base.outputs.sha }}
      run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\nif git diff --quiet \"${MERGE_BASE}...HEAD\" -- 'python/py-fuzzer/**' \\\n; then\n    echo \"changed=false\" >> \"$GITHUB_OUTPUT\"\nelse\n    echo \"changed=true\" >> \"$GITHUB_OUTPUT\"\nfi\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Check-if-the-py-fuzzer-code-changed.buildprof\" -- bash --noprofile --norc -eo pipefail \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
      shell: sh
    - name: Check if there was any code related change
      id: check_code
      env:
        MERGE_BASE: ${{ steps.merge_base.outputs.sha }}
      run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\n# NOTE: Do not exclude all Markdown files here, but rather use\n# specific exclude patterns like 'docs/**'), because tests for\n# 'ty' are written in Markdown.\nif git diff --quiet \"${MERGE_BASE}...HEAD\" -- \\\n  ':!docs/**' \\\n  ':!assets/**' \\\n; then\n    echo \"changed=false\" >> \"$GITHUB_OUTPUT\"\nelse\n    echo \"changed=true\" >> \"$GITHUB_OUTPUT\"\nfi\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Check-if-there-was-any-code-related-chan.buildprof\" -- bash --noprofile --norc -eo pipefail \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
      shell: sh
    - name: Check if there was any playground related change
      id: check_playground
      env:
        MERGE_BASE: ${{ steps.merge_base.outputs.sha }}
      run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\nif git diff --quiet \"${MERGE_BASE}...HEAD\" -- \\\n  ':playground/**' \\\n; then\n    echo \"changed=false\" >> \"$GITHUB_OUTPUT\"\nelse\n    echo \"changed=true\" >> \"$GITHUB_OUTPUT\"\nfi\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Check-if-there-was-any-playground-relate.buildprof\" -- bash --noprofile --norc -eo pipefail \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
      shell: sh
    - name: Check if the ty code changed
      id: check_ty
      env:
        MERGE_BASE: ${{ steps.merge_base.outputs.sha }}
      run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\nif git diff --quiet \"${MERGE_BASE}...HEAD\" -- \\\n  ':Cargo.toml' \\\n  ':Cargo.lock' \\\n  ':rust-toolchain.toml' \\\n  ':cargo/config.toml' \\\n  ':crates/ty*/**' \\\n  ':crates/ruff_db/**' \\\n  ':crates/ruff_annotate_snippets/**' \\\n  ':crates/ruff_python_ast/**' \\\n  ':crates/ruff_python_edits/**' \\\n  ':crates/ruff_python_parser/**' \\\n  ':crates/ruff_python_trivia/**' \\\n  ':crates/ruff_source_file/**' \\\n  ':crates/ruff_text_size/**' \\\n  ':.github/workflows/ci.yaml' \\\n; then\n    echo \"changed=false\" >> \"$GITHUB_OUTPUT\"\nelse\n    echo \"changed=true\" >> \"$GITHUB_OUTPUT\"\nfi\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Check-if-the-ty-code-changed.buildprof\" -- bash --noprofile --norc -eo pipefail \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
      shell: sh
    - name: Check if the benchmark code changed
      id: check_benchmarks
      env:
        MERGE_BASE: ${{ steps.merge_base.outputs.sha }}
      run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\nif git diff --quiet \"${MERGE_BASE}...HEAD\" -- \\\n  ':Cargo.toml' \\\n  ':Cargo.lock' \\\n  ':rust-toolchain.toml' \\\n  ':cargo/config.toml' \\\n  ':crates/ruff_benchmark/**' \\\n  ':.github/workflows/ci.yaml' \\\n; then\n    echo \"changed=false\" >> \"$GITHUB_OUTPUT\"\nelse\n    echo \"changed=true\" >> \"$GITHUB_OUTPUT\"\nfi\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Check-if-the-benchmark-code-changed.buildprof\" -- bash --noprofile --norc -eo pipefail \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
      shell: sh
    - name: Upload buildprof recordings
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ruff--ci-determine_changes-${{ strategy.job-index }}
        path: ${{ runner.temp }}/buildprof/*.buildprof
        retention-days: 30
        if-no-files-found: ignore
        compression-level: 0
    permissions:
      contents: read
    timeout-minutes: 120
  cargo-fmt:
    name: cargo fmt
    runs-on: ${{ 'astral-sh/ruff' == 'astral-sh/ruff' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    needs: determine_changes
    timeout-minutes: 120
    steps:
    - name: Fetch buildprof
      uses: actions/checkout@v4
      with:
        repository: LalitMaganti/buildprof-ci-survey
        path: .buildprof-fetch
        sparse-checkout: '.buildprof

          projects/ruff'
        persist-credentials: false
    - name: Install buildprof
      shell: sh
      run: 'mkdir -p "$RUNNER_TEMP/buildprof-bin" "$RUNNER_TEMP/buildprof-actions"

        cp .buildprof-fetch/.buildprof/buildprof-* "$RUNNER_TEMP/buildprof-bin/" && chmod +x "$RUNNER_TEMP/buildprof-bin/"*

        if [ "$(id -u)" != 0 ] && sudo -n true 2>/dev/null; then sudo setcap cap_sys_ptrace,cap_sys_admin+ep "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)"; fi

        if [ -d .buildprof-fetch/projects/ruff/actions ]; then cp -r .buildprof-fetch/projects/ruff/actions/. "$RUNNER_TEMP/buildprof-actions/"; fi

        rm -rf .buildprof-fetch

        '
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        repository: astral-sh/ruff
        ref: 2c6359372bb5893bd01aa34f78950055803cafac
    - name: Wrap upstream composite actions
      shell: sh
      run: 'if [ -n "$(ls -A "$RUNNER_TEMP/buildprof-actions" 2>/dev/null)" ]; then cp -r "$RUNNER_TEMP/buildprof-actions/." "./.github/actions/"; fi

        '
    - name: Install Rust toolchain
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        rustup component add rustfmt

        BUILDPROF_SCRIPT_EOF

        ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

        bp_rc=0

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Install-Rust-toolchain.buildprof" -- bash --noprofile --norc -eo pipefail "$bp_dir/$bp_id.sh" || bp_rc=$?

        kill $bp_watch 2>/dev/null; exit $bp_rc

        '
      shell: sh
    - run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        cargo fmt --all --check

        BUILDPROF_SCRIPT_EOF

        ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

        bp_rc=0

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-cargo-fmt-all-check.buildprof" -- bash --noprofile --norc -eo pipefail "$bp_dir/$bp_id.sh" || bp_rc=$?

