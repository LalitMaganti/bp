        rm -rf .buildprof-fetch

        '
    - name: set apt conf
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s%N)

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        ${{env.APT_SET_CONF}}

        BUILDPROF_SCRIPT_EOF

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open -o "$bp_dir/$bp_id-set-apt-conf.buildprof" -- bash --noprofile --norc -eo pipefail "$bp_dir/$bp_id.sh"

        '
      shell: sh
    - name: update apt
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s%N)

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        apt update

        BUILDPROF_SCRIPT_EOF

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open -o "$bp_dir/$bp_id-update-apt.buildprof" -- bash --noprofile --norc -eo pipefail "$bp_dir/$bp_id.sh"

        '
      shell: sh
    - name: install monero dependencies
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s%N)

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        ${{env.APT_INSTALL_LINUX}}

        BUILDPROF_SCRIPT_EOF

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open -o "$bp_dir/$bp_id-install-monero-dependencies.buildprof" -- bash --noprofile --norc -eo pipefail "$bp_dir/$bp_id.sh"

        '
      shell: sh
    - name: install rust
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s%N)

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        ${{env.INSTALL_RUST}}

        BUILDPROF_SCRIPT_EOF

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open -o "$bp_dir/$bp_id-install-rust.buildprof" -- bash --noprofile --norc -eo pipefail "$bp_dir/$bp_id.sh"

        '
      shell: sh
    - name: configure git
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s%N)

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        git config --global --add safe.directory ''*''

        BUILDPROF_SCRIPT_EOF

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open -o "$bp_dir/$bp_id-configure-git.buildprof" -- bash --noprofile --norc -eo pipefail "$bp_dir/$bp_id.sh"

        '
      shell: sh
    - uses: actions/checkout@v5
      with:
        submodules: recursive
        repository: monero-project/monero
        ref: 8340be5e920d881edc006e0896d6074cd06dfb2e
    - name: Wrap upstream composite actions
      shell: sh
      run: 'if [ -n "$(ls -A "$RUNNER_TEMP/buildprof-actions" 2>/dev/null)" ]; then cp -r "$RUNNER_TEMP/buildprof-actions/." "./.github/actions/"; fi

        '
    - name: restore ccache
      uses: actions/cache/restore@v5
      id: ccache-restore
      with:
        path: ~/.cache/ccache
        key: ccache-${{ matrix.container }}-build-${{ github.sha }}
        restore-keys: ccache-${{ matrix.container }}-build-
    - uses: ./.github/actions/set-make-job-count
    - name: build
      env:
        CMAKE_BUILD_PARALLEL_LEVEL: ${{env.MAKE_JOB_COUNT}}
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s%N)

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        ${{env.CCACHE_SETTINGS}}

        ${{env.BUILD_DEFAULT}}

        BUILDPROF_SCRIPT_EOF

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open -o "$bp_dir/$bp_id-build.buildprof" -- bash --noprofile --norc -eo pipefail "$bp_dir/$bp_id.sh"

        '
      shell: sh
    - name: save ccache
      uses: actions/cache/save@v5
      if: '''push'' != ''pull_request'' && steps.ccache-restore.outputs.cache-hit != ''true'''
      with:
        path: ~/.cache/ccache
        key: ${{ steps.ccache-restore.outputs.cache-primary-key }}
    - name: Upload buildprof recordings
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: monero--build-build-linux-${{ strategy.job-index }}
        path: ${{ runner.temp }}/buildprof/*.buildprof
        retention-days: 30
        if-no-files-found: ignore
        compression-level: 0
    permissions:
      contents: read
  test-ubuntu:
    name: ${{ matrix.name }} (tests)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
        - name: Ubuntu 24.04
          container: ubuntu:24.04
    container:
      image: ${{ matrix.container }}
      env:
        DEBIAN_FRONTEND: noninteractive
      options: --privileged
    steps:
    - name: Fetch buildprof
      uses: actions/checkout@v4
      with:
        repository: LalitMaganti/buildprof-ci-survey
        path: .buildprof-fetch
        sparse-checkout: '.buildprof

          projects/monero'
        persist-credentials: false
    - name: Install buildprof
      shell: sh
      run: 'mkdir -p "$RUNNER_TEMP/buildprof-bin" "$RUNNER_TEMP/buildprof-actions"

        cp .buildprof-fetch/.buildprof/buildprof-* "$RUNNER_TEMP/buildprof-bin/" && chmod +x "$RUNNER_TEMP/buildprof-bin/"*

        if [ -d .buildprof-fetch/projects/monero/actions ]; then cp -r .buildprof-fetch/projects/monero/actions/. "$RUNNER_TEMP/buildprof-actions/"; fi

