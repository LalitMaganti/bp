name: 'monero: ci/gh-actions/cli'
'on':
  workflow_dispatch: null
permissions:
  contents: read
env:
  REMOVE_BUNDLED_PACKAGES: sudo rm -rf /usr/local
  BUILD_DEFAULT: cmake -S . -B build -D ARCH="default" -D BUILD_TESTS=ON -D BUILD_GUI_DEPS=ON -D ENABLE_FUZZ_TEST=ON -D CMAKE_BUILD_TYPE=Release && cmake --build build --target all
  APT_INSTALL_LINUX: apt -y install build-essential cmake libboost-all-dev libunbound-dev graphviz doxygen libunwind8-dev pkg-config libssl-dev libzmq3-dev libsodium-dev libhidapi-dev libusb-1.0-0-dev libprotobuf-dev protobuf-compiler ccache curl git
  APT_SET_CONF: 'tee -a /etc/apt/apt.conf.d/80-custom << EOF

    Acquire::Retries "3";

    Acquire::http::Timeout "120";

    Acquire::ftp::Timeout "120";

    EOF

    '
  CCACHE_SETTINGS: 'ccache --max-size=150M

    '
  CTEST_EXCLUDE_SLOW: 'cd build

    env GTEST_FILTER="-DNSResolver.*:AddressFromURL.*:select_outputs.*" ctest --output-on-failure -E "functional_tests_rpc|core_tests|cnv4-jit|hash-variant2-int-sqrt|wide_difficulty"

    '
  USE_DEVICE_TREZOR_MANDATORY: true
  INSTALL_RUST: 'curl -O https://static.rust-lang.org/rustup/archive/1.29.0/x86_64-unknown-linux-gnu/rustup-init

    echo "4acc9acc76d5079515b46346a485974457b5a79893cfb01112423c89aeb5aa10 rustup-init" | sha256sum -c

    chmod +x rustup-init

    ./rustup-init -y --default-toolchain 1.93

    echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    '
jobs:
  build-arch:
    name: Arch Linux
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
    - name: Fetch buildprof
      uses: actions/checkout@v4
      with:
        repository: LalitMaganti/buildprof-ci-survey
        path: .buildprof-fetch
        sparse-checkout: '.buildprof

          projects/monero'
        persist-credentials: false
    - name: Install buildprof
      shell: sh
      run: 'mkdir -p "$RUNNER_TEMP/buildprof-bin" "$RUNNER_TEMP/buildprof-actions"

        cp .buildprof-fetch/.buildprof/buildprof-* "$RUNNER_TEMP/buildprof-bin/" && chmod +x "$RUNNER_TEMP/buildprof-bin/"*

        if [ -d .buildprof-fetch/projects/monero/actions ]; then cp -r .buildprof-fetch/projects/monero/actions/. "$RUNNER_TEMP/buildprof-actions/"; fi

        rm -rf .buildprof-fetch

        '
    - name: install dependencies
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s%N)

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        pacman -Syyu --noconfirm base-devel git rust cmake boost boost-libs openssl zeromq unbound libsodium readline expat gtest python3 doxygen graphviz hidapi libusb protobuf ccache

        BUILDPROF_SCRIPT_EOF

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open -o "$bp_dir/$bp_id-install-dependencies.buildprof" -- bash --noprofile --norc -eo pipefail "$bp_dir/$bp_id.sh"

        '
      shell: sh
    - name: configure git
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s%N)

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        git config --global --add safe.directory ''*''

        BUILDPROF_SCRIPT_EOF

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open -o "$bp_dir/$bp_id-configure-git.buildprof" -- bash --noprofile --norc -eo pipefail "$bp_dir/$bp_id.sh"

        '
      shell: sh
    - uses: actions/checkout@v5
      with:
        submodules: recursive
        repository: monero-project/monero
        ref: 8340be5e920d881edc006e0896d6074cd06dfb2e
    - name: Wrap upstream composite actions
      shell: sh
      run: 'if [ -n "$(ls -A "$RUNNER_TEMP/buildprof-actions" 2>/dev/null)" ]; then cp -r "$RUNNER_TEMP/buildprof-actions/." "./.github/actions/"; fi

        '
    - name: restore ccache
      uses: actions/cache/restore@v5
      id: ccache-restore
      with:
        path: ~/.cache/ccache
        key: ccache-arch-build-${{ github.sha }}
        restore-keys: ccache-arch-build-
    - uses: ./.github/actions/set-make-job-count
    - name: build
      env:
        CMAKE_BUILD_PARALLEL_LEVEL: ${{env.MAKE_JOB_COUNT}}
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s%N)

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        ${{ env.CCACHE_SETTINGS }}

        ${{ env.BUILD_DEFAULT }}

        BUILDPROF_SCRIPT_EOF

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open -o "$bp_dir/$bp_id-build.buildprof" -- bash --noprofile --norc -eo pipefail "$bp_dir/$bp_id.sh"

        '
      shell: sh
    - name: save ccache
      uses: actions/cache/save@v5
      if: '''push'' != ''pull_request'' && steps.ccache-restore.outputs.cache-hit != ''true'''
      with:
        path: ~/.cache/ccache
        key: ${{ steps.ccache-restore.outputs.cache-primary-key }}
    - name: Upload buildprof recordings
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: monero--build-build-arch-${{ strategy.job-index }}
        path: ${{ runner.temp }}/buildprof/*.buildprof
        retention-days: 30
        if-no-files-found: ignore
        compression-level: 0
    permissions:
      contents: read
  build-linux:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: Debian 12
          container: debian:12
        - name: Ubuntu 22.04
          container: ubuntu:22.04
    container:
      image: ${{ matrix.container }}
      env:
        DEBIAN_FRONTEND: noninteractive
    steps:
    - name: Fetch buildprof
      uses: actions/checkout@v4
      with:
        repository: LalitMaganti/buildprof-ci-survey
