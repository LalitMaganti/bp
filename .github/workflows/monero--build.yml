        '
    - name: set apt conf
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s%N)

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        ${{env.APT_SET_CONF}}

        BUILDPROF_SCRIPT_EOF

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open -o "$bp_dir/$bp_id-set-apt-conf.buildprof" -- bash --noprofile --norc -eo pipefail "$bp_dir/$bp_id.sh"

        '
      shell: sh
    - name: update apt
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s%N)

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        apt update

        BUILDPROF_SCRIPT_EOF

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open -o "$bp_dir/$bp_id-update-apt.buildprof" -- bash --noprofile --norc -eo pipefail "$bp_dir/$bp_id.sh"

        '
      shell: sh
    - name: install dependencies
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s%N)

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        apt install -y git python3-pip

        BUILDPROF_SCRIPT_EOF

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open -o "$bp_dir/$bp_id-install-dependencies.buildprof" -- bash --noprofile --norc -eo pipefail "$bp_dir/$bp_id.sh"

        '
      shell: sh
    - name: configure git
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s%N)

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        git config --global --add safe.directory ''*''

        BUILDPROF_SCRIPT_EOF

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open -o "$bp_dir/$bp_id-configure-git.buildprof" -- bash --noprofile --norc -eo pipefail "$bp_dir/$bp_id.sh"

        '
      shell: sh
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        submodules: recursive
        repository: monero-project/monero
        ref: 8340be5e920d881edc006e0896d6074cd06dfb2e
    - name: Wrap upstream composite actions
      shell: sh
      run: 'if [ -n "$(ls -A "$RUNNER_TEMP/buildprof-actions" 2>/dev/null)" ]; then cp -r "$RUNNER_TEMP/buildprof-actions/." "./.github/actions/"; fi

        '
    - name: archive
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s%N)

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        pip install git-archive-all

        export VERSION="monero-$(git describe)"

        export OUTPUT="$VERSION.tar"

        echo "OUTPUT=$OUTPUT" >> $GITHUB_ENV

        git-archive-all --prefix "$VERSION/" --force-submodules "$OUTPUT"

        BUILDPROF_SCRIPT_EOF

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open -o "$bp_dir/$bp_id-archive.buildprof" -- bash --noprofile --norc -eo pipefail "$bp_dir/$bp_id.sh"

        '
      shell: sh
    - uses: actions/upload-artifact@v7
      with:
        name: ${{ env.OUTPUT }}
        path: ${{ env.OUTPUT }}
    - name: Upload buildprof recordings
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: monero--build-source-archive-${{ strategy.job-index }}
        path: ${{ runner.temp }}/buildprof/*.buildprof
        retention-days: 30
        if-no-files-found: ignore
        compression-level: 0
    permissions:
      contents: read
