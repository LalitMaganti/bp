      id: ccache-restore
      with:
        path: ~/.cache/ccache
        key: ccache-${{ matrix.container }}-build-${{ github.sha }}
        restore-keys: ccache-${{ matrix.container }}-build-
    - name: create dummy disk drives for testing
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s%N)

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        tests/create_test_disks.sh >> $GITHUB_ENV

        BUILDPROF_SCRIPT_EOF

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open -o "$bp_dir/$bp_id-create-dummy-disk-drives-for-testing.buildprof" -- bash --noprofile --norc -eo pipefail "$bp_dir/$bp_id.sh"

        '
      shell: sh
    - uses: ./.github/actions/set-make-job-count
    - name: build
      env:
        CMAKE_BUILD_PARALLEL_LEVEL: ${{env.MAKE_JOB_COUNT}}
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s%N)

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        ${{env.CCACHE_SETTINGS}}

        ${{env.BUILD_DEFAULT}}

        BUILDPROF_SCRIPT_EOF

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open -o "$bp_dir/$bp_id-build.buildprof" -- bash --noprofile --norc -eo pipefail "$bp_dir/$bp_id.sh"

        '
      shell: sh
    - name: run tests except core_tests
      env:
        DNS_PUBLIC: tcp
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s%N)

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        ctest --test-dir build --output-on-failure -E core_tests

        BUILDPROF_SCRIPT_EOF

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open -o "$bp_dir/$bp_id-run-tests-except-core-tests.buildprof" -- bash --noprofile --norc -eo pipefail "$bp_dir/$bp_id.sh"

        '
      shell: sh
    - name: use reduced slow-hash iterations for core_tests
      if: '''push'' == ''pull_request'''
      env:
        CFLAGS: -DMONERO_CRYPTO_SLOW_HASH_ITER=20
        CMAKE_BUILD_PARALLEL_LEVEL: ${{env.MAKE_JOB_COUNT}}
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s%N)

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        cmake -S . -B build --fresh -D ARCH="default" -D BUILD_TESTS=ON

        cmake --build build --target core_tests

        BUILDPROF_SCRIPT_EOF

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open -o "$bp_dir/$bp_id-use-reduced-slow-hash-iterations-for-cor.buildprof" -- bash --noprofile --norc -eo pipefail "$bp_dir/$bp_id.sh"

        '
      shell: sh
    - name: run core_tests
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s%N)

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        ctest --test-dir build --output-on-failure -R core_tests

        BUILDPROF_SCRIPT_EOF

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open -o "$bp_dir/$bp_id-run-core-tests.buildprof" -- bash --noprofile --norc -eo pipefail "$bp_dir/$bp_id.sh"

        '
      shell: sh
    - name: save ccache
      uses: actions/cache/save@v5
      if: '''push'' != ''pull_request'' && steps.ccache-restore.outputs.cache-hit != ''true'''
      with:
        path: ~/.cache/ccache
        key: ${{ steps.ccache-restore.outputs.cache-primary-key }}
    - name: Upload buildprof recordings
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: monero--build-test-ubuntu-${{ strategy.job-index }}
        path: ${{ runner.temp }}/buildprof/*.buildprof
        retention-days: 30
        if-no-files-found: ignore
        compression-level: 0
    permissions:
      contents: read
  build-docker:
