name: 'servo: Dispatch Workflow'
'on':
  workflow_call:
    inputs:
      workflow:
        required: true
        type: string
      profile:
        required: true
        type: string
      build-args:
        required: true
        type: string
      wpt-args:
        required: true
        type: string
      wpt:
        required: true
        type: boolean
      number-of-wpt-chunks:
        required: true
        type: number
      unit-tests:
        required: true
        type: boolean
      devtools-tests:
        required: true
        type: boolean
      build-libservo:
        required: true
        type: boolean
      bencher:
        required: true
        type: boolean
      coverage:
        required: true
        type: boolean
      capi:
        required: true
        type: boolean
    outputs:
      ohos_optional_job_status:
        description: The status of the optional jobs in the ohos workflow
        value: ${{ jobs.ohos.outputs.optional_job_status }}
permissions:
  contents: read
jobs:
  win:
    if: ${{ inputs.workflow == 'windows' }}
    name: Windows
    uses: ./.github/workflows/servo--windows.yml
    secrets: inherit
    with:
      profile: ${{ inputs.profile }}
      build-args: ${{ inputs.build-args }}
      unit-tests: ${{ inputs.unit-tests }}
      build-libservo: ${{ inputs.build-libservo }}
      bencher: ${{ inputs.bencher }}
      capi: ${{ inputs.capi }}
  macos:
    if: ${{ inputs.workflow == 'macos' }}
    name: MacOS
    uses: ./.github/workflows/servo--mac.yml
    secrets: inherit
    with:
      profile: ${{ inputs.profile }}
      build-args: ${{ inputs.build-args }}
      wpt: ${{ inputs.wpt }}
      unit-tests: ${{ inputs.unit-tests }}
      build-libservo: ${{ inputs.build-libservo }}
      wpt-args: ${{ inputs.wpt-args }}
      bencher: ${{ inputs.bencher }}
      capi: ${{ inputs.capi }}
  linux:
    if: ${{ inputs.workflow == 'linux' }}
    name: Linux
    uses: ./.github/workflows/servo--linux.yml
    secrets: inherit
    with:
      profile: ${{ inputs.profile }}
      build-args: ${{ inputs.build-args }}
      wpt: ${{ inputs.wpt }}
      number-of-wpt-chunks: ${{ inputs.number-of-wpt-chunks }}
      unit-tests: ${{ inputs.unit-tests }}
      devtools-tests: ${{ inputs.devtools-tests }}
      build-libservo: ${{ inputs.build-libservo }}
      wpt-args: ${{ inputs.wpt-args }}
      bencher: ${{ inputs.bencher }}
      coverage: ${{ inputs.coverage }}
      capi: ${{ inputs.capi }}
  linux-arm64:
    if: ${{ inputs.workflow == 'linux-arm64' }}
    name: Linux (arm64)
    uses: ./.github/workflows/servo--linux-arm64.yml
    secrets: inherit
    with:
      profile: ${{ inputs.profile }}
      build-args: ${{ inputs.build-args }}
      wpt: ${{ inputs.wpt }}
      number-of-wpt-chunks: ${{ inputs.number-of-wpt-chunks }}
      unit-tests: ${{ inputs.unit-tests }}
      devtools-tests: ${{ inputs.devtools-tests }}
      build-libservo: ${{ inputs.build-libservo }}
      wpt-args: ${{ inputs.wpt-args }}
      bencher: ${{ inputs.bencher }}
      coverage: ${{ inputs.coverage }}
      capi: ${{ inputs.capi }}
  lint:
    if: ${{ inputs.workflow == 'lint' }}
    name: Lint
    uses: ./.github/workflows/servo--lint.yml
  perf-analysis:
    if: ${{ inputs.workflow == 'perf-analysis' }}
    name: Perf analysis
    uses: ./.github/workflows/servo--perf-analysis.yml
    secrets: inherit
    with:
      profile: ${{ inputs.profile }}
      build-args: ${{ inputs.build-args }}
  android:
    if: ${{ inputs.workflow == 'android' }}
    name: Android
    uses: ./.github/workflows/servo--android.yml
    secrets: inherit
    with:
      profile: ${{ inputs.profile }}
      bencher: ${{ inputs.bencher }}
  ohos:
    if: ${{ inputs.workflow == 'ohos' }}
    name: OpenHarmony
    uses: ./.github/workflows/servo--ohos.yml
    secrets: inherit
    with:
      profile: ${{ inputs.profile }}
      bencher: ${{ inputs.bencher }}
