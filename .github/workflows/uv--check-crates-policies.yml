name: 'uv: check-crates-policies.yml'
'on':
  workflow_call: null
permissions:
  contents: read
env:
  UV_LOCKED: 1
jobs:
  check:
    name: crates policies
    runs-on: ${{ 'astral-sh' == 'astral-sh' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    environment: automations
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
    - name: Fetch buildprof
      uses: actions/checkout@v4
      with:
        repository: LalitMaganti/buildprof-ci-survey
        path: .buildprof-fetch
        sparse-checkout: '.buildprof

          projects/uv'
        persist-credentials: false
    - name: Install buildprof
      shell: sh
      working-directory: ${{ github.workspace }}
      run: 'mkdir -p "$RUNNER_TEMP/buildprof-bin" "$RUNNER_TEMP/buildprof-actions"

        cp .buildprof-fetch/.buildprof/buildprof-* "$RUNNER_TEMP/buildprof-bin/" && chmod +x "$RUNNER_TEMP/buildprof-bin/"*

        if [ "$(id -u)" != 0 ] && sudo -n true 2>/dev/null; then sudo setcap cap_sys_ptrace,cap_sys_admin+ep "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)"; fi

        if [ -d .buildprof-fetch/projects/uv/actions ]; then cp -r .buildprof-fetch/projects/uv/actions/. "$RUNNER_TEMP/buildprof-actions/"; fi

        rm -rf .buildprof-fetch

        '
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 5477928f71f0634db593a8a10a8012044fe02349
        persist-credentials: false
        repository: astral-sh/uv
    - name: Wrap upstream composite actions
      shell: sh
      working-directory: ${{ github.workspace }}
      run: "if [ -n \"$(ls -A \"$RUNNER_TEMP/buildprof-actions\" 2>/dev/null)\" ]; then\n  cp -r \"$RUNNER_TEMP/buildprof-actions/.\" \"./.github/actions/\"\n  (cd \".\" && git ls-files -m .github/actions | xargs -r git update-index --assume-unchanged) 2>/dev/null || true\nfi\n"
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      with:
        version: 0.13.4
        checksum: 2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f
    - name: Check crates.io publish setup
      id: check
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        git clone --depth=1 --quiet https://github.com/astral-sh/crates-policies.git "$RUNNER_TEMP/crates-policies"

        git -C "$RUNNER_TEMP/crates-policies" log -1 --format=''crates-policies commit: %H''

        uv run "$RUNNER_TEMP/crates-policies/check.py" "$GITHUB_WORKSPACE"

        BUILDPROF_SCRIPT_EOF

        ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

        bp_rc=0

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Check-crates-io-publish-setup.buildprof" -- $(command -v bash >/dev/null && echo "bash --noprofile --norc -eo pipefail" || echo "sh -e") "$bp_dir/$bp_id.sh" || bp_rc=$?

        kill $bp_watch 2>/dev/null; exit $bp_rc

        '
      shell: sh
    - name: Get pull request comment token
      id: token
      if: failure() && steps.check.outcome == 'failure'
      uses: open-security-tools/ost-simple-sts@9e012247e07c39080fb6a832dbfbcfeacebc19c4
      with:
        exchange-url: ${{ secrets.STS_API_URL }}/exchange
        audience: ${{ secrets.STS_API_URL }}
        repository: ${{ 'astral-sh/uv' }}
        permissions: 'pull_requests: write

          '
    - name: Comment on the release pull request
      if: failure() && steps.token.outcome == 'success'
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
      run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\nassignees=\"$(gh pr view \"$PULL_REQUEST_NUMBER\" --repo \"$GITHUB_REPOSITORY\" \\\n  --json assignees --jq '[.assignees[].login | \"@\" + .] | join(\" \")')\"\nbody=\"$(cat <<EOF\nThe [crates.io publishing policy check]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT) failed.\n\nRegister any newly publishable crates in [astral-sh/crates-policies](https://github.com/astral-sh/crates-policies).\nRe-run the check after the policy is updated.\nEOF\n)\"\nif [ -n \"$assignees\" ]; then\n  printf -v body '%s\\n\\n%s' \"$assignees\" \"$body\"\nfi\ngh pr comment \"$PULL_REQUEST_NUMBER\" --repo \"$GITHUB_REPOSITORY\" --body \"$body\"\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Comment-on-the-release-pull-request.buildprof\" -- $(command -v bash >/dev/null && echo \"bash --noprofile --norc -eo pipefail\" || echo \"sh -e\") \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
      shell: sh
    - name: Upload buildprof recordings
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: uv--check-crates-policies-check-${{ strategy.job-index }}
        path: ${{ runner.temp }}/buildprof/*.buildprof
        retention-days: 30
        if-no-files-found: ignore
        compression-level: 0
