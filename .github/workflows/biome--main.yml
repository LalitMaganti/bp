        compression-level: 0
    permissions:
      contents: read
    timeout-minutes: 120
  coverage:
    name: Test262 Coverage
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-24.04-arm
    steps:
    - name: Fetch buildprof
