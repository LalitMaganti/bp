name: 'tokio: Uring Kernel Version Test'
'on':
  workflow_call:
    inputs:
      kernel_version:
        description: Version of the Linux kernel to build
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KERNEL_VERSION: ${{ inputs.kernel_version }}
    steps:
    - name: Fetch buildprof
      uses: actions/checkout@v4
      with:
        repository: LalitMaganti/bp
        path: .buildprof-fetch
        sparse-checkout: '.buildprof

          projects/tokio'
        persist-credentials: false
    - name: Install buildprof
      shell: sh
      working-directory: ${{ github.workspace }}
      run: 'mkdir -p "$RUNNER_TEMP/buildprof-bin" "$RUNNER_TEMP/buildprof-actions"

        cp .buildprof-fetch/.buildprof/buildprof-* "$RUNNER_TEMP/buildprof-bin/" && chmod +x "$RUNNER_TEMP/buildprof-bin/"*

        if [ "$(id -u)" != 0 ] && sudo -n true 2>/dev/null; then sudo setcap cap_sys_ptrace,cap_sys_admin+ep "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)"; fi

        if [ -d .buildprof-fetch/projects/tokio/actions ]; then cp -r .buildprof-fetch/projects/tokio/actions/. "$RUNNER_TEMP/buildprof-actions/"; fi

        rm -rf .buildprof-fetch

        '
    - uses: actions/checkout@v7
      with:
        repository: tokio-rs/tokio
        ref: ce685ee6916549ed7e52dbfd5430858bbdc734d3
    - name: Wrap upstream composite actions
      shell: sh
      working-directory: ${{ github.workspace }}
      run: "if [ -n \"$(ls -A \"$RUNNER_TEMP/buildprof-actions\" 2>/dev/null)\" ]; then\n  cp -r \"$RUNNER_TEMP/buildprof-actions/.\" \"./.github/actions/\"\n  (cd \".\" && git ls-files -m .github/actions | xargs -r git update-index --assume-unchanged) 2>/dev/null || true\nfi\n"
    - name: Install system dependencies
      run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\nsudo apt-get update\nsudo apt-get install -y \\\n  build-essential bison flex libssl-dev libelf-dev \\\n  qemu-system-x86 busybox-static cpio xz-utils wget\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Install-system-dependencies.buildprof\" -- $(command -v bash >/dev/null && echo \"bash --noprofile --norc -eo pipefail\" || echo \"sh -e\") \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
      shell: sh
    - name: Cache Linux source
      id: cache-kernel
      uses: actions/cache@v6
      with:
        path: linux-${{ env.KERNEL_VERSION }}
        key: kernel-${{ env.KERNEL_VERSION }}
    - name: Download & build Linux kernel
      if: steps.cache-kernel.outputs.cache-hit != 'true'
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        MAJOR=${KERNEL_VERSION%%.*}

        wget https://cdn.kernel.org/pub/linux/kernel/v${MAJOR}.x/linux-${KERNEL_VERSION}.tar.xz

        tar xf linux-${KERNEL_VERSION}.tar.xz

        cd linux-${KERNEL_VERSION}

        make defconfig

        make -j$(nproc)

        BUILDPROF_SCRIPT_EOF

        ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

        bp_rc=0

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Download-build-Linux-kernel.buildprof" -- $(command -v bash >/dev/null && echo "bash --noprofile --norc -eo pipefail" || echo "sh -e") "$bp_dir/$bp_id.sh" || bp_rc=$?

        kill $bp_watch 2>/dev/null; exit $bp_rc

        '
      shell: sh
    - name: Generate test binaries with io_uring enabled
      run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\n# Build both integration (tokio/tests/) and unit (e.g., tokio/src/fs/file/tests.rs) tests with io_uring enabled\nrustup target add x86_64-unknown-linux-musl\nRUSTFLAGS=\"--cfg tokio_unstable\" \\\n  cargo test -p tokio --features full,io-uring \\\n  --target x86_64-unknown-linux-musl --test 'fs*' --lib --no-run\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Generate-test-binaries-with-io-uring-ena.buildprof\" -- $(command -v bash >/dev/null && echo \"bash --noprofile --norc -eo pipefail\" || echo \"sh -e\") \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
      shell: sh
    - name: Prepare initramfs + tests binaries
      run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\nset -e\nrm -rf initramfs\nmkdir -p initramfs/{bin,bin/tests,sbin,proc,sys,tmp}\n\n# Copy test binaries into initramfs\nfor bin in target/x86_64-unknown-linux-musl/debug/deps/{fs_*,tokio-*}; do\n  if [ -f \"$bin\" ] && [ -x \"$bin\" ]; then\n    cp \"$bin\" initramfs/bin/tests\n  fi\ndone\n\n# Add BusyBox & symlinks\ncp /usr/bin/busybox initramfs/bin/\nfor cmd in sh mount uname true sleep; do ln -sf busybox initramfs/bin/$cmd; done\nln -sf ../bin/busybox initramfs/sbin/poweroff\n\n# Generate init script\ncat > initramfs/init << 'EOF'\n#!/bin/sh\nset -e\nmkdir -p /dev\n# create device nodes, as some tests require them\nmknod /dev/null c 1 3\nmknod /dev/zero c 1 5\nmknod /dev/tty c 5 0\nmount -t proc proc /proc\nmount -t sysfs sysfs /sys\nmkdir -p /tmp && mount -t tmpfs -o mode=1777 tmpfs /tmp\n# The stress tests can open 10,000 files concurrently.\nulimit -n 65536\nfor f in /bin/tests/*; do RUST_BACKTRACE=1 \"$f\" ; done\necho \"ALL_TESTS_COMPLETED\"\nEOF\nchmod +x initramfs/init\n\n# Pack into a CPIO archive\n(cd initramfs && find . -print0 \\\n  | cpio --null -ov --format=newc | gzip -9 > ../initramfs.cpio.gz)\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Prepare-initramfs-tests-binaries.buildprof\" -- $(command -v bash >/dev/null && echo \"bash --noprofile --norc -eo pipefail\" || echo \"sh -e\") \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
      shell: sh
    - name: Run tests in QEMU
      shell: sh
      run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\nset -euo pipefail\n\nset +e\n# 3 GiB guest (the runner has 16 GB): the initramfs holds ~760 MB of\n# unstripped test binaries, and `open_many_files` in `fs_uring` had\n# 200-340 MB of anon RSS when the 1 GiB guest OOM-killed it.\nqemu-system-x86_64 \\\n  -kernel linux-${{ env.KERNEL_VERSION }}/arch/x86/boot/bzImage \\\n  -initrd initramfs.cpio.gz \\\n  -append \"console=ttyS0 rootfstype=ramfs panic=1\" \\\n  -nographic -no-reboot -m 3072 -action panic=exit-failure 2>&1 | tee qemu-output.log\nqemu_status=${PIPESTATUS[0]} tee_status=${PIPESTATUS[1]}\nset -e\n\nif [ \"$qemu_status\" -ne 0 ]; then\n  echo \"QEMU exited with status $qemu_status\"\n  exit \"$qemu_status\"\nfi\n\nif [ \"$tee_status\" -ne 0 ]; then\n  echo \"tee exited with status $tee_status\"\n  exit \"$tee_status\"\nfi\n\nif grep -q \"test result: FAILED\" qemu-output.log; then\n  echo \"tests reported failures\"\n  exit 1\nfi\n\n# A binary killed before it prints its summary (OOM, panic in init)\n# never writes `test result: FAILED`, so also require the marker that\n# init prints after the last binary.\nif ! grep -q \"ALL_TESTS_COMPLETED\" qemu-output.log; then\n  echo \"tests did not run to completion\"\n  exit 1\nfi\n\necho \"all tests passed\"\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Run-tests-in-QEMU.buildprof\" -- bash --noprofile --norc -eo pipefail \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
    - name: Upload buildprof recordings
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: tokio--uring-kernel-version-test-build-${{ strategy.job-index }}
        path: ${{ runner.temp }}/buildprof/*.buildprof
        retention-days: 30
        if-no-files-found: ignore
        compression-level: 0
    permissions:
      contents: read
    timeout-minutes: 120
