name: 'rspack: Bench Rust'
'on':
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      runner:
        required: true
        type: string
      measurement:
        required: false
        type: string
        default: simulation
      bench_target:
        required: false
        type: string
        default: ''
      bench_filter:
        required: false
        type: string
        default: ''
      ref:
        required: false
        type: string
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: 0
jobs:
  bench-rust:
    name: Bench Rust ${{ inputs.measurement }}
    runs-on: ${{ fromJSON(inputs.runner) }}
    env:
      BENCH_MODE: ${{ inputs.measurement }}
    defaults:
      run:
        shell: bash
    steps:
    - name: Fetch buildprof
      uses: actions/checkout@v4
      with:
        repository: LalitMaganti/bp
        path: .buildprof-fetch
        sparse-checkout: '.buildprof

          projects/rspack'
        persist-credentials: false
    - name: Install buildprof
      shell: sh
      working-directory: ${{ github.workspace }}
      run: 'mkdir -p "$RUNNER_TEMP/buildprof-bin" "$RUNNER_TEMP/buildprof-actions"

        cp .buildprof-fetch/.buildprof/buildprof-* "$RUNNER_TEMP/buildprof-bin/" && chmod +x "$RUNNER_TEMP/buildprof-bin/"*

        if [ "$(id -u)" != 0 ] && sudo -n true 2>/dev/null; then sudo setcap cap_sys_ptrace,cap_sys_admin+ep "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)"; fi

        if [ -d .buildprof-fetch/projects/rspack/actions ]; then cp -r .buildprof-fetch/projects/rspack/actions/. "$RUNNER_TEMP/buildprof-actions/"; fi

        rm -rf .buildprof-fetch

        '
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 162dd637f972c2f99165ca264d14fde12bea391d
        clean: ${{ runner.environment == 'github-hosted' }}
        repository: web-infra-dev/rspack
    - name: Wrap upstream composite actions
      shell: sh
      working-directory: ${{ github.workspace }}
      run: "if [ -n \"$(ls -A \"$RUNNER_TEMP/buildprof-actions\" 2>/dev/null)\" ]; then\n  cp -r \"$RUNNER_TEMP/buildprof-actions/.\" \"./.github/actions/\"\n  (cd \".\" && git ls-files -m .github/actions | xargs -r git update-index --assume-unchanged) 2>/dev/null || true\nfi\n"
    - name: Pnpm Setup
      timeout-minutes: 5
      uses: ./.github/actions/pnpm/setup
    - name: Prepare benchmark cases
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        pnpm run bench:prepare

        BUILDPROF_SCRIPT_EOF

        ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

        bp_rc=0

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Prepare-benchmark-cases.buildprof" -- bash --noprofile --norc -eo pipefail "$bp_dir/$bp_id.sh" || bp_rc=$?

        kill $bp_watch 2>/dev/null; exit $bp_rc

        '
      shell: sh
    - name: Install Rust Toolchain
      uses: ./.github/actions/rustup
      with:
        save-if: true
        key: rust-bench-${{ inputs.target }}
    - name: Install cargo-codspeed binary
      uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419
      with:
        tool: cargo-codspeed@4.4.1
    - name: Setup Rust Target
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        rustup target add ${{ inputs.target }}

        BUILDPROF_SCRIPT_EOF

        ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

        bp_rc=0

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Setup-Rust-Target.buildprof" -- bash --noprofile --norc -eo pipefail "$bp_dir/$bp_id.sh" || bp_rc=$?

        kill $bp_watch 2>/dev/null; exit $bp_rc

        '
      shell: sh
    - name: Run Cargo codegen
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        cargo codegen

        BUILDPROF_SCRIPT_EOF

        ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

        bp_rc=0

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Run-Cargo-codegen.buildprof" -- bash --noprofile --norc -eo pipefail "$bp_dir/$bp_id.sh" || bp_rc=$?

        kill $bp_watch 2>/dev/null; exit $bp_rc

        '
      shell: sh
    - name: Build benchmark (${{ inputs.measurement }})
      run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\nbench_args=()\nif [ -n \"${{ inputs.bench_target }}\" ]; then\n  bench_args+=(--bench \"${{ inputs.bench_target }}\")\nelse\n  bench_args+=(--bench benches --bench rspack_sources)\nfi\ncargo codspeed build -m ${{ inputs.measurement }} --profile codspeed -p rspack_benchmark \"${bench_args[@]}\"\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Build-benchmark-inputs-measurement.buildprof\" -- bash --noprofile --norc -eo pipefail \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
      shell: sh
    - name: Prepare CodSpeed temporary directory
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        mkdir -p "${RUNNER_TEMP}/codspeed-valgrind-tmp"

        BUILDPROF_SCRIPT_EOF

        ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

        bp_rc=0

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Prepare-CodSpeed-temporary-directory.buildprof" -- bash --noprofile --norc -eo pipefail "$bp_dir/$bp_id.sh" || bp_rc=$?

        kill $bp_watch 2>/dev/null; exit $bp_rc

        '
      shell: sh
    - name: Run benchmark (simulation)
      if: ${{ inputs.measurement == 'simulation' }}
      uses: hardfist/action@750625725fb8def914579fc789c6249580c84a95
      timeout-minutes: 30
      env:
        TMPDIR: ${{ runner.temp }}/codspeed-valgrind-tmp
        CODSPEED_EXPERIMENTAL_FAIR_SCHED: true
        MIMALLOC_PURGE_DELAY: '-1'
        GLIBC_TUNABLES: glibc.cpu.hwcaps=-AVX512F,-AVX2,-AVX,-AVX_Fast_Unaligned_Load,-ERMS,-Prefer_ERMS,-SSE4_2,-SSSE3
      with:
        mode: simulation
        run: "if [ -n \"${{ inputs.bench_target }}\" ]; then\n  bench_args=(--bench \"${{ inputs.bench_target }}\")\n  if [ -n \"${{ inputs.bench_filter }}\" ]; then\n    bench_args+=(\"${{ inputs.bench_filter }}\")\n  fi\n  RSPACK_BENCHCASES_DIR=$PWD/.bench/rspack-benchcases cargo codspeed run \"${bench_args[@]}\"\nelse\n  pnpm run bench:rust\nfi\n"
        token: ${{ secrets.CODSPEED_TOKEN }}
        runner-version: rev:2ca934f5a71e0299e0a3941a84ac3b242b3b63b6
        skip-hash-check-warning: true
    - name: Run benchmark (walltime)
      if: ${{ inputs.measurement == 'walltime' }}
      uses: hardfist/action@750625725fb8def914579fc789c6249580c84a95
      timeout-minutes: 30
      env:
        TMPDIR: ${{ runner.temp }}/codspeed-valgrind-tmp
        HOME: /root
      with:
        mode: walltime
        run: "sync; echo 1 > /proc/sys/vm/drop_caches\nif [ -n \"${{ inputs.bench_target }}\" ]; then\n  bench_args=(--bench \"${{ inputs.bench_target }}\")\n  if [ -n \"${{ inputs.bench_filter }}\" ]; then\n    bench_args+=(\"${{ inputs.bench_filter }}\")\n  fi\n  RSPACK_BENCHCASES_DIR=$PWD/.bench/rspack-benchcases cargo codspeed run \"${bench_args[@]}\"\nelse\n  pnpm run bench:rust\nfi\n"
        token: ${{ secrets.CODSPEED_TOKEN }}
        runner-version: rev:2ca934f5a71e0299e0a3941a84ac3b242b3b63b6
        skip-hash-check-warning: true
    - name: Prepare Valgrind temporary files artifact
      if: ${{ always() && inputs.measurement == 'simulation' }}
      run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\nmkdir -p \"${RUNNER_TEMP}/codspeed-valgrind-tmp\"\n{\n  echo \"TMPDIR=${RUNNER_TEMP}/codspeed-valgrind-tmp\"\n  echo\n  find \"${RUNNER_TEMP}/codspeed-valgrind-tmp\" -mindepth 1 -maxdepth 2 -printf '%M %s %p\\n' | sort\n} > \"${RUNNER_TEMP}/codspeed-valgrind-tmp/MANIFEST.txt\"\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Prepare-Valgrind-temporary-files-artifac.buildprof\" -- bash --noprofile --norc -eo pipefail \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
      shell: sh
    - name: Upload Valgrind temporary files
      if: ${{ always() && inputs.measurement == 'simulation' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: codspeed-valgrind-tmp-${{ inputs.target }}
        path: ${{ runner.temp }}/codspeed-valgrind-tmp
        include-hidden-files: true
        if-no-files-found: ignore
        overwrite: true
    - name: Upload buildprof recordings
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: rspack--bench-rust-bench-rust-${{ strategy.job-index }}
        path: ${{ runner.temp }}/buildprof/*.buildprof
        retention-days: 30
        if-no-files-found: ignore
        compression-level: 0
    permissions:
      contents: read
    timeout-minutes: 120
