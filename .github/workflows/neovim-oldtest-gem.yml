name: 'neovim: oldtest with and without gem env gempath per test'
on:
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  oldtest:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, gem-home-guard]
        rep: [1, 2]
    env:
      BIN_DIR: ${{ github.workspace }}/.deps/bin
      CC: gcc
      GEM_HOME: ${{ github.workspace }}/.deps/ruby
      PERL5LIB: ${{ github.workspace }}/.deps/perl5/lib/perl5
      BUILD_FLAGS: -D CMAKE_BUILD_TYPE=Release -D ENABLE_TRANSLATIONS=ON
    steps:
      - uses: actions/checkout@v4
        with:
          repository: neovim/neovim
          ref: 1944cb3201a5e729dbc4b0d614dfd355fd01620f
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Set up interpreter packages
        run: |
          gem install --no-document --bindir "$BIN_DIR" --conservative --pre neovim
          cpanm -n -L .deps/perl5 --skip-satisfied Neovim::Ext || true
      - name: Skip the lookup when GEM_HOME is set
        if: matrix.variant == 'gem-home-guard'
        run: |
          sed -i "s/^if executable('gem')$/if executable('gem') \&\& empty(\$GEM_HOME)/" test/old/testdir/setup.vim
          grep -n "executable('gem')" test/old/testdir/setup.vim
      - run: cmake -S cmake.deps --preset ci -D CMAKE_BUILD_TYPE=Debug && cmake --build .deps
      - run: cmake --preset ci -D CMAKE_BUILD_TYPE=Debug $BUILD_FLAGS && cmake --build build
      - name: oldtest
        run: |
          start=$(date +%s)
          make -C test/old/testdir NVIM_PRG=$(realpath build)/bin/nvim > oldtest.log 2>&1; rc=$?
          echo "OLDTEST ${{ matrix.variant }} $(( $(date +%s) - start )) s rc=$rc"
          tail -15 oldtest.log
          exit $rc
