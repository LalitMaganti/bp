      shell: sh
    - name: Upload buildprof recordings
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: openssl-arm--aarch64-more-cross-compiles-gcs-validation-aarch64-${{ strategy.job-index }}
        path: ${{ runner.temp }}/buildprof/*.buildprof
