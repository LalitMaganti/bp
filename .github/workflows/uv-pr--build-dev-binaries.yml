      with:
        name: uv-linux-armv7-gnueabihf-${{ github.sha }}
        path: './target/armv7-unknown-linux-gnueabihf/no-debug-nightly/uv

          ./target/armv7-unknown-linux-gnueabihf/no-debug-nightly/uvx

          '
        retention-days: 1
    - name: Upload buildprof recordings
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: uv-pr--build-dev-binaries-build-binary-linux-armv7-gnueabihf-${{ strategy.job-index }}
        path: ${{ runner.temp }}/buildprof/*.buildprof
        retention-days: 30
        if-no-files-found: ignore
        compression-level: 0
    permissions:
      contents: read
