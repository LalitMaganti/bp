    - name: Test in Firecracker VM
      uses: acj/freebsd-firecracker-action@ba4f70408ef1d979acdd7bd36fc4b27e06fe5abe
      with:
        verbose: false
        checkout: false
        pre-run: "# The exclude `*` prevents examination of directories so we need to\n# include each parent directory of the binary\ninclude_path=\"$(mktemp)\"\ncat <<EOF > $include_path\ntarget\ntarget/x86_64-unknown-freebsd\ntarget/x86_64-unknown-freebsd/no-debug\ntarget/x86_64-unknown-freebsd/no-debug/uv\nEOF\n\nrsync -r -e \"ssh\" \\\n  --relative \\\n  --copy-links \\\n  --include-from \"$include_path\" \\\n  --exclude \"*\" \\\n  . firecracker:\n"
        run-in-vm: 'mv target/x86_64-unknown-freebsd/no-debug/uv uv

          chmod +x uv

          ./uv --version

          '
