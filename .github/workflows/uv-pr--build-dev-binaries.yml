    - name: Wrap upstream composite actions
      shell: sh
      working-directory: ${{ github.workspace }}
      run: "if [ -n \"$(ls -A \"$RUNNER_TEMP/buildprof-actions\" 2>/dev/null)\" ]; then\n  cp -r \"$RUNNER_TEMP/buildprof-actions/.\" \"./.github/actions/\"\n  (cd \".\" && git ls-files -m .github/actions | xargs -r git update-index --assume-unchanged) 2>/dev/null || true\nfi\n"
    - name: Setup Android NDK
      run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\n# Use ANDROID_NDK_ROOT if set, otherwise find the latest installed NDK\nif [ -z \"${ANDROID_NDK_ROOT}\" ]; then\n  NDK_ROOT=$(ls -d \"${ANDROID_HOME}/ndk/\"* 2>/dev/null | sort -V | tail -n1)\nelse\n  NDK_ROOT=\"${ANDROID_NDK_ROOT}\"\nfi\nTOOLCHAIN=\"${NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64\"\n\necho \"CC_aarch64_linux_android=${TOOLCHAIN}/bin/aarch64-linux-android24-clang\" >> \"$GITHUB_ENV\"\necho \"CXX_aarch64_linux_android=${TOOLCHAIN}/bin/aarch64-linux-android24-clang++\" >> \"$GITHUB_ENV\"\necho \"AR_aarch64_linux_android=${TOOLCHAIN}/bin/llvm-ar\" >> \"$GITHUB_ENV\"\necho \"RANLIB_aarch64_linux_android=${TOOLCHAIN}/bin/llvm-ranlib\" >> \"$GITHUB_ENV\"\necho \"CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${TOOLCHAIN}/bin/aarch64-linux-android24-clang\" >> \"$GITHUB_ENV\"\necho \"CARGO_TARGET_AARCH64_LINUX_ANDROID_RANLIB=${TOOLCHAIN}/bin/llvm-ranlib\" >> \"$GITHUB_ENV\"\n\n# NDK 23+ removed libgcc, provide a stub that redirects to libunwind\nLIBDIR=$(echo \"${TOOLCHAIN}\"/lib/clang/*/lib/linux/aarch64)\nif [ ! -f \"${LIBDIR}/libgcc.a\" ]; then\n  echo 'INPUT(-lunwind)' | sudo tee \"${LIBDIR}/libgcc.a\" > /dev/null\nfi\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Setup-Android-NDK.buildprof\" -- $(command -v bash >/dev/null && echo \"bash --noprofile --norc -eo pipefail\" || echo \"sh -e\") \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
      shell: sh
    - name: Install Rust toolchain
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

