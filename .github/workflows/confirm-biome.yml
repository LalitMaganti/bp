name: 'confirm: biome INSTA_WORKSPACE_ROOT config patch'
on: workflow_dispatch
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, windows-2022]
        mode: [base, patch]
        rep: [1, 2]
    steps:
    - name: Enable Git long paths
      if: matrix.os == 'windows-2022'
      run: git config --system core.longpaths true
    - uses: actions/checkout@v4
      with:
        repository: biomejs/biome
        ref: ec0142bfd45d7260f5241ad291a7c02bd0bfe24e
    - uses: actions/checkout@v4
      with:
        path: .bp
        sparse-checkout: confirm-patches
    - if: matrix.mode == 'patch'
      shell: bash
      run: git apply .bp/confirm-patches/biome.patch && git diff --stat
    - shell: bash
      run: rm -rf .bp
    - uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3
      with:
        bins: cargo-nextest
        cache: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - shell: bash
      run: |
        (lscpu 2>/dev/null | grep -E 'Model name') || powershell -NoProfile -Command "'Model name: ' + (Get-CimInstance Win32_Processor).Name" || true
    - shell: bash
      env:
        CARGO_PROFILE_TEST_DEBUG: ${{ matrix.os == 'windows-2022' && '0' || '' }}
        CARGO_INCREMENTAL: ${{ matrix.os == 'windows-2022' && '0' || '' }}
      run: |
        [ -z "$CARGO_PROFILE_TEST_DEBUG" ] && unset CARGO_PROFILE_TEST_DEBUG CARGO_INCREMENTAL
        echo "INSTA_WORKSPACE_ROOT in env: ${INSTA_WORKSPACE_ROOT:-unset}"
        cargo nextest run --workspace --no-run > build.log 2>&1 || { tail -30 build.log; exit 1; }
        start=$(date +%s); rc=0; cargo nextest run --workspace --no-fail-fast > test.log 2>&1 || rc=$?
        echo "CONFIRM biome ${{ matrix.os }} ${{ matrix.mode }} $(( $(date +%s) - start )) s rc=$rc"
        sed 's/\x1b\[[0-9;]*m//g' test.log | grep -E 'Summary' | tail -1 || true
        exit $rc
