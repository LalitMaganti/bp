name: 'matplotlib: Tests'
'on':
  workflow_dispatch: null
permissions:
  contents: read
env:
  NO_AT_BRIDGE: 1
  OPENBLAS_NUM_THREADS: 1
  PYTHONFAULTHANDLER: 1
jobs:
  test:
    if: "'push' == 'workflow_dispatch' || (\n  'matplotlib/matplotlib' == 'matplotlib/matplotlib' &&\n  !contains(github.event.head_commit.message, '[ci skip]') &&\n  !contains(github.event.head_commit.message, '[skip ci]') &&\n  !contains(github.event.head_commit.message, '[skip github]') &&\n  !contains(github.event.head_commit.message, '[ci doc]')\n)"
    permissions:
      contents: read
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }} ${{ matrix.name-suffix }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - name-suffix: (Minimum Versions)
          os: ubuntu-22.04
          python-version: '3.12'
          extra-requirements: -c ci/minver-requirements.txt
          delete-font-cache: true
          pygobject-ver: <3.52.0
        - os: ubuntu-22.04
          python-version: '3.12'
          CFLAGS: -fno-lto
          extra-requirements: --group test-extra
          pygobject-ver: <3.52.0
        - name-suffix: (Extra TeX packages)
          os: ubuntu-22.04
          python-version: '3.13'
          extra-packages: texlive-fonts-extra texlive-lang-cyrillic
          pygobject-ver: <3.52.0
        - name-suffix: Free-threaded
          os: ubuntu-22.04
          python-version: 3.14t
          pygobject-ver: <3.52.0
        - os: ubuntu-24.04
          python-version: '3.14'
        - name-suffix: Free-threaded
          os: ubuntu-24.04
          python-version: 3.15t
        - os: ubuntu-24.04
          python-version: '3.15'
        - os: ubuntu-24.04-arm
          python-version: '3.12'
    steps:
    - name: Fetch buildprof
      uses: actions/checkout@v4
      with:
        repository: LalitMaganti/bp
        path: .buildprof-fetch
        sparse-checkout: '.buildprof

          projects/matplotlib'
        persist-credentials: false
    - name: Install buildprof
      shell: sh
      working-directory: ${{ github.workspace }}
      run: 'mkdir -p "$RUNNER_TEMP/buildprof-bin" "$RUNNER_TEMP/buildprof-actions"

        cp .buildprof-fetch/.buildprof/buildprof-* "$RUNNER_TEMP/buildprof-bin/" && chmod +x "$RUNNER_TEMP/buildprof-bin/"*

        if [ "$(id -u)" != 0 ] && sudo -n true 2>/dev/null; then sudo setcap cap_sys_ptrace,cap_sys_admin+ep "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)"; fi

        if [ -d .buildprof-fetch/projects/matplotlib/actions ]; then cp -r .buildprof-fetch/projects/matplotlib/actions/. "$RUNNER_TEMP/buildprof-actions/"; fi

        rm -rf .buildprof-fetch

        '
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
        repository: matplotlib/matplotlib
        ref: 98dd0357aa1e6b9fd87148234d34c129167bb1cb
    - name: Wrap upstream composite actions
      shell: sh
      working-directory: ${{ github.workspace }}
      run: "if [ -n \"$(ls -A \"$RUNNER_TEMP/buildprof-actions\" 2>/dev/null)\" ]; then\n  cp -r \"$RUNNER_TEMP/buildprof-actions/.\" \"./.github/actions/\"\n  (cd \".\" && git ls-files -m .github/actions | xargs -r git update-index --assume-unchanged) 2>/dev/null || true\nfi\n"
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
    - name: Install OS dependencies
      run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\ncase \"${{ runner.os }}\" in\nLinux)\n  echo 'Acquire::Retries \"3\";' | sudo tee /etc/apt/apt.conf.d/80-retries\n  sudo apt-get update -yy\n  sudo apt-get install -yy --no-install-recommends \\\n    ccache \\\n    cm-super \\\n    dvipng \\\n    fonts-freefont-otf \\\n    fonts-noto-cjk \\\n    fonts-wqy-zenhei \\\n    gdb \\\n    gir1.2-gtk-3.0 \\\n    gir1.2-gtk-4.0 \\\n    graphviz \\\n    inkscape \\\n    language-pack-de \\\n    lcov \\\n    libcairo2 \\\n    libcairo2-dev \\\n    libffi-dev \\\n    libgeos-dev \\\n    libnotify4 \\\n    libsdl2-2.0-0 \\\n    libxkbcommon-x11-0 \\\n    libxcb-cursor0 \\\n    libxcb-icccm4 \\\n    libxcb-image0 \\\n    libxcb-keysyms1 \\\n    libxcb-randr0 \\\n    libxcb-render-util0 \\\n    libxcb-xinerama0 \\\n    lmodern \\\n    ninja-build \\\n    pkg-config \\\n    qtbase5-dev \\\n    texlive-fonts-recommended \\\n    texlive-latex-base \\\n    texlive-latex-extra \\\n    texlive-latex-recommended \\\n    texlive-luatex \\\n    texlive-pictures \\\n    texlive-xetex \\\n    ${{ matrix.extra-packages }}\n  if [[ \"${{ matrix.name-suffix }}\" != '(Minimum Versions)' ]]; then\n    sudo apt-get install -yy --no-install-recommends ffmpeg poppler-utils\n  fi\n  if [[ \"${{ matrix.os }}\" = ubuntu-22.04 ]]; then\n    sudo apt-get install -yy --no-install-recommends \\\n      libgirepository1.0-dev\n  else  # ubuntu-24.04\n    sudo apt-get install -yy --no-install-recommends \\\n      libgirepository-2.0-dev\n  fi\n  ;;\nmacOS)\n  brew update\n  # Periodically, Homebrew updates Python and fails to overwrite the\n  # existing not-managed-by-Homebrew copy without explicitly being told\n  # to do so. GitHub/Azure continues to avoid fixing their runner images:\n  # https://github.com/actions/runner-images/issues/9966\n  # so force an overwrite even if there are no Python updates.\n  # We don't even care about Homebrew's Python because we use the one\n  # from actions/setup-python.\n  for python_package in $(brew list | grep python@); do\n    brew unlink ${python_package}\n    brew link --overwrite ${python_package}\n  done\n  # Remove the stale openssl@1.1 symlink present in the macOS 15 runner image\n  openssl_link=\"$(brew --prefix)/bin/openssl\"\n  case \"$(readlink \"$openssl_link\" 2>/dev/null)\" in\n      */openssl@1.1/*) rm -f \"$openssl_link\" ;;\n  esac\n  # Workaround for https://github.com/actions/runner-images/issues/10984\n  brew uninstall --ignore-dependencies --force pkg-config@0.29.2\n  brew install ccache ffmpeg ghostscript gobject-introspection gtk4 imagemagick ninja\n  brew install --cask font-noto-sans-cjk font-noto-sans-cjk-sc inkscape\n  ;;\nesac\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Install-OS-dependencies.buildprof\" -- $(command -v bash >/dev/null && echo \"bash --noprofile --norc -eo pipefail\" || echo \"sh -e\") \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
      shell: sh
    - name: Cache pip
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: startsWith(runner.os, 'Linux')
      with:
        path: ~/.cache/pip
        key: '${{ matrix.os }}-py${{ matrix.python-version }}-pip-${{

          hashFiles(''pyproject.toml'', ''ci/minver-requirements.txt'') }}

          '
        restore-keys: '${{ matrix.os }}-py${{ matrix.python-version }}-pip-

          '
    - name: Cache pip
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: startsWith(runner.os, 'macOS')
      with:
        path: ~/Library/Caches/pip
        key: ${{ matrix.os }}-py${{ matrix.python-version }}-pip-${{ hashFiles('pyproject.toml') }}
        restore-keys: '${{ matrix.os }}-py${{ matrix.python-version }}-pip-

          '
    - name: Cache ccache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: '~/.ccache

          '
        key: ${{ matrix.os }}-py${{ matrix.python-version }}-ccache-${{ hashFiles('src/*') }}
        restore-keys: '${{ matrix.os }}-py${{ matrix.python-version }}-ccache-

          '
    - name: Cache Matplotlib
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: '~/.cache/matplotlib

          !~/.cache/matplotlib/tex.cache

          !~/.cache/matplotlib/test_cache

          '
        key: 6-${{ matrix.os }}-py${{ matrix.python-version }}-mpl-${{ 'refs/heads/main' }}-${{ github.sha }}
        restore-keys: '6-${{ matrix.os }}-py${{ matrix.python-version }}-mpl-${{ ''refs/heads/main'' }}-

          6-${{ matrix.os }}-py${{ matrix.python-version }}-mpl-

          '
    - name: Install Python dependencies
      run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\n# Upgrade pip and setuptools and wheel to get as clean an install as\n# possible.\npython -m pip install --upgrade pip setuptools wheel\n\n# Install pre-release versions during our weekly upcoming dependency tests.\nif [[ \"${{ 'push' }}\" == 'schedule'\n      && \"${{ matrix.name-suffix }}\" != '(Minimum Versions)' ]]; then\n  PRE=\"--pre\"\nfi\n\n# Install dependencies from PyPI.\n# Preinstall build requirements to enable no-build-isolation builds.\npython -m pip install --upgrade $PRE --prefer-binary \\\n  --group build --group test ${{ matrix.extra-requirements }}\n\n# Install optional dependencies from PyPI.\n# Sphinx is needed to run sphinxext tests\npython -m pip install --upgrade sphinx!=6.1.2\n\nif [[ \"${{ matrix.python-version }}\" != 3.*t && \"${{ matrix.python-version }}\" != 3.15 ]]; then\n# GUI toolkits are pip-installable only for some versions of Python\n# so don't fail if we can't install them.  Make it easier to check\n# whether the install was successful by trying to import the toolkit\n# (sometimes, the install appears to be successful but shared\n# libraries cannot be loaded at runtime, so an actual import is a\n# better check).\npython -m pip install --upgrade pycairo 'cairocffi>=0.8' 'PyGObject${{ matrix.pygobject-ver }}' &&\n  (\n    python -c 'import gi; gi.require_version(\"Gtk\", \"4.0\"); from gi.repository import Gtk' &&\n    echo 'PyGObject 4 is available' || echo 'PyGObject 4 is not available'\n  ) && (\n    python -c 'import gi; gi.require_version(\"Gtk\", \"3.0\"); from gi.repository import Gtk' &&\n    echo 'PyGObject 3 is available' || echo 'PyGObject 3 is not available'\n  )\n\n# PyQt5 does not have any wheels for ARM on Linux.\nif [[ \"${{ matrix.os }}\" != 'ubuntu-24.04-arm' ]]; then\n  python -mpip install --upgrade --only-binary :all: pyqt5 &&\n    python -c 'import PyQt5.QtCore' &&\n    echo 'PyQt5 is available' ||\n    echo 'PyQt5 is not available'\nfi\npython -mpip install --upgrade --only-binary :all: pyqt6 &&\n  python -c 'import PyQt6.QtCore' &&\n  echo 'PyQt6 is available' ||\n  echo 'PyQt6 is not available'\npython -mpip install --upgrade --only-binary :all: pyside6 &&\n  python -c 'import PySide6.QtCore' &&\n  echo 'PySide6 is available' ||\n  echo 'PySide6 is not available'\n\npython -mpip install --upgrade --only-binary :all: \\\n  -f \"https://extras.wxpython.org/wxPython4/extras/linux/gtk3/${{ matrix.os }}\" \\\n  wxPython &&\n  python -c 'import wx' &&\n  echo 'wxPython is available' ||\n  echo 'wxPython is not available'\n\nfi  # Skip backends on Python 3.*t.\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Install-Python-dependencies.buildprof\" -- $(command -v bash >/dev/null && echo \"bash --noprofile --norc -eo pipefail\" || echo \"sh -e\") \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
      shell: sh
    - name: Install the nightly dependencies
      if: '''push'' == ''schedule'' && matrix.name-suffix != ''(Minimum Versions)'''
      run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\npython -m pip install pytz tzdata  # Must be installed for Pandas.\npython -m pip install \\\n  --index-url https://pypi.anaconda.org/scientific-python-nightly-wheels/simple \\\n  --upgrade --only-binary=:all: numpy pandas\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Install-the-nightly-dependencies.buildprof\" -- $(command -v bash >/dev/null && echo \"bash --noprofile --norc -eo pipefail\" || echo \"sh -e\") \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
      shell: sh
    - name: Install Matplotlib
      run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\nccache -s\ngit describe\n\n# Set flag in a delayed manner to avoid issues with installing other\n# packages\nif [[ \"${{ runner.os }}\" == 'macOS' ]]; then\n  export CPPFLAGS='-fprofile-instr-generate=default.%m.profraw'\n  export CPPFLAGS=\"$CPPFLAGS -fcoverage-mapping\"\nelse\n  export CPPFLAGS='--coverage -fprofile-abs-path -fprofile-update=prefer-atomic'\nfi\n\npython -m pip install --no-deps --no-build-isolation --verbose \\\n  --config-settings=setup-args=\"-DrcParams-backend=Agg\" \\\n  --editable .[dev]\n\nif [[ \"${{ runner.os }}\" != 'macOS' ]]; then\n  unset CPPFLAGS\nfi\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Install-Matplotlib.buildprof\" -- $(command -v bash >/dev/null && echo \"bash --noprofile --norc -eo pipefail\" || echo \"sh -e\") \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
      shell: sh
    - name: Clear font cache
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        rm -rf ~/.cache/matplotlib

        BUILDPROF_SCRIPT_EOF

        ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

        bp_rc=0

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Clear-font-cache.buildprof" -- $(command -v bash >/dev/null && echo "bash --noprofile --norc -eo pipefail" || echo "sh -e") "$bp_dir/$bp_id.sh" || bp_rc=$?

        kill $bp_watch 2>/dev/null; exit $bp_rc

        '
      if: matrix.delete-font-cache
      shell: sh
    - name: Run pytest
      run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\nif [[ \"${{ matrix.python-version }}\" == 3.*t ]]; then\n  export PYTHON_GIL=0\nfi\nif [[ \"${{ matrix.python-version }}\" == 3.15* ]]; then\n  export PYTEST_ADDOPTS=\"-k 'not test_backends_interactive'\"\nfi\npytest -rfEsXR -n auto \\\n  --maxfail=50 --timeout=300 --durations=25 \\\n  --cov-report=xml --cov=lib --log-level=DEBUG --color=yes\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Run-pytest.buildprof\" -- $(command -v bash >/dev/null && echo \"bash --noprofile --norc -eo pipefail\" || echo \"sh -e\") \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
      shell: sh
    - name: Cleanup non-failed image files
      if: failure()
      run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\nfind ./result_images -name \"*-expected*.png\" | while read file; do\n  if [[ $file == *-expected_???.png ]]; then\n    extension=${file: -7:3}\n    base=${file%*-expected_$extension.png}_$extension\n  else\n    extension=\"png\"\n    base=${file%-expected.png}\n  fi\n  if [[ ! -e ${base}-failed-diff.png ]]; then\n    indent=\"\"\n    list=($file $base.png)\n    if [[ $extension != \"png\" ]]; then\n      list+=(${base%_$extension}-expected.$extension ${base%_$extension}.$extension)\n    fi\n    for to_remove in \"${list[@]}\"; do\n      if [[ -e $to_remove ]]; then\n        rm $to_remove\n        echo \"${indent}Removed $to_remove\"\n      fi\n      indent+=\" \"\n    done\n  fi\ndone\n\nif [ \"$(find ./result_images -mindepth 1 -type d)\" ]; then\n    find ./result_images/* -type d -empty -delete\nfi\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Cleanup-non-failed-image-files.buildprof\" -- $(command -v bash >/dev/null && echo \"bash --noprofile --norc -eo pipefail\" || echo \"sh -e\") \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
      shell: sh
    - name: Filter C coverage
      if: ${{ !cancelled() && 'push' != 'schedule' }}
      run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\nif [[ \"${{ runner.os }}\" != 'macOS' ]]; then\n  LCOV_IGNORE_ERRORS=','  # do not ignore any lcov errors by default\n  if [[ \"${{ matrix.os }}\" = ubuntu-24.04 || \"${{ matrix.os }}\" = ubuntu-24.04-arm ]]; then\n    # filter mismatch errors detected by lcov 2.x\n    LCOV_IGNORE_ERRORS='mismatch'\n  fi\n  lcov --rc lcov_branch_coverage=1 --ignore-errors $LCOV_IGNORE_ERRORS \\\n    --capture --directory . --exclude $PWD/subprojects --exclude $PWD/build \\\n    --output-file coverage.info\n  lcov --rc lcov_branch_coverage=1 --ignore-errors $LCOV_IGNORE_ERRORS \\\n    --output-file coverage.info --extract coverage.info $PWD/src/'*'\n  lcov --rc lcov_branch_coverage=1 --ignore-errors $LCOV_IGNORE_ERRORS \\\n    --list coverage.info\n  find . -name '*.gc*' -delete\nelse\n  xcrun llvm-profdata merge -sparse default.*.profraw \\\n    -o default.profdata\n  xcrun llvm-cov export -format=\"lcov\" build/*/src/*.so \\\n    -instr-profile default.profdata > info.lcov\nfi\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Filter-C-coverage.buildprof\" -- $(command -v bash >/dev/null && echo \"bash --noprofile --norc -eo pipefail\" || echo \"sh -e\") \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
      shell: sh
    - name: Upload macOS crash logs
      if: failure() && runner.os == 'macOS'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: macos-crash-logs
        path: ~/Library/Logs/DiagnosticReports/*
    - name: Upload code coverage
      if: ${{ !cancelled() && 'push' != 'schedule' }}
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
      with:
        name: ${{ matrix.python-version }} ${{ matrix.os }} ${{ matrix.name-suffix }}
        token: ${{ secrets.CODECOV_TOKEN }}
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: failure()
      with:
        name: ${{ matrix.python-version }} ${{ matrix.os }} ${{ matrix.name-suffix }} result images
        path: ./result_images
    - name: Upload buildprof recordings
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: matplotlib--tests-test-${{ strategy.job-index }}
        path: ${{ runner.temp }}/buildprof/*.buildprof
        retention-days: 30
        if-no-files-found: ignore
        compression-level: 0
    timeout-minutes: 120
  create-issue:
    if: ${{ failure() && 'push' == 'schedule' }}
    needs:
    - test
    permissions:
      contents: read
    runs-on: ubuntu-latest
    name: Create issue on failure
    steps:
    - name: Fetch buildprof
      uses: actions/checkout@v4
      with:
        repository: LalitMaganti/bp
        path: .buildprof-fetch
        sparse-checkout: '.buildprof

          projects/matplotlib'
        persist-credentials: false
    - name: Install buildprof
      shell: sh
      working-directory: ${{ github.workspace }}
      run: 'mkdir -p "$RUNNER_TEMP/buildprof-bin" "$RUNNER_TEMP/buildprof-actions"

        cp .buildprof-fetch/.buildprof/buildprof-* "$RUNNER_TEMP/buildprof-bin/" && chmod +x "$RUNNER_TEMP/buildprof-bin/"*

        if [ "$(id -u)" != 0 ] && sudo -n true 2>/dev/null; then sudo setcap cap_sys_ptrace,cap_sys_admin+ep "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)"; fi

        if [ -d .buildprof-fetch/projects/matplotlib/actions ]; then cp -r .buildprof-fetch/projects/matplotlib/actions/. "$RUNNER_TEMP/buildprof-actions/"; fi

        rm -rf .buildprof-fetch

        '
    - name: Create issue on failure
      uses: imjohnbo/issue-bot@3188c6ce06249206709d3b1f274d0d4c5a521601
      with:
        title: '[TST] Upcoming dependency test failures'
        body: 'The weekly build with nightly wheels from numpy and pandas

          has failed. Check the logs for any updates that need to be

          made in matplotlib.

          https://github.com/${{''matplotlib/matplotlib''}}/actions/runs/${{github.run_id}}

          '
        pinned: false
        close-previous: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Upload buildprof recordings
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: matplotlib--tests-create-issue-${{ strategy.job-index }}
        path: ${{ runner.temp }}/buildprof/*.buildprof
        retention-days: 30
        if-no-files-found: ignore
        compression-level: 0
    timeout-minutes: 120
