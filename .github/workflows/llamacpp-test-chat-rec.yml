name: 'llama.cpp: recorded builds with test-chat.cpp at -O1 vs -O0'
on:
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        opt: [O1, O0]
        rep: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          path: survey
          persist-credentials: false
          sparse-checkout: .buildprof
      - run: lscpu | grep -E 'Model name|^CPU\(s\)'
      - uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          path: src
          ref: 8baabd53b77d1c48c6ef8d3b620436292f3f6231
          persist-credentials: false
      - run: |
          sudo apt-get update > /dev/null
          sudo apt-get install -y --no-install-recommends python3 python3-pip python3-dev python3-wheel libjpeg-dev build-essential libssl-dev git-lfs > /dev/null
      - name: Compile test-chat.cpp at a lower optimisation level
        if: matrix.opt != 'default'
        run: |
          cd src && sed -i 's#^    target_link_libraries(test-chat PRIVATE server-context)#&\n    set_source_files_properties(test-chat.cpp PROPERTIES COMPILE_OPTIONS -${{ matrix.opt }})#' tests/CMakeLists.txt
          sed -n 188,194p tests/CMakeLists.txt
      - name: Build
        run: |
          cd src && cmake -B build -DGGML_NATIVE=OFF -DLLAMA_FATAL_WARNINGS=ON -DGGML_RPC=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON > /dev/null
          grep -o '"command": "[^"]*test-chat.cpp"' build/compile_commands.json | grep -o ' -O[0-3]' | tr '\n' ' '; echo
          start=$(date +%s)
          $GITHUB_WORKSPACE/survey/.buildprof/buildprof-x86_64 --no-open -o $RUNNER_TEMP/build-${{ matrix.opt }}-${{ matrix.rep }}.buildprof -- cmake --build build --config Release -j $(nproc) > build.log 2>&1 || { tail -40 build.log; exit 1; }
          echo "BUILD ${{ matrix.opt }} $(( $(date +%s) - start )) s"
      - uses: actions/upload-artifact@v4
        with:
          name: llama-${{ matrix.opt }}-${{ matrix.rep }}
          path: ${{ runner.temp }}/*.buildprof
