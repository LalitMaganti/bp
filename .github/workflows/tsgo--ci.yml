    permissions:
      contents: read
    timeout-minutes: 120
  test:
    strategy:
      fail-fast: ${{ 'push' == 'merge_group' }}
      matrix:
        config:
        - os: ubuntu-latest
          coverage: true
          main: true
        - os: ubuntu-latest
          name: no submodules
          no-submodules: true
        - os: TypeScript-1ES-GitHub-XL-2
          name: race mode
          race: true
          skip: ${{ 'push' == 'merge_group' || 'microsoft/typescript-go' != 'microsoft/typescript-go' }}
        - os: ubuntu-latest
          name: noembed
          noembed: true
        - os: ubuntu-latest
          name: concurrent test programs
          concurrent-test-programs: true
          coverage: true
        exclude:
        - config:
            skip: true
    name: test (${{ matrix.config.name || matrix.config.os }})
    runs-on: ${{ matrix.config.os }}
    permissions:
      contents: read
    env:
      TSGO_HEREBY_RACE: ${{ (matrix.config.race && 'true') || 'false' }}
      TSGO_HEREBY_NOEMBED: ${{ (matrix.config.noembed && 'true') || 'false' }}
      TSGO_HEREBY_CONCURRENT_TEST_PROGRAMS: ${{ (matrix.config.concurrent-test-programs && 'true') || 'false' }}
      TSGO_HEREBY_COVERAGE: ${{ (matrix.config.coverage && 'true') || 'false' }}
