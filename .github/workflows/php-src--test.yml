name: 'php-src: Test'
'on':
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  GENERATE_MATRIX:
    name: Generate Matrix
    if: '''php/php-src'' == ''php/php-src'' || ''push'' == ''pull_request'' || ''push'' == ''workflow_dispatch'''
    runs-on: ubuntu-latest
    outputs:
      all_variations: ${{ steps.set-matrix.outputs.all_variations }}
      branches: ${{ steps.set-matrix.outputs.branches }}
    steps:
    - name: Fetch buildprof
      uses: actions/checkout@v4
      with:
        repository: LalitMaganti/buildprof-ci-survey
        path: .buildprof-fetch
        sparse-checkout: '.buildprof

          projects/php-src'
        persist-credentials: false
    - name: Install buildprof
      shell: sh
      run: 'mkdir -p "$RUNNER_TEMP/buildprof-bin" "$RUNNER_TEMP/buildprof-actions"

        cp .buildprof-fetch/.buildprof/buildprof-* "$RUNNER_TEMP/buildprof-bin/" && chmod +x "$RUNNER_TEMP/buildprof-bin/"*

        if [ -d .buildprof-fetch/projects/php-src/actions ]; then cp -r .buildprof-fetch/projects/php-src/actions/. "$RUNNER_TEMP/buildprof-actions/"; fi

        rm -rf .buildprof-fetch

        '
    - uses: actions/checkout@v6
      with:
        fetch-depth: ${{ ('push' == 'schedule' || 'push' == 'workflow_dispatch') && '0' || '1' }}
        repository: php/php-src
        ref: a17dcadd4cf50b34b3fcc53c37126d1de25f868c
    - name: Wrap upstream composite actions
      shell: sh
      run: 'if [ -n "$(ls -A "$RUNNER_TEMP/buildprof-actions" 2>/dev/null)" ]; then cp -r "$RUNNER_TEMP/buildprof-actions/." "./.github/actions/"; fi

        '
    - name: Grab the commit mapping
      if: ${{ 'push' == 'schedule' || 'push' == 'workflow_dispatch' }}
      uses: actions/cache@v5
      with:
        path: branch-commit-cache.json
        key: nightly-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: 'nightly-

          '
    - name: Generate Matrix
      id: set-matrix
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s%N)

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        php .github/matrix.php "${{ ''push'' }}" "${{ github.run_attempt }}" "${{ ''push'' == ''pull_request'' && ''refs/heads/master'' || ''master'' }}" ''${{ toJSON(github.event.pull_request.labels) }}'' "${{ ''php/php-src'' }}"

        BUILDPROF_SCRIPT_EOF

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open -o "$bp_dir/$bp_id-Generate-Matrix.buildprof" -- bash --noprofile --norc -eo pipefail "$bp_dir/$bp_id.sh"

        '
      shell: sh
    - name: Upload buildprof recordings
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: php-src--test-GENERATE_MATRIX-${{ strategy.job-index }}
        path: ${{ runner.temp }}/buildprof/*.buildprof
        retention-days: 30
        if-no-files-found: ignore
        compression-level: 0
    permissions:
      contents: read
  TEST:
    needs: GENERATE_MATRIX
    if: ${{ needs.GENERATE_MATRIX.outputs.branches != '[]' }}
    name: ${{ matrix.branch.name }}
    uses: ./.github/workflows/php-src--test-suite.yml
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJson(needs.GENERATE_MATRIX.outputs.branches) }}
    with:
      all_variations: ${{ needs.GENERATE_MATRIX.outputs.all_variations == 'true' }}
      branch: ${{ toJSON(matrix.branch) }}
    secrets: inherit
