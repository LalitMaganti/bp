    - name: Install Rust ${{ env.rust_stable }}
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ env.rust_stable }}
    - name: Install cargo-spellcheck
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-spellcheck
    - uses: actions/checkout@v7
      with:
        repository: tokio-rs/tokio
        ref: ce685ee6916549ed7e52dbfd5430858bbdc734d3
    - name: Wrap upstream composite actions
      shell: sh
      working-directory: ${{ github.workspace }}
      run: "if [ -n \"$(ls -A \"$RUNNER_TEMP/buildprof-actions\" 2>/dev/null)\" ]; then\n  cp -r \"$RUNNER_TEMP/buildprof-actions/.\" \"./.github/actions/\"\n  (cd \".\" && git ls-files -m .github/actions | xargs -r git update-index --assume-unchanged) 2>/dev/null || true\nfi\n"
    - name: Make sure dictionary words are sorted and unique
      run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\nFILE=\"spellcheck.dic\"\n\n# Verify the first line is an integer.\nfirst_line=$(head -n 1 \"$FILE\")\nif ! [[ \"$first_line\" =~ ^[0-9]+$ ]]; then\n  echo \"Error: The first line of $FILE must be an integer, but got: '$first_line'\"\n  exit 1\nfi\nexpected_count=\"$first_line\"\n\n# Check that the number of lines matches the integer.\n# xargs (with no arguments) will strip leading/trailing whitespacefrom wc's output.\nactual_count=$(sed '1d' \"$FILE\" | wc -l | xargs)\nif [ \"$expected_count\" -ne \"$actual_count\" ]; then\n  echo \"Error: The number of lines ($actual_count) does not match $expected_count.\"\n  exit 1\nfi\n\n# `sed` removes the first line (number of words).\n#\n# `sort` makes sure everything in between is sorted\n# and contains no duplicates.\n#\n# Since `sort` is sensitive to locale, we set it\n# using LC_ALL to en_US.UTF8 to be consistent in different\n# environments.\n\n(\n  sed '1d' $FILE | LC_ALL=en_US.UTF8 sort -uc\n) || {\n  echo \"Dictionary is not in sorted order. Correct order is:\"\n  LC_ALL=en_US.UTF8 sort -u <(sed '1d' $FILE)\n  false\n}\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Make-sure-dictionary-words-are-sorted-an.buildprof\" -- $(command -v bash >/dev/null && echo \"bash --noprofile --norc -eo pipefail\" || echo \"sh -e\") \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
      shell: sh
    - name: Run cargo-spellcheck
      run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\nif ! cargo spellcheck --code 1\nthen\n    echo ''\n    echo ''\n    echo 'If this is a Rust method/type/variable name, then you should'\n    echo 'enclose it in backticks like this: `MyRustType`.'\n    echo ''\n    echo 'If this is a real word, then you can add it to spellcheck.dic'\n    exit 1\nfi\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Run-cargo-spellcheck.buildprof\" -- $(command -v bash >/dev/null && echo \"bash --noprofile --norc -eo pipefail\" || echo \"sh -e\") \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
      shell: sh
    - name: Detect trailing whitespace
      run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\nif grep --exclude-dir=.git --exclude-dir=target -rne '\\s$' .\nthen\n    echo ''\n    echo 'Please remove trailing whitespace from these lines.'\n    exit 1\nfi\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Detect-trailing-whitespace.buildprof\" -- $(command -v bash >/dev/null && echo \"bash --noprofile --norc -eo pipefail\" || echo \"sh -e\") \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
      shell: sh
    - name: Upload buildprof recordings
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: tokio--ci-check-spelling-${{ strategy.job-index }}
        path: ${{ runner.temp }}/buildprof/*.buildprof
        retention-days: 30
        if-no-files-found: ignore
