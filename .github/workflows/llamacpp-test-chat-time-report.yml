name: 'llama.cpp: test-chat.cpp under GCC 11 with -fno-tree-pta'
on:
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: 8baabd53b77d1c48c6ef8d3b620436292f3f6231
          persist-credentials: false
      - run: lscpu | grep -E 'Model name|^CPU\(s\)'
      - run: sudo apt-get update > /dev/null && sudo apt-get install -y g++-11 g++-13 libssl-dev > /dev/null
      - name: Configure once, as CI does
        run: cmake -B build -DGGML_NATIVE=OFF -DLLAMA_FATAL_WARNINGS=ON -DGGML_RPC=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON > /dev/null
      - name: Compile test-chat.cpp with each GCC and level
        run: |
          python3 - <<'PY' > cmd.sh
          import json
          for e in json.load(open('build/compile_commands.json')):
              if e['file'].endswith('tests/test-chat.cpp'):
                  print(e['command'])
          PY
          cmd=$(cat cmd.sh)
          for flags in "" "-fno-tree-pta"; do
            c=$(echo "$cmd" | sed "s#^[^ ]*#g++-11#; s# -o [^ ]*# -o /tmp/tc.o $flags#")
            start=$(date +%s.%N)
            (cd build && bash -c "$c") > /dev/null 2>&1 || echo "failed: $flags"
            echo "GCC11 -O3 $flags: $(echo "$(date +%s.%N) - $start" | bc | cut -c1-6) s"
          done
      - name: test-chat built by GCC 11 with -fno-tree-pta still passes
        run: |
          sed -i 's#^    target_link_libraries(test-chat PRIVATE server-context)#&\n    set_source_files_properties(test-chat.cpp PROPERTIES COMPILE_OPTIONS -fno-tree-pta)#' tests/CMakeLists.txt
          rm -rf build && CC=gcc-11 CXX=g++-11 cmake -B build -DGGML_NATIVE=OFF -DGGML_RPC=ON > /dev/null
          cmake --build build --target test-chat -j $(nproc) > /dev/null 2>&1
          cd build && ctest -R '^test-chat$' --timeout 900 --output-on-failure > ctest.log 2>&1; rc=$?; tail -3 ctest.log; exit $rc
