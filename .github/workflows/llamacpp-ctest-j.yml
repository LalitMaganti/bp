name: 'llama.cpp: ctest serial vs ctest -j on the same build'
on:
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  ctest:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: 8baabd53b77d1c48c6ef8d3b620436292f3f6231
          persist-credentials: false
      - run: |
          sudo apt-get update > /dev/null
          sudo apt-get install -y --no-install-recommends python3 python3-pip python3-dev python3-wheel libjpeg-dev build-essential libssl-dev git-lfs > /dev/null
      - run: |
          export PIP_BREAK_SYSTEM_PACKAGES="1"
          python3 -m pip install -q --upgrade pip setuptools
          pip3 install -q ./gguf-py jinja2==3.1.6
      - run: |
          cmake -B build -DGGML_NATIVE=OFF -DLLAMA_FATAL_WARNINGS=ON -DGGML_RPC=ON > /dev/null
          time cmake --build build --config Release -j $(nproc) > /dev/null
      - name: ctest four times, alternating
        run: |
          cd build
          for mode in serial parallel serial parallel; do
            if [ $mode = serial ]; then j=""; else j="-j $(nproc)"; fi
            start=$(date +%s.%N)
            ctest -L 'main|python' --timeout 900 $j > ctest-$mode.log 2>&1; rc=$?
            echo "CTEST $mode $(echo "$(date +%s.%N) - $start" | bc) rc=$rc $(grep -E 'tests passed' ctest-$mode.log)"
          done
