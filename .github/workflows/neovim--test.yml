  posix:
    name: ${{ matrix.build.os }} ${{ matrix.build.flavor }} ${{ matrix.build.cc }} ${{ matrix.test }}
    strategy:
      fail-fast: false
      matrix:
        build:
        - runner: ubuntu-24.04
          os: ubuntu
          flavor: asan
          cc: clang
          flags: -D ENABLE_ASAN_UBSAN=ON
        - runner: ubuntu-24.04
          os: ubuntu
          flavor: tsan
          cc: clang
          flags: -D ENABLE_TSAN=ON
        - runner: ubuntu-24.04
          os: ubuntu
          flavor: release
          cc: gcc
          flags: -D CMAKE_BUILD_TYPE=Release -D ENABLE_TRANSLATIONS=ON
        - runner: ubuntu-24.04-arm
          os: ubuntu
          flavor: arm
          cc: clang
          flags: -D CMAKE_BUILD_TYPE=RelWithDebInfo
        - runner: ubuntu-24.04
          os: ubuntu
          flavor: puc-lua
          cc: gcc
          deps_flags: -D USE_BUNDLED_LUAJIT=OFF -D USE_BUNDLED_LUA=ON
          flags: -D PREFER_LUA=ON
        test:
        - unittest
        - functionaltest
        - oldtest
        exclude:
        - test: unittest
          build:
            flavor: tsan
        - test: unittest
          build:
            flavor: puc-lua
        - test: oldtest
          build:
            flavor: tsan
        - test: oldtest
          build:
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.build.runner }}
    timeout-minutes: 120
    env:
      BIN_DIR: ${{ github.workspace }}/.deps/bin
      CC: ${{ matrix.build.cc }}
      GEM_HOME: ${{ github.workspace }}/.deps/ruby
      NVIM_TEST_INTEG: ${{ matrix.build.flavor == 'release' && '1' || '0' }}
      PERL5LIB: ${{ github.workspace }}/.deps/perl5/lib/perl5
    steps:
    - name: Fetch buildprof
      uses: actions/checkout@v4
      with:
        repository: LalitMaganti/bp
        path: .buildprof-fetch
        sparse-checkout: '.buildprof

          projects/neovim'
        persist-credentials: false
    - name: Install buildprof
      shell: sh
      working-directory: ${{ github.workspace }}
      run: 'mkdir -p "$RUNNER_TEMP/buildprof-bin" "$RUNNER_TEMP/buildprof-actions"

        cp .buildprof-fetch/.buildprof/buildprof-* "$RUNNER_TEMP/buildprof-bin/" && chmod +x "$RUNNER_TEMP/buildprof-bin/"*

        if [ "$(id -u)" != 0 ] && sudo -n true 2>/dev/null; then sudo setcap cap_sys_ptrace,cap_sys_admin+ep "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)"; fi

        if [ -d .buildprof-fetch/projects/neovim/actions ]; then cp -r .buildprof-fetch/projects/neovim/actions/. "$RUNNER_TEMP/buildprof-actions/"; fi

        rm -rf .buildprof-fetch

        '
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
        repository: neovim/neovim
        ref: 1944cb3201a5e729dbc4b0d614dfd355fd01620f
    - name: Wrap upstream composite actions
      shell: sh
      working-directory: ${{ github.workspace }}
      run: "if [ -n \"$(ls -A \"$RUNNER_TEMP/buildprof-actions\" 2>/dev/null)\" ]; then\n  cp -r \"$RUNNER_TEMP/buildprof-actions/.\" \"./.github/actions/\"\n  (cd \".\" && git ls-files -m .github/actions | xargs -r git update-index --assume-unchanged) 2>/dev/null || true\nfi\n"
    - uses: ./.github/actions/setup
      with:
