    name: CIFuzz${{ '' }}
    needs: build-context
    if: needs.build-context.outputs.run-ci-fuzz == 'true' || needs.build-context.outputs.run-ci-fuzz-stdlib == 'true'
    strategy:
      fail-fast: false
      matrix:
        sanitizer:
        - address
        oss-fuzz-project-name:
        - cpython3
        - python3-libraries
        include:
        - sanitizer: undefined
          oss-fuzz-project-name: cpython3
        - sanitizer: memory
          oss-fuzz-project-name: cpython3
        exclude:
        - oss-fuzz-project-name: "${{\n  needs.build-context.outputs.run-ci-fuzz == 'true'\n  && 'no-exclude'\n  || 'cpython3'\n}}"
        - oss-fuzz-project-name: "${{\n  needs.build-context.outputs.run-ci-fuzz-stdlib == 'true'\n  && 'no-exclude'\n  || 'python3-libraries'\n}}"
    uses: ./.github/workflows/cpython--reusable-cifuzz.yml
    with:
      oss-fuzz-project-name: ${{ matrix.oss-fuzz-project-name }}
      sanitizer: ${{ matrix.sanitizer }}
