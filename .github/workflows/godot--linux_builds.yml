name: 'godot: 🐧 Linux Builds'
'on':
  workflow_dispatch: null
permissions:
  contents: read
env:
  SCONS_FLAGS: dev_mode=yes module_text_server_fb_enabled=yes
  GODOT_CPP_BRANCH: 4.5
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  ASAN_OPTIONS: color=always:print_suppressions=1:suppressions=${{ github.workspace }}/misc/error_suppressions/asan.txt:alloc_dealloc_mismatch=0
  LSAN_OPTIONS: color=always:print_suppressions=1:suppressions=${{ github.workspace }}/misc/error_suppressions/lsan.txt
  TSAN_OPTIONS: color=always:print_suppressions=1:suppressions=${{ github.workspace }}/misc/error_suppressions/tsan.txt
  UBSAN_OPTIONS: color=always:print_suppressions=1:suppressions=${{ github.workspace }}/misc/error_suppressions/ubsan.txt
jobs:
  build-linux:
    runs-on: ubuntu-24.04
    name: ${{ matrix.name }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: Editor w/ Mono (target=editor)
          cache-name: linux-editor-mono
          target: editor
          scons-flags: module_mono_enabled=yes compiledb=yes
          bin: ./bin/godot.linuxbsd.editor.x86_64.mono
          build-mono: true
          doc-test: true
          proj-conv: true
          proj-export: true
          api-compat: true
          artifact: true
          godot-cpp: true
          clangd-tidy: true
        - name: Editor with doubles and GCC sanitizers (target=editor, dev_build=yes, scu_build=yes, precision=double, use_asan=yes, use_ubsan=yes, linker=mold)
          cache-name: linux-editor-double-sanitizers
          target: editor
          scons-flags: dev_build=yes scu_build=yes debug_symbols=no precision=double use_asan=yes use_ubsan=yes linker=mold
          bin: ./bin/godot.linuxbsd.editor.dev.double.x86_64.san
          install-mold: true
          proj-test: true
          free-space: true
        - name: Editor with clang sanitizers (target=editor, dev_build=yes, use_asan=yes, use_ubsan=yes, use_llvm=yes, linker=lld)
          cache-name: linux-editor-llvm-sanitizers
          target: editor
          scons-flags: dev_build=yes use_asan=yes use_ubsan=yes use_llvm=yes linker=lld
          bin: ./bin/godot.linuxbsd.editor.dev.x86_64.llvm.san
          legacy-scons: true
          free-space: true
        - name: Editor with ThreadSanitizer (target=editor, dev_build=yes, use_tsan=yes, use_llvm=yes, linker=lld)
          cache-name: linux-editor-thread-sanitizer
          target: editor
          scons-flags: dev_build=yes use_tsan=yes use_llvm=yes linker=lld
          bin: ./bin/godot.linuxbsd.editor.dev.x86_64.llvm.san
          free-space: true
        - name: Template w/ Mono, release (target=template_release)
          cache-name: linux-template-mono
          target: template_release
          scons-flags: module_mono_enabled=yes
          bin: ./bin/godot.linuxbsd.template_release.x86_64.mono
          artifact: true
        - name: Template w/ Mono, debug (target=template_debug)
          cache-name: linux-template-mono-debug
          target: template_debug
          scons-flags: module_mono_enabled=yes
          bin: ./bin/godot.linuxbsd.template_debug.x86_64.mono
          artifact: true
        - name: Minimal template (target=template_release, everything disabled)
          cache-name: linux-template-minimal
          target: template_release
          scons-flags: modules_enabled_by_default=no module_text_server_fb_enabled=no disable_3d=yes disable_advanced_gui=yes disable_physics_2d=yes disable_physics_3d=yes deprecated=no minizip=no brotli=no
          bin: ./bin/godot.linuxbsd.template_release.x86_64
          artifact: true
    steps:
    - name: Fetch buildprof
      uses: actions/checkout@v4
      with:
        repository: LalitMaganti/bp
        path: .buildprof-fetch
        sparse-checkout: '.buildprof

          projects/godot'
        persist-credentials: false
    - name: Install buildprof
      shell: sh
      working-directory: ${{ github.workspace }}
      run: 'mkdir -p "$RUNNER_TEMP/buildprof-bin" "$RUNNER_TEMP/buildprof-actions"

        cp .buildprof-fetch/.buildprof/buildprof-* "$RUNNER_TEMP/buildprof-bin/" && chmod +x "$RUNNER_TEMP/buildprof-bin/"*

        if [ "$(id -u)" != 0 ] && sudo -n true 2>/dev/null; then sudo setcap cap_sys_ptrace,cap_sys_admin+ep "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)"; fi

        if [ -d .buildprof-fetch/projects/godot/actions ]; then cp -r .buildprof-fetch/projects/godot/actions/. "$RUNNER_TEMP/buildprof-actions/"; fi

        rm -rf .buildprof-fetch

        '
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive
        repository: godotengine/godot
        ref: 679066724352c12673001d692d41dc2dab9314c0
    - name: Wrap upstream composite actions
      shell: sh
      working-directory: ${{ github.workspace }}
      run: "if [ -n \"$(ls -A \"$RUNNER_TEMP/buildprof-actions\" 2>/dev/null)\" ]; then\n  cp -r \"$RUNNER_TEMP/buildprof-actions/.\" \"./.github/actions/\"\n  (cd \".\" && git ls-files -m .github/actions | xargs -r git update-index --assume-unchanged) 2>/dev/null || true\nfi\n"
    - name: Setup dependencies
      run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\nsudo apt-get update\nsudo apt-get install libwayland-bin  # TODO: Figure out somehow how to embed this one.\nif [ \"${{ matrix.proj-test }}\" == \"true\" -o \"${{ matrix.proj-export }}\" == \"true\" ]; then\n  sudo apt-get install mesa-vulkan-drivers\nfi\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Setup-dependencies.buildprof\" -- $(command -v bash >/dev/null && echo \"bash --noprofile --norc -eo pipefail\" || echo \"sh -e\") \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
      shell: sh
    - name: Free disk space on runner
      if: matrix.free-space
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        echo "Disk usage before:" && df -h

        sudo rm -rf /usr/local/lib/android

        echo "Disk usage after:" && df -h

        BUILDPROF_SCRIPT_EOF

        ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

        bp_rc=0

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Free-disk-space-on-runner.buildprof" -- $(command -v bash >/dev/null && echo "bash --noprofile --norc -eo pipefail" || echo "sh -e") "$bp_dir/$bp_id.sh" || bp_rc=$?

        kill $bp_watch 2>/dev/null; exit $bp_rc

        '
      shell: sh
    - name: Restore Godot build cache
      uses: ./.github/actions/godot-cache-restore
      with:
        cache-name: ${{ matrix.cache-name }}
      continue-on-error: true
    - name: Setup Python and SCons
      if: '!matrix.legacy-scons'
      uses: ./.github/actions/godot-deps
    - name: Setup Python and SCons (legacy versions)
      if: matrix.legacy-scons
      uses: ./.github/actions/godot-deps
      with:
        python-version: '3.10'
        scons-version: 4.4
    - name: Force remove preinstalled .NET SDKs
      if: matrix.build-mono
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        sudo rm -rf /usr/share/dotnet/sdk/*

        BUILDPROF_SCRIPT_EOF

        ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

        bp_rc=0

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Force-remove-preinstalled-NET-SDKs.buildprof" -- $(command -v bash >/dev/null && echo "bash --noprofile --norc -eo pipefail" || echo "sh -e") "$bp_dir/$bp_id.sh" || bp_rc=$?

        kill $bp_watch 2>/dev/null; exit $bp_rc

        '
      shell: sh
    - name: Setup older .NET SDK as baseline
      if: matrix.build-mono
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.100
    - name: Download pre-built AccessKit
      shell: sh
      id: accesskit-sdk
      run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\nif python ./misc/scripts/install_accesskit.py; then\n  echo \"ACCESSKIT_ENABLED=yes\" >> \"$GITHUB_OUTPUT\"\nelse\n  echo \"::warning::AccessKit SDK installation failed, building without AccessKit support.\"\n  echo \"ACCESSKIT_ENABLED=no\" >> \"$GITHUB_OUTPUT\"\nfi\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\n\"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Download-pre-built-AccessKit.buildprof\" -- sh -e \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
    - name: Install mold linker
      if: matrix.install-mold
      uses: rui314/setup-mold@v1
      with:
        make-default: false
    - name: Compilation
      uses: ./.github/actions/godot-build
      with:
        scons-flags: ${{ env.SCONS_FLAGS }} ${{ matrix.scons-flags }} accesskit=${{ steps.accesskit-sdk.outputs.ACCESSKIT_ENABLED }}
        platform: linuxbsd
        target: ${{ matrix.target }}
    - name: Style checks via clangd-tidy
      if: matrix.clangd-tidy
      uses: ./.github/actions/clangd-tidy
      with:
        changed-files: ${{ inputs.changed-files }}
    - name: Compilation (godot-cpp)
      uses: ./.github/actions/godot-cpp-build
      if: matrix.godot-cpp
      with:
        bin: ${{ matrix.bin }}
        scons-flags: target=template_debug dev_build=yes verbose=yes
        godot-cpp-branch: ${{ env.GODOT_CPP_BRANCH }}
    - name: Save Godot build cache
      uses: ./.github/actions/godot-cache-save
      with:
        cache-name: ${{ matrix.cache-name }}
      continue-on-error: true
    - name: Generate C# glue
      if: matrix.build-mono
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        ${{ matrix.bin }} --headless --generate-mono-glue ./modules/mono/glue

        BUILDPROF_SCRIPT_EOF

        ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

        bp_rc=0

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Generate-C-glue.buildprof" -- $(command -v bash >/dev/null && echo "bash --noprofile --norc -eo pipefail" || echo "sh -e") "$bp_dir/$bp_id.sh" || bp_rc=$?

        kill $bp_watch 2>/dev/null; exit $bp_rc

        '
      shell: sh
    - name: Build .NET solutions
      if: matrix.build-mono
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        dotnet --info

        ./modules/mono/build_scripts/build_assemblies.py --godot-output-dir=./bin --godot-platform=linuxbsd --werror

        BUILDPROF_SCRIPT_EOF

        ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

        bp_rc=0

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Build-NET-solutions.buildprof" -- $(command -v bash >/dev/null && echo "bash --noprofile --norc -eo pipefail" || echo "sh -e") "$bp_dir/$bp_id.sh" || bp_rc=$?

        kill $bp_watch 2>/dev/null; exit $bp_rc

        '
      shell: sh
    - name: Prepare artifact
      if: matrix.artifact
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        rm -rf ./bin/build_deps

        strip bin/godot.*

        chmod +x bin/godot.*

        BUILDPROF_SCRIPT_EOF

        ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

        bp_rc=0

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Prepare-artifact.buildprof" -- $(command -v bash >/dev/null && echo "bash --noprofile --norc -eo pipefail" || echo "sh -e") "$bp_dir/$bp_id.sh" || bp_rc=$?

        kill $bp_watch 2>/dev/null; exit $bp_rc

        '
      shell: sh
    - name: Upload artifact
      uses: ./.github/actions/upload-artifact
      if: matrix.artifact
      with:
        name: ${{ matrix.cache-name }}
    - name: Unit tests
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        ${{ matrix.bin }} --version

        ${{ matrix.bin }} --help

        ${{ matrix.bin }} --headless --test --force-colors

        BUILDPROF_SCRIPT_EOF

        ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

        bp_rc=0

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Unit-tests.buildprof" -- $(command -v bash >/dev/null && echo "bash --noprofile --norc -eo pipefail" || echo "sh -e") "$bp_dir/$bp_id.sh" || bp_rc=$?

        kill $bp_watch 2>/dev/null; exit $bp_rc

        '
      shell: sh
    - name: .NET source generators tests
      if: matrix.build-mono
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        dotnet test modules/mono/editor/Godot.NET.Sdk/Godot.SourceGenerators.Tests

        BUILDPROF_SCRIPT_EOF

        ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

        bp_rc=0

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-NET-source-generators-tests.buildprof" -- $(command -v bash >/dev/null && echo "bash --noprofile --norc -eo pipefail" || echo "sh -e") "$bp_dir/$bp_id.sh" || bp_rc=$?

        kill $bp_watch 2>/dev/null; exit $bp_rc

        '
      shell: sh
    - name: Check for class reference updates
      if: matrix.doc-test
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        echo "Running --doctool to see if this changes the public API without updating the documentation."

        echo -e "If a diff is shown, it means that your code/doc changes are incomplete and you should update the class reference with --doctool.\n\n"

        ${{ matrix.bin }} --doctool --headless 2>&1 > /dev/null || true

        git diff --color --exit-code && ! git ls-files --others --exclude-standard | sed -e ''s/^/New doc file missing in PR: /'' | grep ''xml$''

        BUILDPROF_SCRIPT_EOF

        ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

        bp_rc=0

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Check-for-class-reference-updates.buildprof" -- $(command -v bash >/dev/null && echo "bash --noprofile --norc -eo pipefail" || echo "sh -e") "$bp_dir/$bp_id.sh" || bp_rc=$?

        kill $bp_watch 2>/dev/null; exit $bp_rc

        '
      shell: sh
    - name: Check for GDExtension compatibility – JSON check
      if: matrix.api-compat
      run: 'bp_dir="$RUNNER_TEMP/buildprof"; mkdir -p "$bp_dir"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d " ")

        cat > "$bp_dir/$bp_id.sh" <<''BUILDPROF_SCRIPT_EOF''

        ./misc/scripts/validate_extension_api.sh "${{ matrix.bin }}"

        BUILDPROF_SCRIPT_EOF

        ( sleep 2700; while true; do echo "=== buildprof survey watchdog: step still running"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!

        bp_rc=0

        "$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)" --no-open --detach-after-exit 10 -o "$bp_dir/$bp_id-Check-for-GDExtension-compatibility-JSON.buildprof" -- $(command -v bash >/dev/null && echo "bash --noprofile --norc -eo pipefail" || echo "sh -e") "$bp_dir/$bp_id.sh" || bp_rc=$?

        kill $bp_watch 2>/dev/null; exit $bp_rc

        '
      shell: sh
    - name: Test GDExtension compatibility – load methods
      uses: ./.github/actions/godot-compat-test
      if: matrix.api-compat
      with:
        bin: ${{ matrix.bin }}
        reftags: 4.5-stable,4.4-stable
    - name: Test Godot project
      uses: ./.github/actions/godot-project-test
      if: matrix.proj-test
      with:
        bin: ${{ matrix.bin }}
    - name: Test project export
      uses: ./.github/actions/godot-project-export
      if: matrix.proj-export
      with:
        bin: ${{ matrix.bin }}
    - name: Test project converter
      uses: ./.github/actions/godot-converter-test
      if: matrix.proj-conv
      with:
        bin: ${{ matrix.bin }}
    - name: Upload buildprof recordings
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: godot--linux_builds-build-linux-${{ strategy.job-index }}
        path: ${{ runner.temp }}/buildprof/*.buildprof
        retention-days: 30
        if-no-files-found: ignore
        compression-level: 0
    permissions:
      contents: read
