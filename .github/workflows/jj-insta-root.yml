name: 'jj: nextest with and without INSTA_WORKSPACE_ROOT (untraced)'
'on':
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        build:
        - linux-x86_64-gnu
        - windows-x86_64
        mode:
        - default
        - root
        rep:
        - 1
        - 2
        include:
        - build: linux-x86_64-gnu
          os: ubuntu-24.04
          cargo_flags: --all-features
          extra_targets: ''
        - build: windows-x86_64
          os: windows-2022
          cargo_flags: ''
          extra_targets: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        repository: jj-vcs/jj
        ref: 7f96d3ebad9049ccf363973ca7e534e595c3c48b
        persist-credentials: false
    - name: Set up Windows Builders
      if: startswith(matrix.build, 'windows-x86_64')
      uses: ./.github/actions/setup-windows
    - name: Install Rust
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.97.1
        targets: ${{ matrix.extra_targets }}
    - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8
      with:
        tool: nextest
    - name: Install mold
      uses: rui314/setup-mold@da13e0b42e392e3a45d1215033a2270b849d7d36
      with:
        make-default: false
    - name: Build
      run: cargo build --config .cargo/config-ci.toml --workspace --all-targets --verbose ${{ matrix.cargo_flags }}
    - shell: bash
      run: lscpu 2>/dev/null | grep -E 'Model name' || (wmic cpu get name 2>/dev/null | sed -n 2p) || true
    - name: Test
      run: '[ "${{ matrix.mode }}" = root ] && export INSTA_WORKSPACE_ROOT="$PWD"

        start=$(date +%s); rc=0

        cargo nextest run --config .cargo/config-ci.toml --workspace --all-targets --verbose --profile ci ${{ matrix.cargo_flags }} > test.log 2>&1 || rc=$?

        echo "NEXTEST ${{ matrix.build }} ${{ matrix.mode }} $(( $(date +%s) - start )) s rc=$rc"; grep -E "Summary|tests run" test.log | tail -2; exit $rc

        '
      env:
        RUST_BACKTRACE: 1
        CARGO_TERM_COLOR: always
      shell: bash
