name: 'helix: integration profile debuginfo (untraced)'
on: workflow_dispatch
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        debug: [default, line-tables-only, 'false']
        rep: [1, 2]
    env:
      RUST_BACKTRACE: 1
      HELIX_LOG_LEVEL: info
    steps:
    - uses: actions/checkout@v4
      with:
        repository: helix-editor/helix
        ref: ba40e547426b0f9896c8bdc699a4ab11f2b37dbc
    - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
      with:
        toolchain: '1.90'
    - run: lscpu | grep -E 'Model name|^CPU\(s\)'
    - run: |
        start=$(date +%s); cargo test --workspace > test.log 2>&1 || { tail -40 test.log; exit 1; }
        echo "CARGOTEST $(( $(date +%s) - start )) s"
    - run: |
        [ "${{ matrix.debug }}" != default ] && export CARGO_PROFILE_INTEGRATION_DEBUG=${{ matrix.debug }}
        start=$(date +%s); rc=0; cargo integration-test > it.log 2>&1 || rc=$?
        echo "INTEGRATION ${{ matrix.debug }} $(( $(date +%s) - start )) s rc=$rc"; grep -E '^test result' it.log; exit $rc
