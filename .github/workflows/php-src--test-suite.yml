        cxx: clang++
    - name: ./configure
      run: "bp_dir=\"$RUNNER_TEMP/buildprof\"; mkdir -p \"$bp_dir\"; bp_id=$(date +%s)-$$-$(od -An -N4 -tu4 /dev/urandom | tr -d \" \")\ncat > \"$bp_dir/$bp_id.sh\" <<'BUILDPROF_SCRIPT_EOF'\nexport CFLAGS=\"-DZEND_TRACK_ARENA_ALLOC\"\n./buildconf --force\n# msan requires all used libraries to be instrumented,\n# so we should avoiding linking against anything but libc here\n./configure \\\n  --enable-debug \\\n  --enable-zts \\\n  --enable-option-checking=fatal \\\n  --prefix=/usr \\\n  --without-sqlite3 \\\n  --without-pdo-sqlite \\\n  --without-libxml \\\n  --disable-dom \\\n  --disable-simplexml \\\n  --disable-xml \\\n  --disable-xmlreader \\\n  --disable-xmlwriter \\\n  --without-pcre-jit \\\n  --disable-opcache-jit \\\n  --enable-phpdbg \\\n  --enable-fpm \\\n  --with-pdo-mysql=mysqlnd \\\n  --with-mysqli=mysqlnd \\\n  --disable-mysqlnd-compression-support \\\n  --without-pear \\\n  --enable-exif \\\n  --enable-sysvsem \\\n  --enable-sysvshm \\\n  --enable-shmop \\\n  --enable-pcntl \\\n  --enable-mbstring \\\n  --disable-mbregex \\\n  --enable-sockets \\\n  --enable-bcmath \\\n  --enable-calendar \\\n  --enable-ftp \\\n  --enable-zend-test \\\n  --enable-werror \\\n  --enable-memory-sanitizer \\\n  --with-config-file-path=/etc \\\n  --with-config-file-scan-dir=/etc/php.d \\\n  --enable-dl-test=shared\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\nif [ \"$(id -u)\" != 0 ] && sudo -n true 2>/dev/null; then\n  sudo -E env \"PATH=$PATH\" \"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 --run-as \"$(id -un)\" -o \"$bp_dir/$bp_id-configure.buildprof\" -- bash --noprofile --norc -eo pipefail \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nelse\n  \"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-configure.buildprof\" -- bash --noprofile --norc -eo pipefail \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nfi\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
