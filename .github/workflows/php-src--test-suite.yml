ony/Component/Console/Tests/Helper/FileInputHelperTest.php\", $c);'\nfi\nexport SYMFONY_DEPRECATIONS_HELPER=max[total]=999\nX=0\nfor component in $(find src/Symfony -mindepth 2 -type f -name phpunit.xml.dist -printf '%h\\n'); do\n  echo \"::group::$component\"\n  EXIT_CODE=0\n  php ./phpunit $component --exclude-group tty --exclude-group benchmark --exclude-group intl-data --exclude-group transient --exclude-group skip || EXIT_CODE=$?\n  echo -e \"\\n::endgroup::\"\n  if [ ${EXIT_CODE:-0} -gt 128 ]; then\n    X=1;\n    echo \"Failed\"\n  fi\ndone\nexit $X\nBUILDPROF_SCRIPT_EOF\n( sleep 2700; while true; do echo \"=== buildprof survey watchdog: step still running\"; ps -eo pid,ppid,stat,etime,wchan:32,args --forest 2>/dev/null | cut -c1-250 || ps; sleep 600; done ) & bp_watch=$!\nbp_rc=0\nif [ \"$(id -u)\" != 0 ] && sudo -n true 2>/dev/null; then\n  sudo -E env \"PATH=$PATH\" \"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 --run-as \"$(id -un)\" -o \"$bp_dir/$bp_id-Test-Symfony.buildprof\" -- bash --noprofile --norc -eo pipefail \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nelse\n  \"$RUNNER_TEMP/buildprof-bin/buildprof-$(uname -m)\" --no-open --detach-after-exit 10 -o \"$bp_dir/$bp_id-Test-Symfony.buildprof\" -- bash --noprofile --norc -eo pipefail \"$bp_dir/$bp_id.sh\" || bp_rc=$?\nfi\nkill $bp_watch 2>/dev/null; exit $bp_rc\n"
